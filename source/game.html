Arcade Aces", "Arkadni asovi", "Assi dell'arcade", "Arcade-Asse", "Ases del arcade", "As de l'arcade", "Άσοι του arcade", "Arkadni asovi", "Arkadni asi"], ["Sunny Shore Crew", "Posada sunčane obale", "Equipaggio della costa soleggiata", "Sonnenstrand-Crew", "Tripulación de la costa soleada", "Équipage du rivage ensoleillé", "Πλήρωμα της ηλιόλουστης ακτής", "Posada sunčane obale", "Posadka sončne obale"], ["Splash Squad", "Odred pljusak", "Squadra Splash", "Platsch-Trupp", "Escuadrón Chapuzón", "Escouade Plouf", "Ομάδα Πλατς", "Odred pljusak", "Čofotajoča četa"], ["Cave Crew", "Špiljska ekipa", "Squadra della grotta", "Höhlen-Crew", "Equipo de la cueva", "Équipe de la grotte", "Πλήρωμα της σπηλιάς", "Pećinska ekipa", "Jamska ekipa"], ["Gem Squad", "Odred dragulja", "Squadra delle gemme", "Edelstein-Trupp", "Escuadrón de gemas", "Escouade des gemmes", "Ομάδα πολύτιμων λίθων", "Odred dragulja", "Draguljna četa"], ["Steals number crates with its claws and runs off sideways, like a real crab.", "Krade sanduke s brojevima svojim kliještima i bježi bočno, kao pravi rak.", "Ruba le casse dei numeri con le chele e scappa di lato, come un vero granchio.", "Klaut Zahlenkisten mit seinen Scheren und rennt seitwärts davon, wie ein echter Krebs.", "Roba cajas de números con sus pinzas y huye de lado, como un cangrejo de verdad.", "Vole les caisses de nombres avec ses pinces et s'enfuit de côté, comme un vrai crabe.", "Κλέβει κιβώτια με αριθμούς με τις δαγκάνες του και το σκάει στο πλάι, σαν αληθινό καβούρι.", "Krade sanduke s brojevima svojim kleštima i beži bočno, kao pravi rak.", "S kleščami krade zaboje s števili in beži vstran, kot pravi rak."], ["A grumpy ship with a drill on its nose. It drills holes in numbers, so you patch them with the right answer.", "Gunđalo s bušilicom na nosu. Buši rupe u brojevima pa ih treba zakrpati točnim odgovorom.", "Un brontolone con un trapano sul naso. Fa buchi nei numeri e tu li tappi con la risposta giusta.", "Ein Brummbär mit einem Bohrer auf der Nase. Er bohrt Löcher in Zahlen, die du mit der richtigen Antwort flickst.", "Un gruñón con un taladro en la nariz. Hace agujeros en los números y hay que taparlos con la respuesta correcta.", "Un grincheux avec une perceuse sur le nez. Il perce des trous dans les nombres, à boucher avec la bonne réponse.", "Ένας γκρινιάρης με τρυπάνι στη μύτη. Τρυπάει τους αριθμούς και τους μπαλώνεις με τη σωστή απάντηση.", "Gunđalo s bušilicom na nosu. Buši rupe u brojevima pa ih treba zakrpiti tačnim odgovorom.", "Godrnjač s svedrom na nosu. V števila vrta luknje, ki jih zakrpaš s pravilnim odgovorom."], ["A big purple horseshoe magnet that pulls in right answers and tries to hide them.", "Velika ljubičasta potkovica koja privlači točne odgovore i pokušava ih sakriti.", "Una grande calamita viola a ferro di cavallo che attira le risposte giuste e cerca di nasconderle.", "Ein großer lila Hufeisenmagnet, der richtige Antworten anzieht und sie verstecken will.", "Un gran imán morado de herradura que atrae las respuestas correctas e intenta esconderlas.", "Un gros aimant violet en fer à cheval qui attire les bonnes réponses et essaie de les cacher.", "Ένας μεγάλος μωβ μαγνήτης-πέταλο που τραβά τις σωστές απαντήσεις και προσπαθεί να τις κρύψει.", "Velika ljubičasta potkovica koja privlači tačne odgovore i pokušava da ih sakrije.", "Velik vijoličast magnet v obliki podkve, ki privlači pravilne odgovore in jih skuša skriti."], ["A spiky floating mine with one angry eye. It just waits for you to make a mistake.", "Bodljikava lebdeća mina s jednim ljutim okom. Samo stoji i čeka da pogriješiš.", "Una mina galleggiante spinosa con un occhio arrabbiato. Aspetta solo che tu sbagli.", "Eine stachelige Schwebemine mit einem wütenden Auge. Sie wartet nur darauf, dass du dich irrst.", "Una mina flotante con pinchos y un ojo enfadado. Solo espera a que te equivoques.", "Une mine flottante à piques avec un œil furieux. Elle attend juste que tu te trompes.", "Μια αγκαθωτή αιωρούμενη νάρκη με ένα θυμωμένο μάτι. Απλώς περιμένει να κάνεις λάθος.", "Bodljikava lebdeća mina s jednim ljutim okom. Samo stoji i čeka da pogrešiš.", "Bodičasta lebdeča mina z enim jeznim očesom. Samo čaka, da se zmotiš."], ["A space shark with a red visor. It bites crates and leaves tooth marks on the digits.", "Svemirski morski pas s crvenim vizirom. Grize sanduke i ostavlja tragove zuba na znamenkama.", "Uno squalo spaziale con la visiera rossa. Morde le casse e lascia i segni dei denti sulle cifre.", "Ein Weltraumhai mit rotem Visier. Er beißt in Kisten und hinterlässt Zahnabdrücke auf den Ziffern.", "Un tiburón espacial con visera roja. Muerde las cajas y deja marcas de dientes en las cifras.", "Un requin de l'espace à visière rouge. Il mord les caisses et laisse des traces de dents sur les chiffres.", "Ένας διαστημικός καρχαρίας με κόκκινο γείσο. Δαγκώνει κιβώτια και αφήνει σημάδια από δόντια στα ψηφία.", "Svemirska ajkula s crvenim vizirom. Grize sanduke i ostavlja tragove zuba na ciframa.", "Vesoljski morski pes z rdečim vizirjem. Grize zaboje in na števkah pušča sledi zob."], ["A sleepy cloud in a nightcap. It yawns and tries to put Zeebot to sleep, so be quick!", "Pospani oblak s kapicom za spavanje. Zijeva i pokušava uspavati Zeebota, zato budi brz!", "Una nuvola assonnata con la cuffia da notte. Sbadiglia e cerca di addormentare Zeebot, quindi sii veloce!", "Eine verschlafene Wolke mit Schlafmütze. Sie gähnt und will Zeebot einschläfern, also sei schnell!", "Una nube dormilona con gorro de dormir. Bosteza e intenta dormir a Zeebot, ¡así que sé rápido!", "Un nuage endormi en bonnet de nuit. Il bâille et essaie d'endormir Zeebot, alors fais vite !", "Ένα νυσταγμένο σύννεφο με σκουφάκι ύπνου. Χασμουριέται και προσπαθεί να κοιμίσει τον Zeebot, γι' αυτό βιάσου!", "Pospani oblak s kapicom za spavanje. Zeva i pokušava da uspava Zeebota, zato budi brz!", "Zaspan oblak s spalno kapico. Zeha in skuša uspavati Zeebota, zato bodi hiter!"], ["A pink squid that squirts dark ink and hides the numbers for a moment.", "Ružičasta lignja koja prska tamnu tintu i na tren sakriva brojeve.", "Un calamaro rosa che spruzza inchiostro scuro e nasconde i numeri per un attimo.", "Ein rosa Tintenfisch, der dunkle Tinte spritzt und die Zahlen kurz versteckt.", "Un calamar rosa que lanza tinta oscura y esconde los números un momento.", "Un calmar rose qui crache de l'encre noire et cache les nombres un instant.", "Ένα ροζ καλαμάρι που ψεκάζει σκούρο μελάνι και κρύβει τους αριθμούς για μια στιγμή.", "Roze lignja koja prska tamno mastilo i na tren sakriva brojeve.", "Rožnat lignji, ki brizgne temno črnilo in za hip skrije števila."], ["A striped hornet that flies in a swarm. The more right answers, the less it buzzes.", "Prugasti stršljen koji leti u roju. Što više točnih odgovora, to manje zuji.", "Un calabrone a strisce che vola in sciame. Più risposte giuste, meno ronza.", "Eine gestreifte Hornisse, die im Schwarm fliegt. Je mehr richtige Antworten, desto weniger summt sie.", "Un avispón a rayas que vuela en enjambre. Cuantas más respuestas correctas, menos zumba.", "Un frelon rayé qui vole en essaim. Plus il y a de bonnes réponses, moins il bourdonne.", "Μια ριγέ σφήκα που πετά σε σμήνος. Όσο πιο πολλές σωστές απαντήσεις, τόσο λιγότερο βουίζει.", "Prugasti stršljen koji leti u roju. Što više tačnih odgovora, to manje zuji.", "Progast sršen, ki leti v roju. Več ko je pravilnih odgovorov, manj brenči."], ["A frog on springs that jumps from asteroid to asteroid and catches numbers with its tongue.", "Žaba na oprugama koja skače s asteroida na asteroid i jezikom hvata brojeve.", "Una rana a molle che salta da un asteroide all'altro e cattura i numeri con la lingua.", "Ein Frosch auf Sprungfedern, der von Asteroid zu Asteroid hüpft und Zahlen mit der Zunge fängt.", "Una rana con muelles que salta de asteroide en asteroide y atrapa números con la lengua.", "Une grenouille à ressorts qui saute d'astéroïde en astéroïde et attrape les nombres avec sa langue.", "Ένας βάτραχος με ελατήρια που πηδά από αστεροειδή σε αστεροειδή και πιάνει αριθμούς με τη γλώσσα του.", "Žaba na oprugama koja skače s asteroida na asteroid i jezikom hvata brojeve.", "Žaba na vzmeteh, ki skače z asteroida na asteroid in z jezikom lovi števila."], ["A slow but strong turtle. Its hexagon shield protects Zeebot from one hit.", "Spora ali jaka kornjača. Njezin štit od šesterokuta čuva Zeebota od jednog pogotka.", "Una tartaruga lenta ma forte. Il suo scudo esagonale protegge Zeebot da un colpo.", "Eine langsame, aber starke Schildkröte. Ihr Sechseck-Schild schützt Zeebot vor einem Treffer.", "Una tortuga lenta pero fuerte. Su escudo hexagonal protege a Zeebot de un golpe.", "Une tortue lente mais forte. Son bouclier hexagonal protège Zeebot d'un coup.", "Μια αργή αλλά δυνατή χελώνα. Η εξαγωνική ασπίδα της προστατεύει τον Zeebot από ένα χτύπημα.", "Spora ali jaka kornjača. Njen štit od šestougaonika čuva Zeebota od jednog pogotka.", "Počasna, a močna želva. Njen šesterokotni ščit Zeebota obvaruje pred enim zadetkom."], ["An owl with two telescopes for eyes. It sees from far away which answer is right and winks.", "Sova s dva teleskopa umjesto očiju. Izdaleka vidi koji je odgovor točan i namigne.", "Un gufo con due telescopi al posto degli occhi. Vede da lontano qual è la risposta giusta e fa l'occhiolino.", "Eine Eule mit zwei Fernrohren als Augen. Sie sieht von Weitem, welche Antwort stimmt, und zwinkert.", "Un búho con dos telescopios por ojos. Ve desde lejos cuál es la respuesta correcta y guiña un ojo.", "Un hibou avec deux télescopes à la place des yeux. Il voit de loin quelle réponse est juste et fait un clin d'œil.", "Μια κουκουβάγια με δύο τηλεσκόπια για μάτια. Βλέπει από μακριά ποια απάντηση είναι σωστή και κλείνει το μάτι.", "Sova sa dva teleskopa umesto očiju. Izdaleka vidi koji je odgovor tačan i namigne.", "Sova z dvema teleskopoma namesto oči. Od daleč vidi, kateri odgovor je pravilen, in pomežikne."], ["A white capsule with robot arms and a wrench. It repairs Zeebot when its battery runs low.", "Bijela kapsula s robotskim rukama i ključem. Popravlja Zeebota kad ostane bez baterije.", "Una capsula bianca con braccia robotiche e una chiave. Ripara Zeebot quando resta senza batteria.", "Eine weiße Kapsel mit Roboterarmen und einem Schraubenschlüssel. Sie repariert Zeebot, wenn der Akku leer wird.", "Una cápsula blanca con brazos robóticos y una llave. Repara a Zeebot cuando se queda sin batería.", "Une capsule blanche avec des bras robotiques et une clé. Elle répare Zeebot quand sa batterie faiblit.", "Μια λευκή κάψουλα με ρομποτικά χέρια και κλειδί. Επισκευάζει τον Zeebot όταν αδειάζει η μπαταρία του.", "Bela kapsula sa robotskim rukama i ključem. Popravlja Zeebota kad ostane bez baterije.", "Bela kapsula z robotskimi rokami in ključem. Popravi Zeebota, ko mu zmanjka baterije."], ["A penguin in a cap that slides over frozen comets. The fastest star delivery around.", "Pingvin s kapom koji klizi po zaleđenim kometima. Najbrži dostavljač zvjezdica.", "Un pinguino con il berretto che scivola sulle comete ghiacciate. Il fattorino di stelle più veloce.", "Ein Pinguin mit Mütze, der über gefrorene Kometen rutscht. Der schnellste Sternchen-Lieferdienst.", "Un pingüino con gorra que se desliza por cometas helados. El repartidor de estrellas más rápido.", "Un pingouin à casquette qui glisse sur les comètes gelées. Le livreur d'étoiles le plus rapide.", "Ένας πιγκουίνος με σκουφί που γλιστρά πάνω σε παγωμένους κομήτες. Ο πιο γρήγορος διανομέας αστεριών.", "Pingvin s kapom koji klizi po zaleđenim kometama. Najbrži dostavljač zvezdica.", "Pingvin s kapo, ki drsi po zamrznjenih kometih. Najhitrejši dostavljavec zvezdic."], ["A little firefly with a lamp on its tail. It lights up dark nebulas so the numbers are easier to see.", "Mala krijesnica s lampom na repu. Osvjetljava mračne maglice da se brojevi bolje vide.", "Una piccola lucciola con una lampada sulla coda. Illumina le nebulose buie così i numeri si vedono meglio.", "Ein kleines Glühwürmchen mit einer Lampe am Schwanz. Es erhellt dunkle Nebel, damit man die Zahlen besser sieht.", "Una pequeña luciérnaga con una lámpara en la cola. Ilumina las nebulosas oscuras para ver mejor los números.", "Une petite luciole avec une lampe sur la queue. Elle éclaire les nébuleuses sombres pour mieux voir les nombres.", "Μια μικρή πυγολαμπίδα με λάμπα στην ουρά. Φωτίζει σκοτεινά νεφελώματα για να φαίνονται καλύτερα οι αριθμοί.", "Mali svitac sa lampom na repu. Osvetljava mračne magline da se brojevi bolje vide.", "Majhna kresnica z lučko na repu. Osvetljuje temne meglice, da se števila bolje vidijo."], ["A giant space whale, the mothership. It carries Zeebot's whole crew in its belly.", "Ogromni svemirski kit, matični brod. U trbuhu nosi cijelu Zeebotovu posadu.", "Un'enorme balena spaziale, la nave madre. Porta nella pancia tutto l'equipaggio di Zeebot.", "Ein riesiger Weltraumwal, das Mutterschiff. In seinem Bauch trägt er Zeebots ganze Crew.", "Una enorme ballena espacial, la nave nodriza. Lleva en la barriga a toda la tripulación de Zeebot.", "Une énorme baleine de l'espace, le vaisseau mère. Elle transporte tout l'équipage de Zeebot dans son ventre.", "Μια τεράστια διαστημική φάλαινα, το μητρικό σκάφος. Κουβαλά στην κοιλιά της όλο το πλήρωμα του Zeebot.", "Ogromni svemirski kit, matični brod. U stomaku nosi celu Zeebotovu posadu.", "Ogromen vesoljski kit, matična ladja. V trebuhu nosi vso Zeebotovo posadko."], ["A flying pizza slice that delivers snacks to pilots. Tasty and fast, guaranteed hot.", "Leteća kriška pizze koja dostavlja užinu pilotima. Ukusno i brzo, zajamčeno vruće.", "Una fetta di pizza volante che consegna merende ai piloti. Buona e veloce, garantita calda.", "Ein fliegendes Pizzastück, das den Piloten Snacks bringt. Lecker und schnell, garantiert heiß.", "Una porción de pizza voladora que lleva meriendas a los pilotos. Rica y rápida, garantizada caliente.", "Une part de pizza volante qui livre le goûter aux pilotes. Bonne et rapide, garantie chaude.", "Ένα ιπτάμενο κομμάτι πίτσα που φέρνει σνακ στους πιλότους. Νόστιμο και γρήγορο, εγγυημένα ζεστό.", "Leteće parče pice koje dostavlja užinu pilotima. Ukusno i brzo, garantovano vruće.", "Leteči kos pice, ki pilotom dostavlja malico. Okusno in hitro, zagotovo vroče."], ["A jet-powered teapot. When it overheats, it whistles and puffs out little clouds of steam.", "Čajnik na mlazni pogon. Kad se pregrije, zviždi i ispušta oblačiće pare.", "Una teiera a reazione. Quando si surriscalda, fischia e sbuffa nuvolette di vapore.", "Eine Teekanne mit Düsenantrieb. Wenn sie überhitzt, pfeift sie und pustet Dampfwölkchen aus.", "Una tetera a reacción. Cuando se recalienta, silba y suelta nubecitas de vapor.", "Une théière à réaction. Quand elle surchauffe, elle siffle et crache de petits nuages de vapeur.", "Μια τσαγιέρα με τζετ. Όταν υπερθερμαίνεται, σφυρίζει και βγάζει συννεφάκια ατμού.", "Čajnik na mlazni pogon. Kad se pregreje, zviždi i ispušta oblačiće pare.", "Čajnik na reaktivni pogon. Ko se pregreje, zažvižga in spušča oblačke pare."], ["A space unicycle that keeps wobbling. Nobody knows how it never tips over.", "Svemirski monocikl koji se stalno ljulja. Nitko ne zna kako se ne prevrne.", "Un monociclo spaziale che dondola sempre. Nessuno sa come non si ribalti mai.", "Ein Weltraum-Einrad, das ständig wackelt. Niemand weiß, warum es nie umkippt.", "Un monociclo espacial que se tambalea sin parar. Nadie sabe cómo no se cae.", "Un monocycle de l'espace qui oscille sans arrêt. Personne ne sait comment il ne tombe jamais.", "Ένας διαστημικός μονότροχος που όλο κουνιέται. Κανείς δεν ξέρει πώς δεν αναποδογυρίζει ποτέ.", "Svemirski monocikl koji se stalno ljulja. Niko ne zna kako se ne prevrne.", "Vesoljski monocikel, ki se ves čas maje. Nihče ne ve, kako se nikoli ne prevrne."], ["A colourful balloon with a small capsule underneath. It slowly floats to the Moon and back.", "Šareni balon s malom kapsulom ispod. Polako plovi do Mjeseca i natrag.", "Un pallone colorato con una piccola capsula sotto. Fluttua piano fino alla Luna e ritorno.", "Ein bunter Ballon mit einer kleinen Kapsel darunter. Er schwebt langsam zum Mond und zurück.", "Un globo de colores con una pequeña cápsula debajo. Flota despacio hasta la Luna y vuelve.", "Un ballon coloré avec une petite capsule dessous. Il flotte doucement jusqu'à la Lune et revient.", "Ένα πολύχρωμο μπαλόνι με μια μικρή κάψουλα από κάτω. Ταξιδεύει αργά ως τη Σελήνη και πίσω.", "Šareni balon s malom kapsulom ispod. Polako plovi do Meseca i nazad.", "Pisan balon z majhno kapsulo spodaj. Počasi pluje do Lune in nazaj."], ["A snail with a rocket on its shell. It says EXPRESS, but it still arrives last.", "Puž s raketom na kućici. Piše EXPRESS, ali i dalje stiže posljednji.", "Una lumaca con un razzo sul guscio. C'è scritto EXPRESS, ma arriva sempre ultima.", "Eine Schnecke mit einer Rakete auf dem Haus. Drauf steht EXPRESS, aber sie kommt trotzdem als Letzte an.", "Un caracol con un cohete en el caparazón. Pone EXPRESS, pero sigue llegando el último.", "Un escargot avec une fusée sur sa coquille. C'est écrit EXPRESS, mais il arrive quand même le dernier.", "Ένα σαλιγκάρι με πύραυλο στο καβούκι. Γράφει EXPRESS, αλλά φτάνει πάντα τελευταίο.", "Puž s raketom na kućici. Piše EXPRESS, ali i dalje stiže poslednji.", "Polž z raketo na hišici. Piše EXPRESS, a še vedno pride zadnji."], ["Blinky the bat hangs upside down and keeps blinking. When it flies in, it buzzes in Zeebot's ear and steals seconds.", "Šišmiš Žmirko visi naglavačke i stalno žmirka. Kad doleti, zuji Zeebotu u uho i krade sekunde.", "Il pipistrello Ammiccone sta a testa in giù e sbatte sempre le palpebre. Quando arriva, ronza nell'orecchio di Zeebot e ruba secondi.", "Fledermaus Blinzel hängt kopfüber und blinzelt ständig. Wenn sie heranfliegt, summt sie Zeebot ins Ohr und klaut Sekunden.", "El murciélago Parpadeos cuelga boca abajo y no deja de parpadear. Cuando llega, zumba en el oído de Zeebot y roba segundos.", "La chauve-souris Clignotte pend la tête en bas et cligne sans arrêt des yeux. Quand elle arrive, elle bourdonne à l'oreille de Zeebot et vole des secondes.", "Η νυχτερίδα Ανοιγοκλείνω κρέμεται ανάποδα και όλο ανοιγοκλείνει τα μάτια. Όταν έρχεται, βουίζει στο αυτί του Zeebot και κλέβει δευτερόλεπτα.", "Slepi miš Žmirko visi naglavačke i stalno žmirka. Kad doleti, zuji Zeebotu u uho i krade sekunde.", "Netopir Mežikač visi z glavo navzdol in ves čas mežika. Ko prileti, Zeebotu brenči v uho in krade sekunde."], ["A loud bat with a microphone. Its echo makes the digits in the problem swap places!", "Glasni šišmiš s mikrofonom. Od njegove jeke znamenke u zadatku zamijene mjesta!", "Un pipistrello rumoroso con un microfono. La sua eco fa scambiare di posto le cifre del problema!", "Eine laute Fledermaus mit Mikrofon. Ihr Echo lässt die Ziffern in der Aufgabe die Plätze tauschen!", "Un murciélago ruidoso con micrófono. ¡Su eco hace que las cifras del problema cambien de sitio!", "Une chauve-souris bruyante avec un micro. Son écho fait échanger leur place aux chiffres du problème !", "Μια φωνακλού νυχτερίδα με μικρόφωνο. Η ηχώ της κάνει τα ψηφία στο πρόβλημα να αλλάζουν θέση!", "Glasni slepi miš sa mikrofonom. Od njegovog eha cifre u zadatku zamene mesta!", "Glasen netopir z mikrofonom. Zaradi njegovega odmeva števke v nalogi zamenjajo mesta!"], ["An angry robot stalactite. It hangs, waits, waits… and then BOOM, it drops and takes the problem away.", "Ljuti robotski stalaktit. Visi, čeka, čeka… i onda BUM padne i odnese zadatak.", "Una stalattite robot arrabbiata. Pende, aspetta, aspetta… e poi BUM, cade e si porta via il problema.", "Ein wütender Roboter-Tropfstein. Er hängt, wartet, wartet… und dann BUMM, fällt er und nimmt die Aufgabe mit.", "Una estalactita robot enfadada. Cuelga, espera, espera… y entonces ¡BUM!, cae y se lleva el problema.", "Une stalactite robot en colère. Elle pend, attend, attend… et puis BOUM, elle tombe et emporte le problème.", "Ένας θυμωμένος ρομποτικός σταλακτίτης. Κρέμεται, περιμένει, περιμένει… και μετά ΜΠΑΜ, πέφτει και παίρνει μαζί του το πρόβλημα.", "Ljuti robotski stalaktit. Visi, čeka, čeka… i onda BUM padne i odnese zadatak.", "Jezen robotski kapnik. Visi, čaka, čaka… in potem BUM, pade in odnese nalogo."], ["An eagle with ski goggles. From the mountain top it sees the whole answer.", "Orao sa skijaškim naočalama. S vrha planine vidi cijeli odgovor.", "Un'aquila con gli occhiali da sci. Dalla cima della montagna vede tutta la risposta.", "Ein Adler mit Skibrille. Vom Berggipfel aus sieht er die ganze Antwort.", "Un águila con gafas de esquí. Desde la cima de la montaña ve toda la respuesta.", "Un aigle avec des lunettes de ski. Du haut de la montagne, il voit toute la réponse.", "Ένας αετός με μάσκα σκι. Από την κορυφή του βουνού βλέπει όλη την απάντηση.", "Orao sa skijaškim naočarima. S vrha planine vidi ceo odgovor.", "Orel s smučarskimi očali. Z vrha gore vidi cel odgovor."], ["A fast rocket sled. When it whooshes in, you get 10 more seconds.", "Brze sanjke s raketom. Kad zazuje, dobiješ 10 sekundi više.", "Una slitta veloce a razzo. Quando sfreccia, ottieni 10 secondi in più.", "Ein schneller Raketenschlitten. Wenn er heransaust, bekommst du 10 Sekunden mehr.", "Un trineo cohete veloz. Cuando pasa zumbando, ganas 10 segundos más.", "Une luge-fusée rapide. Quand elle file, tu gagnes 10 secondes de plus.", "Ένα γρήγορο έλκηθρο-πύραυλος. Όταν περνά σφυρίζοντας, παίρνεις 10 δευτερόλεπτα παραπάνω.", "Brze sanke sa raketom. Kad zazuje, dobiješ 10 sekundi više.", "Hitre sani z raketo. Ko prižvižgajo, dobiš 10 sekund več."], ["A kind robot yeti. Its shield blocks the next hit.", "Dobri robotski jeti. Svojim štitom blokira sljedeći udarac.", "Un buon yeti robot. Il suo scudo blocca il colpo successivo.", "Ein lieber Roboter-Yeti. Sein Schild blockt den nächsten Treffer.", "Un yeti robot bondadoso. Su escudo bloquea el siguiente golpe.", "Un gentil yéti robot. Son bouclier bloque le coup suivant.", "Ένας καλός ρομποτικός γέτι. Η ασπίδα του μπλοκάρει το επόμενο χτύπημα.", "Dobri robotski jeti. Svojim štitom blokira sledeći udarac.", "Prijazen robotski jeti. S ščitom ustavi naslednji udarec."], ["An ice bird with a propeller. When it blows, it freezes and steals 4 seconds.", "Ledena ptica s propelerom. Kad puhne, zamrzne i ukrade 4 sekunde.", "Un uccello di ghiaccio con l'elica. Quando soffia, congela e ruba 4 secondi.", "Ein Eisvogel mit Propeller. Wenn er pustet, friert er alles ein und klaut 4 Sekunden.", "Un pájaro de hielo con hélice. Cuando sopla, congela y roba 4 segundos.", "Un oiseau de glace à hélice. Quand il souffle, il gèle tout et vole 4 secondes.", "Ένα παγωμένο πουλί με έλικα. Όταν φυσάει, παγώνει τα πάντα και κλέβει 4 δευτερόλεπτα.", "Ledena ptica sa propelerom. Kad dune, zamrzne i ukrade 4 sekunde.", "Ledena ptica s propelerjem. Ko zapiha, zamrzne in ukrade 4 sekunde."], ["A robot goat with a jet engine. It butts with its horns and shuffles the answers.", "Robotska koza s mlaznim motorom. Udari rogovima i ispremiješa odgovore.", "Una capra robot con motore a reazione. Dà una cornata e mescola le risposte.", "Eine Robo-Ziege mit Düsentriebwerk. Sie stößt mit den Hörnern und mischt die Antworten durch.", "Una cabra robot con motor a reacción. Embiste con los cuernos y revuelve las respuestas.", "Une chèvre robot à réacteur. Elle donne un coup de cornes et mélange les réponses.", "Μια ρομποτική κατσίκα με κινητήρα τζετ. Χτυπά με τα κέρατα και ανακατεύει τις απαντήσεις.", "Robotska koza sa mlaznim motorom. Udari rogovima i izmeša odgovore.", "Robotska koza z reaktivnim motorjem. Butne z rogovi in premeša odgovore."], ["An angry snowball with a fuse. It rolls and rolls… and BOOM!", "Ljuta grudva s fitiljem. Kotrlja se, kotrlja… i BUM!", "Una palla di neve arrabbiata con la miccia. Rotola, rotola… e BUM!", "Ein wütender Schneeball mit Zündschnur. Er rollt und rollt… und BUMM!", "Una bola de nieve enfadada con mecha. Rueda y rueda… ¡y BUM!", "Une boule de neige en colère avec une mèche. Elle roule, roule… et BOUM !", "Μια θυμωμένη χιονόμπαλα με φιτίλι. Κυλάει, κυλάει… και ΜΠΑΜ!", "Ljuta grudva sa fitiljem. Kotrlja se, kotrlja… i BUM!", "Jezna snežna kepa z vžigalno vrvico. Kotali se, kotali… in BUM!"], ["Captain seagull. It flaps its wings and chases away two wrong answers.", "Galeb kapetan. Zamahne krilima i otjera dva pogrešna odgovora.", "Il gabbiano capitano. Sbatte le ali e scaccia due risposte sbagliate.", "Kapitän Möwe. Sie schlägt mit den Flügeln und verscheucht zwei falsche Antworten.", "La gaviota capitana. Bate las alas y ahuyenta dos respuestas incorrectas.", "Le capitaine mouette. Il bat des ailes et chasse deux mauvaises réponses.", "Ο γλάρος καπετάνιος. Χτυπά τα φτερά του και διώχνει δύο λάθος απαντήσεις.", "Galeb kapetan. Zamahne krilima i otera dva pogrešna odgovora.", "Galeb kapitan. Zamahne s krili in prežene dva napačna odgovora."], ["A cheerful robot buoy. It glows green and repairs one bar of energy.", "Veseli robotski plovak. Svijetli zeleno i popravi jednu crticu energije.", "Una boa robot allegra. Si illumina di verde e ripara una barra di energia.", "Eine fröhliche Roboter-Boje. Sie leuchtet grün und repariert einen Energiebalken.", "Una boya robot alegre. Brilla en verde y repara una barra de energía.", "Une bouée robot joyeuse. Elle brille en vert et répare une barre d'énergie.", "Μια χαρούμενη ρομποτική σημαδούρα. Λάμπει πράσινη και επισκευάζει μία μπάρα ενέργειας.", "Veseli robotski plovak. Svetli zeleno i popravi jednu crticu energije.", "Vesela robotska boja. Zeleno zasveti in popravi eno črtico energije."], ["A fast dolphin. It skips a problem with no penalty, like jumping over a wave.", "Brzi dupin. Preskoči zadatak bez kazne, kao da skače preko vala.", "Un delfino veloce. Salta un problema senza penalità, come un salto sopra un'onda.", "Ein schneller Delfin. Er überspringt eine Aufgabe ohne Strafe, wie einen Sprung über eine Welle.", "Un delfín veloz. Se salta un problema sin penalización, como si saltara una ola.", "Un dauphin rapide. Il saute un problème sans pénalité, comme un saut par-dessus une vague.", "Ένα γρήγορο δελφίνι. Προσπερνά ένα πρόβλημα χωρίς ποινή, σαν να πηδά πάνω από ένα κύμα.", "Brzi delfin. Preskoči zadatak bez kazne, kao da skače preko talasa.", "Hiter delfin. Brez kazni preskoči nalogo, kot bi skočil čez val."], ["A pirate parrot with an eye patch. It squawks and grabs 4 seconds.", "Gusarska papiga s povezom na oku. Zakriješti i zgrabi 4 sekunde.", "Un pappagallo pirata con la benda sull'occhio. Gracchia e afferra 4 secondi.", "Ein Piratenpapagei mit Augenklappe. Er krächzt und schnappt sich 4 Sekunden.", "Un loro pirata con parche en el ojo. Grazna y se lleva 4 segundos.", "Un perroquet pirate avec un bandeau sur l'œil. Il criaille et attrape 4 secondes.", "Ένας πειρατής παπαγάλος με κάλυμμα στο μάτι. Κρώζει και αρπάζει 4 δευτερόλεπτα.", "Gusarski papagaj sa povezom na oku. Zakrešti i zgrabi 4 sekunde.", "Piratska papiga s prevezo čez oko. Zakriči in zgrabi 4 sekunde."], ["A robot octopus. It ties up the answers with its tentacles and shuffles them.", "Robotska hobotnica. Svojim krakovima zaveže i ispremiješa odgovore.", "Un polpo robot. Lega le risposte con i tentacoli e le mescola.", "Ein Roboter-Krake. Er verknotet die Antworten mit seinen Armen und mischt sie.", "Un pulpo robot. Ata las respuestas con sus tentáculos y las revuelve.", "Une pieuvre robot. Elle attache les réponses avec ses tentacules et les mélange.", "Ένα ρομποτικό χταπόδι. Δένει τις απαντήσεις με τα πλοκάμια του και τις ανακατεύει.", "Robotska hobotnica. Svojim krakovima zaveže i izmeša odgovore.", "Robotska hobotnica. S lovkami zveže odgovore in jih premeša."], ["An angry floating mine. It bobs on the waves… and then BOOM!", "Ljuta plutajuća mina. Klacka se na valovima… i onda BUM!", "Una mina galleggiante arrabbiata. Dondola sulle onde… e poi BUM!", "Eine wütende Treibmine. Sie schaukelt auf den Wellen… und dann BUMM!", "Una mina flotante enfadada. Se balancea en las olas… ¡y entonces BUM!", "Une mine flottante en colère. Elle se balance sur les vagues… et puis BOUM !", "Μια θυμωμένη πλωτή νάρκη. Λικνίζεται στα κύματα… και μετά ΜΠΑΜ!", "Ljuta plutajuća mina. Klacka se na talasima… i onda BUM!", "Jezna plavajoča mina. Ziba se na valovih… in potem BUM!"], ["A cheerful traffic light. It turns green and the clock runs half as fast.", "Veseli semafor. Upali zeleno svjetlo i sat ide upola sporije.", "Un semaforo allegro. Accende il verde e l'orologio va a metà velocità.", "Eine fröhliche Ampel. Sie schaltet auf Grün und die Uhr läuft nur halb so schnell.", "Un semáforo alegre. Se pone en verde y el reloj va a la mitad de velocidad.", "Un feu tricolore joyeux. Il passe au vert et l'horloge va deux fois moins vite.", "Ένα χαρούμενο φανάρι. Ανάβει πράσινο και το ρολόι πάει στο μισό της ταχύτητας.", "Veseli semafor. Upali zeleno svetlo i sat ide upola sporije.", "Vesel semafor. Prižge zeleno luč in ura teče pol počasneje."], ["A yellow taxi with a clock on the roof. It brings you 10 more seconds.", "Žuti taksi sa satom na krovu. Doveze ti 10 sekundi više.", "Un taxi giallo con un orologio sul tetto. Ti porta 10 secondi in più.", "Ein gelbes Taxi mit einer Uhr auf dem Dach. Es bringt dir 10 Sekunden mehr.", "Un taxi amarillo con un reloj en el techo. Te trae 10 segundos más.", "Un taxi jaune avec une horloge sur le toit. Il t'apporte 10 secondes de plus.", "Ένα κίτρινο ταξί με ρολόι στην οροφή. Σου φέρνει 10 δευτερόλεπτα παραπάνω.", "Žuti taksi sa satom na krovu. Doveze ti 10 sekundi više.", "Rumen taksi z uro na strehi. Pripelje ti 10 sekund več."], ["A tow truck. It comes with a hook and a wrench and repairs one bar of energy.", "Šlep služba. Dođe s kukom i ključem i popravi jednu crticu energije.", "Un carro attrezzi. Arriva con gancio e chiave e ripara una barra di energia.", "Ein Abschleppwagen. Er kommt mit Haken und Schlüssel und repariert einen Energiebalken.", "Una grúa. Llega con gancho y llave y repara una barra de energía.", "Une dépanneuse. Elle arrive avec un crochet et une clé et répare une barre d'énergie.", "Ένας γερανός οδικής βοήθειας. Έρχεται με γάντζο και κλειδί και επισκευάζει μία μπάρα ενέργειας.", "Šlep služba. Dođe sa kukom i ključem i popravi jednu crticu energije.", "Vlečna služba. Pride s kavljem in ključem in popravi eno črtico energije."], ["An angry horn. It honks TOOOT and steals 4 seconds.", "Ljuta truba. Zatrubi TUUUT i ukrade 4 sekunde.", "Un clacson arrabbiato. Suona TUUUT e ruba 4 secondi.", "Eine wütende Hupe. Sie hupt TUUUT und klaut 4 Sekunden.", "Una bocina enfadada. Pita TUUUT y roba 4 segundos.", "Un klaxon en colère. Il fait TUUUT et vole 4 secondes.", "Μια θυμωμένη κόρνα. Κορνάρει ΤΟΥΟΥΟΥΤ και κλέβει 4 δευτερόλεπτα.", "Ljuta truba. Zatrubi TUUUT i ukrade 4 sekunde.", "Jezna hupa. Zatrobi TUUUT in ukrade 4 sekunde."], ["A traffic cone with a rocket. It charges in and shuffles all the answers.", "Prometni čunj s raketom. Zaleti se i ispremiješa sve odgovore.", "Un cono stradale con un razzo. Si lancia e mescola tutte le risposte.", "Ein Leitkegel mit Rakete. Er prescht los und mischt alle Antworten durch.", "Un cono de tráfico con un cohete. Se lanza y revuelve todas las respuestas.", "Un cône de signalisation à fusée. Il fonce et mélange toutes les réponses.", "Ένας κώνος κυκλοφορίας με πύραυλο. Ορμάει και ανακατεύει όλες τις απαντήσεις.", "Saobraćajni čunj sa raketom. Zaleti se i izmeša sve odgovore.", "Prometni stožec z raketo. Zaleti se in premeša vse odgovore."], ["A gremlin from a pothole. It has a fuse… and suddenly BOOM!", "Gremlin iz rupe na cesti. Ima fitilj… i odjednom BUM!", "Un folletto dispettoso da una buca nella strada. Ha una miccia… e all'improvviso BUM!", "Ein Gremlin aus einem Schlagloch. Er hat eine Zündschnur… und plötzlich BUMM!", "Un duende de un bache. Tiene una mecha… ¡y de repente BUM!", "Un gremlin sorti d'un nid-de-poule. Il a une mèche… et soudain BOUM !", "Ένα γκρέμλιν από μια λακκούβα. Έχει φιτίλι… και ξαφνικά ΜΠΑΜ!", "Gremlin iz rupe na putu. Ima fitilj… i odjednom BUM!", "Škrat iz luknje v cesti. Ima vžigalno vrvico… in naenkrat BUM!"], ["A robot conductor. It looks at its ticket and shows the whole answer.", "Robot kondukter. Pogleda u svoju kartu i pokaže cijeli odgovor.", "Un robot controllore. Guarda il suo biglietto e mostra tutta la risposta.", "Ein Roboter-Schaffner. Er schaut auf seine Fahrkarte und zeigt die ganze Antwort.", "Un robot revisor. Mira su billete y muestra toda la respuesta.", "Un robot contrôleur. Il regarde son billet et montre toute la réponse.", "Ένα ρομπότ ελεγκτής. Κοιτάζει το εισιτήριό του και δείχνει όλη την απάντηση.", "Robot kondukter. Pogleda u svoju kartu i pokaže ceo odgovor.", "Robot sprevodnik. Pogleda svojo vozovnico in pokaže cel odgovor."], ["The station clock. When you call it, time runs half as fast.", "Kolodvorski sat. Kad ga pozoveš, vrijeme teče upola sporije.", "L'orologio della stazione. Quando lo chiami, il tempo scorre a metà velocità.", "Die Bahnhofsuhr. Wenn du sie rufst, läuft die Zeit nur halb so schnell.", "El reloj de la estación. Cuando lo llamas, el tiempo va a la mitad de velocidad.", "L'horloge de la gare. Quand tu l'appelles, le temps passe deux fois moins vite.", "Το ρολόι του σταθμού. Όταν το καλείς, ο χρόνος κυλά στο μισό.", "Železnički sat. Kad ga pozoveš, vreme teče upola sporije.", "Postajna ura. Ko jo pokličeš, čas teče pol počasneje."], ["A railway signal with a shield. It blocks the next hit.", "Željeznički signal sa štitom. Blokira sljedeći udarac.", "Un segnale ferroviario con uno scudo. Blocca il colpo successivo.", "Ein Eisenbahnsignal mit Schild. Es blockt den nächsten Treffer.", "Una señal de tren con escudo. Bloquea el siguiente golpe.", "Un signal ferroviaire avec un bouclier. Il bloque le coup suivant.", "Ένα σιδηροδρομικό σήμα με ασπίδα. Μπλοκάρει το επόμενο χτύπημα.", "Železnički signal sa štitom. Blokira sledeći udarac.", "Železniški signal s ščitom. Ustavi naslednji udarec."], ["An angry puff of smoke from the locomotive. It puffs and blows away 4 seconds.", "Ljuti oblačić dima iz lokomotive. Puhne i odnese 4 sekunde.", "Una nuvoletta di fumo arrabbiata della locomotiva. Soffia e si porta via 4 secondi.", "Ein wütendes Rauchwölkchen aus der Lok. Es pustet und weht 4 Sekunden weg.", "Una nubecita de humo enfadada de la locomotora. Sopla y se lleva 4 segundos.", "Un petit nuage de fumée en colère sorti de la locomotive. Il souffle et emporte 4 secondes.", "Ένα θυμωμένο συννεφάκι καπνού από την ατμομηχανή. Φυσάει και παίρνει 4 δευτερόλεπτα.", "Ljuti oblačić dima iz lokomotive. Dune i odnese 4 sekunde.", "Jezen oblaček dima iz lokomotive. Pihne in odnese 4 sekunde."], ["A robot rail switch. It pulls its lever and shuffles the answers.", "Robot skretnica. Povuče ručicu i ispremiješa odgovore.", "Un robot scambio ferroviario. Tira la leva e mescola le risposte.", "Ein Roboter-Weichensteller. Er zieht am Hebel und mischt die Antworten.", "Un robot cambio de agujas. Tira de la palanca y revuelve las respuestas.", "Un robot aiguillage. Il tire sur son levier et mélange les réponses.", "Ένα ρομπότ κλειδούχος. Τραβά τον μοχλό και ανακατεύει τις απαντήσεις.", "Robot skretnica. Povuče ručicu i izmeša odgovore.", "Robotska kretnica. Potegne ročico in premeša odgovore."], ["A glowing lump of coal with a fuse. It smoulders and smoulders… and BOOM!", "Užareni komad ugljena s fitiljem. Tinja, tinja… i BUM!", "Un pezzo di carbone ardente con la miccia. Cova, cova… e BUM!", "Ein glühendes Stück Kohle mit Zündschnur. Es glimmt und glimmt… und BUMM!", "Un trozo de carbón ardiente con mecha. Arde y arde… ¡y BUM!", "Un morceau de charbon brûlant avec une mèche. Il couve, couve… et BOUM !", "Ένα πυρωμένο κάρβουνο με φιτίλι. Σιγοκαίει, σιγοκαίει… και ΜΠΑΜ!", "Užareni komad uglja sa fitiljem. Tinja, tinja… i BUM!", "Žareč kos premoga z vžigalno vrvico. Tli, tli… in BUM!"], ["A space puppy in a spacesuit. It sniffs out and chases away two wrong answers.", "Svemi  s teleskopom. Vidi daleč in pokaže cel odgovor."], ["A little UFO with a beam. It sucks up 4 seconds and flies off.", "Mali NLO sa zrakom. Usisa 4 sekunde i odleti.", "Un piccolo UFO con un raggio. Risucchia 4 secondi e vola via.", "Ein kleines UFO mit Strahl. Es saugt 4 Sekunden ein und fliegt davon.", "Un pequeño ovni con un rayo. Absorbe 4 segundos y se va volando.", "Un petit OVNI avec un rayon. Il aspire 4 secondes et s'envole.", "Ένα μικρό ΑΤΙΑ με ακτίνα. Ρουφάει 4 δευτερόλεπτα και φεύγει.", "Mali NLO sa zrakom. Usisa 4 sekunde i odleti.", "Majhen NLP z žarkom. Posrka 4 sekunde in odleti."], ["A green alien with a broken chip. It makes a mistake and shuffles the answers.", "Zeleni izvanzemaljac s pokvarenim čipom. Napravi grešku i ispremiješa odgovore.", "Un alieno verde con un chip rotto. Fa un errore e mescola le risposte.", "Ein grüner Außerirdischer mit kaputtem Chip. Er macht einen Fehler und mischt die Antworten.", "Un alienígena verde con un chip roto. Comete un error y revuelve las respuestas.", "Un extraterrestre vert avec une puce cassée. Il se trompe et mélange les réponses.", "Ένας πράσινος εξωγήινος με χαλασμένο τσιπ. Κάνει λάθος και ανακατεύει τις απαντήσεις.", "Zeleni vanzemaljac sa pokvarenim čipom. Napravi grešku i izmeša odgovore.", "Zeleni vesoljček s pokvarjenim čipom. Naredi napako in premeša odgovore."], ["An angry little meteor. It races through space, burning… and BOOM!", "Ljuti mali meteor. Juri kroz svemir, gori… i BUM!", "Un piccolo meteorite arrabbiato. Sfreccia nello spazio, brucia… e BUM!", "Ein wütender kleiner Meteor. Er rast durchs All, brennt… und BUMM!", "Un pequeño meteoro enfadado. Corre por el espacio, arde… ¡y BUM!", "Un petit météore en colère. Il fonce dans l'espace, brûle… et BOUM !", "Ένας θυμωμένος μικρός μετεωρίτης. Τρέχει στο διάστημα, καίγεται… και ΜΠΑΜ!", "Ljuti mali meteor. Juri kroz svemir, gori… i BUM!", "Jezen majhen meteor. Drvi skozi vesolje, gori… in BUM!"], ["sparkles through the swarm.", "svjetluca kroz const SHIP_COLORS = [['#e8412c','#ffc51a'],['#1f6fe0','#ff8a1f'],['#2bb24c','#ffc51a'],['#8e44d6','#1fb5c9'],['#ff8a1f','#5d6b84'],['#5d6b84','#e8412c']];
const CRATE_COLORS = ['b-red','b-yellow','b-blue','b-green','b-orange','b-teal','b-purple'];

const Ships = {
  els:[],
  W(){ return stage.clientWidth; }, H(){ return stage.clientHeight; },
  make(x, n, kind, from, big){
    const [c1,c2] = pick(SHIP_COLORS);
    const el = document.createElement('div'); el.className = 'ship' + (big?' big':''); el.style.left = (x*100)+'%';
    const art = kind.startsWith('fleet:') ? fleetSVG(kind.slice(6)) : SHIP_ART[kind](c1,c2);
    el.innerHTML = `<div class="ship-bob">${SWEAT}<div class="ship-art ${from==='right'?'flip':''}">${art}</div><div class="tether"></div><div class="crate brick ${pick(CRATE_COLORS)}">${n}</div></div>`;
    if(typeof n === 'string'){ const lines = n.split('<br>'), L = Math.max(...lines.map(x=>x.length)); if(L>3 || lines.length>1){ const cr = el.querySelector('.crate'); cr.classList.add('ut'); cr.style.setProperty('--k', Math.min(1, 2.5/L, lines.length>1 ? .7 : 1).toFixed(2)); } }

  },
  fly(el, fromDx, fromDy, toDx, toDy, dur, easing){
    return el.animate([{transform:`translate(calc(-50% + ${fromDx}px), ${fromDy}px)`},{transform:`translate(calc(-50% + ${toDx}px), ${toDy}px)`}],{duration:dur,easing,fill:'forwards'}).finished.catch(()=>{});
  },
  async showStory(p){
    const W = this.W(), H = this.H(), en = Game.level.enemies || [];
    const a = this.make(.09, '?', en.length ? 'fleet:'+pick(en) : 'dart', 'left'), b = this.make(.91, '?', en.length ? 'fleet:'+pick(en) : 'saucer', 'right');

  },
  async show(p){

    const W = this.W(), H = this.H();

    const kinds = en ? [ 'fleet:'+pick(en), 'fleet:'+pick(en) ] : shuffle(Object.keys(SHIP_ART).filter(k=>k!=='hauler'));
    const a = this.make(.14, p.u ? crateTxt(p.ta) : p.a, en ? kinds[0] : (p.op==='div' && p.a>=20 ? 'hauler' : kinds[0]), 'left', p.op==='div' || p.u);
    const b = this.make(.48, p.u ? crateTxt(p.tb) : p.b, kinds[1], 'right', p.u);
    const op = document.createElement('div'); op.className='op'; op.style.left='31%'; op.textContent = p.u ? p.sy : sym(p.op); shipsEl.appendChild(op);
    const eq = document.createElement('div'); eq.className='eq'; eq.style.left='69%'; eq.textContent='= ?'; shipsEl.appendChild(eq);
    this.els = [a,b,op,eq]; this.eq = eq; this.b = b;
    a.style.visibility = b.style.visibility = 'hidden'; op.style.opacity = eq.style.opacity = 0;
    Sound.whoosh(0,.8);
    a.style.visibility='visible';
    const pa = this.fly(a, -(.14*W + 260), -H*.15, 0, 0, 1000, 'cubic-bezier(.15,.8,.25,1)');
    await wait(280); b.style.visibility='visible'; Sound.whoosh(0,.7);
    const pb = this.fly(b, (.52*W + 260), -H*.1, 0, 0, 1000, 'cubic-bezier(.15,.8,.25,1)');
    await wait(500);
    op.style.opacity=1; op.animate([{transform:`translate(-50%,${-H*.3}px) rotate(-180deg)`},{transform:'translate(-50%,0)'}],{duration:600,easing:'cubic-bezier(.3,1.5,.5,1)'});
    Sound.tone(500,0,.15,'sine',.1,900);
    await Promise.all([pa,pb]);
    eq.style.opacity=1; eq.animate([{opacity:0,transform:'translate(-50%,0) scale(.3)'},{opacity:1,transform:'translate(-50%,0) scale(1)'}],{duration:350,easing:'cubic-bezier(.3,1.5,.5,1)'});
    await wait(250);
  },
  async blast(){
    const hits = [];
    for(const ship of this.els.slice(0,2).filter(Boolean)){
      const parts = [...ship.querySelectorAll('.spart')];
      if(!parts.length){ const art = ship.querySelector('.ship-art'); hits.push({ el:art, onHit:()=>this.wreck(ship, art) }); continue; }
      const part = pick(parts); hits.push({ el:part, onHit:()=>this.damage(ship, part, parts) });
    }
    await Hero.attack(hits);
  },
  wreck(ship, art){
    const pt = stagePoint(art.getBoundingClientRect(), .55, .45), bob = ship.querySelector('.ship-bob');
    const fire = document.createElement('div'); fire.className = 'hitfire'; fire.style.left = '55%'; fire.style.top = '35%'; bob.appendChild(fire);
    ship.classList.add('hit','damaged','wreck'); Sound.boom(); stageSparks(pt, 14);
    for(let i=0;i<4;i++){ const d=document.createElement('div'); d.className='debris'; d.style.left=pt.x+'px'; d.style.top=pt.y+'px'; stage.appendChild(d);
      d.animate([{transform:'none',opacity:1},{transform:`translate(${rnd(-60,60)}px,${rnd(90,180)}px) rotate(${rnd(-400,400)}deg)`,opacity:0}],{duration:1100+Math.random()*400,easing:'ease-in'}).onfinish=()=>d.remove(); }
    setTimeout(()=>ship.classList.remove('hit'), 420);
  },
  damage(ship, part, parts){
    const target = stagePoint(part.getBoundingClientRect());
    const bob = ship.querySelector('.ship-bob'), br = bob.getBoundingClientRect(), pr = part.getBoundingClientRect();
    const fire = document.createElement('div'); fire.className = 'hitfire';
    fire.style.left = ((pr.left+pr.width/2-br.left)/br.width*100)+'%'; fire.style.top = ((pr.top+pr.height/2-br.top)/br.height*100)+'%';
    bob.appendChild(fire);
    part.style.setProperty('--fx', rnd(-40,40)+'px'); part.style.setProperty('--fr', rnd(-300,300)+'deg');
    part.classList.add('fall'); parts.filter(p=>p!==part).forEach(p=>p.classList.add('burnt'));
    ship.classList.add('hit','damaged'); Sound.boom(); stageSparks(target, 12);
    setTimeout(()=>ship.classList.remove('hit'), 420);
  },
  solved(ans){ if(this.eq){ const t = '= ' + ans; this.eq.textContent = t; this.eq.classList.add('solved'); if(t.length > 6 && !this.eq.classList.contains('st-eq')) this.eq.style.fontSize = `min(${(7.5*6/t.length).toFixed(2)}cqw, ${(10*6/t.length).toFixed(2)}cqh)`; } },
  async leave(){
    const W = this.W(), H = this.H(); const [a,b,op,eq] = this.els; if(!a) return;
    Sound.whoosh(0,.6);
    op.animate([{opacity:1},{opacity:0,transform:'translate(-50%,-40px) scale(.4)'}],{duration:300,fill:'forwards'});
    eq.animate([{opacity:1},{opacity:0}],{duration:400,delay:200,fill:'forwards'});
    this.fly(a, 0,0, -(.14*W+300), -H*.35, 700, 'cubic-bezier(.6,0,.9,.5)');
    await this.fly(b, 0,0, (.52*W+300), -H*.35, 700, 'cubic-bezier(.6,0,.9,.5)');
    this.clear();
  },
  shoot(){
    if(!this.b) return Promise.resolve();
    const sr = stage.getBoundingClientRect(), br = this.b.querySelector('.crate').getBoundingClientRect(), rr = robotWrap.getBoundingClientRect();
    const bolt = document.createElement('div'); bolt.className='bolt'; stage.appendChild(bolt);
    const x0 = br.left+br.width/2-sr.left, y0 = br.bottom-sr.top, x1 = rr.left+rr.width/2-sr.left, y1 = rr.top+rr.height*.35-sr.top;
    Sound.tone(1400,0,.2,'square',.06,200);
    return bolt.animate([{transform:`translate(${x0}px,${y0}px)`},{transform:`translate(${x1}px,${y1}px)`}],{duration:220,easing:'ease-in'}).finished.then(()=>bolt.remove()).catch(()=>bolt.remove());
  },
  clear(){ shipsEl.innerHTML=''; this.els=[]; this.eq=null; this.b=null; },
};

/* =====================================================================
   BOSS — each right answer burns one part, each miss repairs one
   ===================================================================== */
const THEMES = { snow:{ bright:true }, sail:{ bright:true }, city:{}, rail:{ bright:true }, station:{} };
function applyTheme(theme){
  for(const t of ['sea','beach','cave',...Object.keys(THEMES)]) stage.classList.toggle(t, t===theme);
  stage.classList.toggle('xt', !!THEMES[theme]); stage.classList.toggle('bright', !!(THEMES[theme] && THEMES[theme].bright)); stage.dataset.theme = theme || '';
}
const isBeach = () => stage.classList.contains('beach');
const SWEAT = '<i class="sweat sw1"></i><i class="sweat sw2"></i>';
function stagePoint(rect, fx=.5, fy=.5){ const sr = stage.getBoundingClientRect(); return { x: rect.left+rect.width*fx-sr.left, y: rect.top+rect.height*fy-sr.top }; }
function fireBolt(a, b, cls='', dur=240){
  const wet = isBeach(), bolt = document.createElement('div'); bolt.className = 'bolt ' + cls + (wet ? ' water' : ''); stage.appendChild(bolt);
  const rot = wet ? ` rotate(${Math.atan2(b.y-a.y, b.x-a.x)}rad)` : '';
  if(wet) Sound.squirt();
  return bolt.animate([{transform:`translate(${a.x}px,${a.y}px)${rot}`},{transform:`translate(${b.x}px,${b.y}px)${rot}`}],{duration:dur*1.1,easing:'ease-in'}).finished.catch(()=>{}).then(()=>{ bolt.remove(); if(wet) splash(b); });
}
function splash(pt){
  for(let i=0;i<9;i++){ const d = document.createElement('div'); d.className = 'drop'; d.style.left = pt.x+'px'; d.style.top = pt.y+'px'; stage.appendChild(d);
    const a = -Math.PI*(.1 + Math.random()*.8), v = 30 + Math.random()*60;
    d.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v*.8}px) scale(.8)`,opacity:1,offset:.45},{transform:`translate(${Math.cos(a)*v*1.4}px,${Math.sin(a)*v*.4+60}px) scale(.4)`,opacity:0}],{duration:650+Math.random()*300,easing:'ease-out'}).onfinish = () => d.remove(); }
}
function stageSparks(pt, n, color){
  if(!color && isBeach()) color = '#7fdcff';
  for(let i=0;i<n;i++){
    const s = document.createElement('div'); s.className='spark'; s.style.left = pt.x+'px'; s.style.top = pt.y+'px'; s.style.zIndex = 5;
    if(color) s.style.boxShadow = `0 0 8px 3px ${color}`;
    stage.appendChild(s); const a = Math.random()*Math.PI*2, d = 30+Math.random()*80;
    s.animate([{transform:'scale(1.2)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:500+Math.random()*500,easing:'ease-out'}).onfinish=()=>s.remove();
  }
}
const Hero = {
  el: $('#hero'), dir: 1, run: Promise.resolve(),
  async attack(hits){
    await this.run;
    const W = stage.clientWidth, H = stage.clientHeight, d = this.dir; this.dir = -d;
    this.el.hidden = false; const w = this.el.offsetWidth;
    this.el.querySelector('.hero-art').classList.toggle('flip', d < 0);
    const y = H * (stage.classList.contains('bosslvl') ? .42 : .34);
    const x0 = d > 0 ? -w-10 : W+10, x1 = d > 0 ? W+10 : -w-10;
    const xm = W/2 - w/2;
    const IN = .65, PRE = .15, SHOT = .2, GAP = .28, POST = .08, OUT = .6;
    Sound.flyby(IN, IN+PRE+hits.length*(SHOT+GAP)+POST, OUT); Sound.quack();
    const inA = this.el.animate([{transform:`translate(${x0}px,${y-H*.06}px) rotate(${d*6}deg)`},{transform:`translate(${xm}px,${y}px) rotate(0deg)`}],{duration:IN*1000,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
    await inA.finished.catch(()=>{});
    this.el.classList.add('hover');
    await wait(PRE*1000);
    const sorted = hits.map(h => ({ ...h, x: stagePoint(h.el.getBoundingClientRect()).x })).sort((a,b) => d*(a.x-b.x));
    for(const h of sorted){
      const q = $('#quack'); q.textContent = pick(['PEW!','QUACK!','PEW PEW!']); q.classList.add('show'); setTimeout(()=>q.classList.remove('show'), 400);
      Sound.pew();
      await fireBolt(stagePoint(this.el.getBoundingClientRect(), .55, .4), stagePoint(h.el.getBoundingClientRect()), 'duck', SHOT*1000);
      h.onHit();
      await wait(GAP*1000);
    }
    await wait(POST*1000);
    this.el.classList.remove('hover');
    const outA = this.el.animate([{transform:`translate(${xm}px,${y}px) rotate(0deg)`},{transform:`translate(${x1}px,${y-H*.08}px) rotate(${-d*8}deg)`}],{duration:OUT*1000,easing:'cubic-bezier(.6,0,.9,.6)',fill:'forwards'});
    inA.cancel();
    this.run = outA.finished.catch(()=>{}).then(()=>{ this.el.hidden = true; });
  },
};

/* Boss question text: ÷ goes in its own span so it is drawn in the body font (clearer than the display font's ÷) */
const setQ = (el, t) => { el.textContent = ''; String(t).split('÷').forEach((part, i) => { if(i){ const d = document.createElement('span'); d.className = 'dv'; d.textContent = '÷'; el.appendChild(d); } el.appendChild(document.createTextNode(part)); }); };
const Boss = {
  el: $('#boss'), q: $('#bossQ'), parts: [],
  kind:'scraptor',
  reset(on, kind='scraptor', minions=[]){
    this.el.hidden = !on; this.q.hidden = !on; this.el.className = 'boss'; this.q.textContent = ''; this.q.classList.remove('solved');
    this.kind = kind; this.svg = null;
    this.el.querySelectorAll('svg[data-kind]').forEach(sv => { const show = sv.dataset.kind === kind; sv.toggleAttribute('hidden', !show); if(show) this.svg = sv; });
    this.parts = [...this.svg.querySelectorAll('.bpart')]; this.parts.forEach(p=>p.classList.remove('burnt','fixed'));
    const mEl = $('#minions'); mEl.innerHTML = '';
    if(on){
      const spots = [['left:1%;top:4cqh',0],['left:2%;top:22cqh',0],['right:1%;top:21cqh',1],['right:3%;top:37cqh',1]];
      minions.slice(0,4).forEach((id,i)=>{ const d=document.createElement('div'); d.className='mn'+(spots[i][1]?' flip':''); d.style.cssText=spots[i][0]; d.innerHTML=SWEAT+fleetSVG(id); mEl.appendChild(d); });
    }
  },
  burntCount(){ return this.parts.filter(p=>p.classList.contains('burnt')).length; },
  allDown(){ return this.burntCount() === this.parts.length; },
  async enter(){ this.el.classList.add('enter'); Sound.rumble(); await wait(1300); this.el.classList.remove('enter'); },
  async ask(p){
    this.q.classList.remove('solved'); this.q.classList.toggle('story', !!p.story); setQ(this.q, qText(p));
    this.q.animate([{transform:'translateX(-50%) scale(.4)',opacity:0},{transform:'translateX(-50%) scale(1)',opacity:1}],{duration:350,easing:'cubic-bezier(.3,1.5,.5,1)'});
    await wait(380);
  },
  solved(ans){ const t = this.q.textContent, i = t.lastIndexOf('?'); setQ(this.q, t.slice(0,i) + ans + t.slice(i+1)); this.q.classList.add('solved'); },
  async takeHit(n=1){
    const intact = this.parts.filter(p=>!p.classList.contains('burnt')); if(!intact.length) return;
    const targets = intact.sort(()=>Math.random()-.5).slice(0, n);
    await Hero.attack(targets.map(part => ({ el:part, onHit:()=>{
      part.classList.add('burnt'); Sound.boom(); stageSparks(stagePoint(part.getBoundingClientRect()), 14);
      this.el.classList.remove('shake'); void this.el.offsetWidth; this.el.classList.add('shake');
      setTimeout(()=>this.el.classList.remove('shake'), 460);
    }})));
  },
  shoot(){
    Sound.tone(300,0,.25,'sawtooth',.08,900);
    const mins = [...document.querySelectorAll('#minions .mn')];
    const [ex,ey] = (this.svg.dataset.eye||'.5,.47').split(',').map(Number);
    const from = (mins.length && Math.random()<.5) ? stagePoint(pick(mins).getBoundingClientRect(), .5, .5) : stagePoint(this.el.getBoundingClientRect(), ex, ey);
    return fireBolt(from, stagePoint(robotWrap.getBoundingClientRect(), .5, .35), '', 260);
  },
  repair(){
    const burnt = this.parts.filter(p=>p.classList.contains('burnt')); if(!burnt.length) return;
    const part = pick(burnt); part.classList.remove('burnt'); part.classList.add('fixed');
    setTimeout(()=>part.classList.remove('fixed'), 700);
    setTimeout(()=>Sound.repair(), 300); stageSparks(stagePoint(part.getBoundingClientRect()), 10, '#5dff8a');
  },
  async explode(){
    const r = this.el.getBoundingClientRect();
    this.el.classList.add('dead');
    document.querySelectorAll('#minions .mn').forEach((m,i)=>m.animate([{opacity:1},{opacity:0,transform:`translateY(-40px) scale(.4) rotate(${i%2?200:-200}deg)`}],{duration:900,delay:300+i*150,fill:'forwards'}));
    for(let i=0;i<6;i++) setTimeout(()=>{ Sound.boom(); stageSparks(stagePoint(r, .15+Math.random()*.7, .2+Math.random()*.6), 16); }, i*200);
    setTimeout(()=>{ $('#flash').classList.remove('go'); void stage.offsetWidth; $('#flash').classList.add('go'); }, 1000);
    await wait(1400); this.el.hidden = true; this.q.hidden = true;
  },
};

/* =====================================================================
   FLEET (helpers, enemies, oddballs) + HELPER POWER-UPS
   ===================================================================== */
for(const f of FLEET) if(['teapot','balloon','snail'].includes(f.id)) f.group = 'helper';
const fleetById = id => FLEET.find(f=>f.id===id);
function fleetSVG(id){ const f = fleetById(id); return f ? `<svg class="fsvg" viewBox="0 0 160 120" role="img" aria-label="${f.name}">${f.svg}</svg>` : ''; }
function fleetCardHTML(f, locked, delay=0){
  const tag = { enemy:'Enemy', helper:'Helper', odd:'Oddball' }[f.group];
  if(locked) return `<div class="fcard locked" style="animation-delay:${delay}s"><div class="fa"><b>?</b></div><div class="ft">locked</div><h4>???</h4><p>Unlock it in a future mission.</p></div>`;
  const pw = HELPER_POWERS[f.id];
  return `<div class="fcard ${f.group}" style="animation-delay:${delay}s"><div class="fa">${fleetSVG(f.id)}</div><div class="ft">${tag}${pw?' · '+pw.tag:''}</div><h4>${f.name}</h4><p>${f.line}</p>${pw?`<div class="pw">★ ${pw.text}</div>`:''}</div>`;
}
/* Enemy raids (Mission 2): an enemy flies in during a problem. Tap it before it acts, or it makes mischief. */
const RAIDS = {

const RAID_CHANCE = .45;
const Raid = {
  el:null, timer:null, id:null,
  maybe(){
    const L = Game.level, en = (L.enemies||[]).filter(e=>RAIDS[e]);
    if(!Game.mission.raids || !en.length || (Game.idx===0 && !L.boss) || Math.random() > RAID_CHANCE) return;
    const s = Game.serial, t = Game.run;
    setTimeout(()=>{ if(s===Game.serial && t===Game.run && !Game.busy && !this.el) this.launch(pick(en), s, t); }, rnd(900,2600));
  },
  launch(id, s, t){
    const f = fleetById(id), cfg = RAIDS[id], W = stage.clientWidth, H = stage.clientHeight, fromLeft = Math.random()<.5;
    const el = document.createElement('button'); el.className = 'raider ' + (fromLeft?'left':'right') + (cfg.act==='boom'?' boomer':'');
    el.setAttribute('aria-label', `Stop ${f.name}`); el.innerHTML = SWEAT + fleetSVG(id) + '<span class="tap">TAP!</span>';
    stage.appendChild(el); this.el = el; this.id = id;
    const w = el.offsetWidth, x = W/2 - w/2 + (fromLeft?-1:1)*W*.14, y = H*.34;
    this.pos = { x, y, w };
    el.animate([{transform:`translate(${fromLeft?-w-10:W+10}px,${y-H*.12}px)`},{transform:`translate(${x}px,${y}px)`}],{duration:1000,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
    Sound.tone(660,0,.12,'square',.05); Sound.tone(520,.14,.12,'square',.05); Sound.flyby(.9,1,.4);
    el.addEventListener('pointerdown', e => { e.preventDefault(); this.defeat(); });
    el.addEventListener('click', e => e.preventDefault());
    setTimeout(()=>{ if(this.el===el){ el.classList.add('warn'); if(cfg.act==='boom') setTimeout(()=>this.el===el && el.classList.add('fast'), cfg.wait*.6); } }, 1000);
    this.timer = setTimeout(()=>this.act(s, t), 1000 + cfg.wait);
  },
  center(){ return this.el ? stagePoint(this.el.getBoundingClientRect()) : { x:0, y:0 }; },
  defeat(){
    if(!this.el) return; clearTimeout(this.timer);
    const pt = this.center(), f = fleetById(this.id), el = this.el; this.el = null;
    Sound.boom(); Sound.correct(); stageSparks(pt, 20, '#5dff8a');
    el.getAnimations().forEach(a=>a.cancel());
    el.style.transform = `translate(${this.pos.x}px,${this.pos.y}px)`;
    el.animate([{opacity:1,transform:`translate(${this.pos.x}px,${this.pos.y}px) scale(1)`},{opacity:0,transform:`translate(${this.pos.x}px,${this.pos.y+80}px) scale(.3) rotate(300deg)`}],{duration:600,fill:'forwards'}).onfinish=()=>el.remove();
    Robot.say('Got it!', `${f.name} stopped`, 1400);
  },
  retreat(){
    if(!this.el) return; clearTimeout(this.timer); const el = this.el; this.el = null;
    el.classList.remove('warn','fast'); el.querySelector('.tap')?.remove();
    el.getAnimations().forEach(a=>a.cancel());
    el.animate([{transform:`translate(${this.pos.x}px,${this.pos.y}px)`},{transform:`translate(${this.pos.x}px,${-this.pos.w*1.5}px)`}],{duration:700,easing:'ease-in',fill:'forwards'}).onfinish=()=>el.remove();
  },
  clear(){ clearTimeout(this.timer); if(this.el){ this.el.remove(); this.el = null; } },
  floatText(txt, pt){
    const d = document.createElement('div'); d.className='floattxt'; d.textContent = txt; d.style.left = pt.x+'px'; d.style.top = pt.y+'px'; stage.appendChild(d);
    d.animate([{transform:'translate(-50%,0) scale(.6)',opacity:1},{transform:'translate(-50%,-60px) scale(1.2)',opacity:0}],{duration:1300,easing:'ease-out'}).onfinish=()=>d.remove();
  },
  act(s, t){
    if(!this.el) return;
    if(t !== Game.run || s !== Game.serial){ this.clear(); return; }
    if(Game.busy){ this.timer = setTimeout(()=>this.act(s,t), 300); return; }
    const cfg = RAIDS[this.id], p = Game.cur;
    let act = cfg.act, np = null;
    if(p && p.u && (act === 'sign' || act === 'digits')) act = 'shuffle';
    if(act === 'sign'){
      if(p.op==='add' && p.a!==p.b) np = opProblem('sub', Math.max(p.a,p.b), Math.min(p.a,p.b), p);
      else if(p.op==='sub') np = opProblem('add', p.a, p.b, p);
      else if(p.op==='mul') np = opProblem('div', p.a, p.b, p);
      else if(p.op==='div') np = opProblem('mul', p.a, p.b, p);
      if(!np) act = 'time';
    }
    if(act === 'digits'){
      const sw = n => { const t = String(n); if(t.length < 2) return null;
        const pairs = []; for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++) if(t[i]!==t[j] && !(i===0 && t[j]==='0')) pairs.push([i,j]);
        if(!pairs.length) return null; const [i,j] = pick(pairs), c = t.split(''); [c[i],c[j]] = [c[j],c[i]]; return +c.join(''); };
      const opts = [];
      const A = sw(p.a), B = sw(p.b);
      const mk = (a,b) => opProblem(p.op, a, b, p);
      if(A!==null){ const q = mk(A,p.b); if(q) opts.push(q); }
      if(B!==null && !p.big){ const q = mk(p.a,B); if(q) opts.push(q); }
      np = opts.length ? pick(opts) : null; if(!np) act = 'time';
    }
    const pt = this.center();
    if(act === 'time'){
      Timer.left = Math.max(1, Timer.left - 4); Timer.paint();
      Sound.tone(900,0,.05,'square',.07); Sound.tone(700,.08,.05,'square',.07); Sound.tone(900,.16,.05,'square',.07);
      this.floatText('−4s', stagePoint($('#timer').getBoundingClientRect(), .5, 1.1));
      Robot.say('Hey!', act===cfg.act ? cfg.msg : 'It stole 4 seconds!', 1800); this.retreat();
    } else if(act === 'sign' || act === 'digits'){
      if(act==='sign'){ const ink = document.createElement('div'); ink.className='ink'; const tgt = Game.level.boss ? Boss.q : Ships.els[2]; if(tgt){ const q = stagePoint(tgt.getBoundingClientRect()); ink.style.left = (q.x-40)+'px'; ink.style.top = (q.y-40)+'px'; } stage.appendChild(ink);
        ink.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(1.2)',opacity:.9,offset:.3},{transform:'scale(1.4)',opacity:0}],{duration:1400}).onfinish=()=>ink.remove(); Sound.noise(0,.4,.15,600,200); }
      else { Sound.tone(200,0,.08,'sawtooth',.1); Sound.tone(160,.1,.08,'sawtooth',.1); }
      Game.applyProblem(np);
      Robot.say('Uh-oh!', cfg.msg, 2000); this.retreat();
    } else if(act === 'shuffle'){
      const bs = [...answersEl.querySelectorAll('.ans')]; let order = bs.slice();
      for(let k=0; k<10 && order.every((b,i)=>b===bs[i]); k++) order = shuffle(bs.slice());
      bs.forEach((b,i) => b.animate([{transform:'none'},{transform:`translateY(-40%) rotate(${i%2?12:-12}deg) scale(.8)`},{transform:'none'}],{duration:520,easing:'ease-in-out'}));
      setTimeout(()=>answersEl.append(...order), 260);
      Sound.tone(300,0,.1,'square',.06,900); Sound.tone(900,.12,.1,'square',.06,300);
      Robot.say('Uh-oh!', cfg.msg, 2000); this.retreat();
    } else if(act === 'boom'){
      const el = this.el; this.el = null; el.remove();
      Sound.boom(); stageSparks(pt, 26); $('#flash').classList.remove('go'); void stage.offsetWidth; $('#flash').classList.add('go');
      Game.cur = null; Timer.stop(true);
      if(Game.hurt('Boom!')) { Robot.say('Boom!', cfg.msg + ' New problem.', 2000); Game.replace(); }
    }
  },
};

    f.animate([{transform:`translate(${br.x-40}px,${br.y-40}px) scale(.4)`,opacity:.6},{transform:`translate(${W*.42}px,${H*.32}px) scale(1.2)`,opacity:1,offset:.45},{transform:`translate(${W*.42}px,${H*.3}px) scale(1.2)`,opacity:1,offset:.75},{transform:`translate(${W+60}px,${H*.05}px) scale(.6)`,opacity:0}],{duration:1500,easing:'ease-in-out'}).onfinish=()=>f.remove();
    const p0 = Game.cur, run0 = Game.run;

    if(Game.cur !== p0 || Game.run !== run0 || Game.busy){ this.used.delete(id); btn.classList.remove('used'); return; }   // problem changed while the helper flew in: keep the helper for later

    const eq = Game.level.boss ? Boss.q : Ships.eq;

      Sound.correct(); const right = btns.find(b=>b.dataset.v===ansKey(p)); if(right) right.classList.add('hinted');

      }

    } else if(base === 'balloon'){

      Raid.floatText('+10s', stagePoint($('#timer').getBoundingClientRect(), .5, 1.1)); Robot.say('Up we go!', `${nm} gives 10 more seconds`, 1800);

    } else if(base === 'medic'){
      Game.lives = Math.min(Game.maxLives, Game.lives+1); Robot.setPower(Game.lives); Sound.repair(); stageSparks(stagePoint(robotWrap.getBoundingClientRect(), .5, .4), 14, '#5dff8a');

      Raid.floatText('+8s', stagePoint($('#timer').getBoundingClientRect(), .5, 1.1)); Robot.say('Splash!', `${nm} gives you 8 more seconds`, 1800);
    }
  },
};

const TIME_LIMIT = 8;
const Timer = {
  id:null, limit:TIME_LIMIT, left:TIME_LIMIT, lastSec:null, onOut:null,
  paint(){
    const el=$('#timer'), frac=Math.min(1,Math.max(0,this.left/this.limit)), sec=Math.ceil(this.left);
    $('#timerRing').style.strokeDashoffset = (264*(1-frac)).toFixed(1);
    $('#timerNum').textContent = sec;
    el.classList.toggle('mid', sec<=5 && sec>3); el.classList.toggle('low', sec<=3);
  },
  start(onOut){
    this.stop(); this.left = this.limit; this.lastSec = this.limit; this.onOut = onOut; this.rate = 1; $('#timer').classList.remove('slow');
    $('#timer').classList.remove('off'); this.paint();
    let prev = performance.now();
    this.id = setInterval(()=>{
      const now = performance.now(); this.left -= (now-prev)/1000*(this.rate||1); LevelClock.tick((now-prev)/1000); prev = now;
      const sec = Math.ceil(this.left);
      if(sec !== this.lastSec){ this.lastSec = sec; if(sec<=3 && sec>0) Sound.tone(sec===1?1100:880,0,.06,'square',.05); }
      this.paint();
      if(this.left <= 0){ this.stop(true); this.onOut && this.onOut(); }
    }, 100);
  },
  stop(keepShown){ clearInterval(this.id); this.id=null; if(!keepShown) $('#timer').classList.add('off'); },
  reset(){ this.stop(); this.left = this.limit; this.paint(); },
};

/* =====================================================================

const Game = {
  run:0, mi:0, li:0,
  get mission(){ return MISSIONS[this.mi]; }, probs:[], idx:0, lives:5, busy:true, hitsThisLevel:0,
  get level(){ return this.mission.levels[this.li]; },
  hud(){
    const L = this.level;
    $('#hudTitle').textContent = `Level ${this.li+1} · ${L.name}`;
    const n = L.boss ? Boss.parts.length : this.probs.length, done = L.boss ? Boss.burntCount() : this.idx;
    $('#pips').innerHTML = Array.from({length:n},(_,i)=>`<span class="pip ${i<done?'on':''}"></span>`).join('');
  },
  async start(li, { landing=false, mi }={}){
    const t = ++this.run;
    if(mi !== undefined) this.mi = mi; Save.d.lastMission = this.mi; Save.write();
    overlay.hidden = true; this.li = li; this.probs = makeProblems(this.level); this.idx = 0; this.hitsThisLevel = 0; this.levelStart = Date.now();
    this.bonus = Squad.bonus(); renderCopilot(Squad.ids()); this.lives = 5 + this.bonus.bars; this.maxLives = this.lives;
    Robot.reset(); Robot.setPower(this.lives, this.lives); robotAnim.style.opacity='1'; Ships.clear(); Timer.reset(); const boss = !!this.level.boss; stage.classList.toggle('bosslvl', boss); applyTheme(this.mission.theme); Boss.reset(boss, this.level.bossKind||'scraptor', this.level.enemies||[]);
    Timer.limit = (this.level.time || TIME_LIMIT) + this.bonus.secs; Timer.reset(); LevelClock.setup(this.level, this.probs.length); Helpers.setup(!!this.mission.helpers); this.shield = false; Robot.shield(false); this.hud(); this.setAnswers(null);
    this.busy = true;
    if(landing) await Robot.land();
    if(t !== this.run) return;
    if(boss){ await Boss.enter(); if(t !== this.run) return; Robot.say('Boss fight!', 'Right answers call the Duck Wing', 1800); await wait(900); }
    else Robot.say(`Level ${li+1}!`, this.level.say || ({mul:'Multiply ×', div:'Divide ÷', mix:'Mixed × and ÷', add:'Add +', sub:'Subtract −', mix2:'Mixed + and −'})[this.level.op], 1500);
    const prev = li>0 ? (this.mission.levels[li-1].enemies||[]) : [];
    const fresh = (this.level.enemies||[]).filter(e=>!prev.includes(e));
    for(const id of (this.level.boss ? [] : fresh)){ await introCard(fleetById(id)); if(t !== this.run) return; }
    for(const id of Helpers.list.filter(id => !Save.d.seen.includes('helper-'+id))){ await helperIntro(id); if(t !== this.run) return; }
    await wait(700);
    if(t !== this.run) return;
    this.next();
  },
  serial:0,
  async next(){
    const t = this.run, p = this.probs[this.idx]; this.cur = p; this.busy = true; this.serial++; Raid.clear();
    this.setAnswers(null);
    if(this.level.boss) await Boss.ask(p); else await Ships.show(p);
    if(this.cur !== p || t !== this.run) return;
    this.setAnswers(makeChoices(p)); this.busy = false;
    this.armTimer(); Raid.maybe();
  },
  applyProblem(p){
    this.cur = p; this.probs[this.idx] = p;
    if(this.level.boss){ setQ(Boss.q, qText(p)); Boss.q.animate([{filter:'brightness(2.5)'},{filter:'none'}],{duration:600}); }
    else {
      const [a,b,op] = Ships.els;
      if(a) a.querySelector('.crate').textContent = p.a; if(b) b.querySelector('.crate').textContent = p.b; if(op) op.textContent = sym(p.op);
      [a,b,op].forEach(e => e && e.animate([{filter:'brightness(2.5)'},{filter:'none'}],{duration:600}));
    }
    if(!this.busy) this.setAnswers(makeChoices(p));
  },
  async replace(){
    const t = this.run; Timer.stop(true); this.busy = true; Raid.clear();
    if(this.level.boss){ Boss.q.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.4)',opacity:0,filter:'brightness(3)'}],{duration:450}); }
    else { Ships.els.slice(0,2).forEach(sh=>{ sh && stageSparks(stagePoint(sh.getBoundingClientRect()), 12, '#bff6ff'); }); await wait(250); if(t!==this.run) return; await Ships.leave(); }
    if(t !== this.run) return;
    let np; for(let i=0;i<20;i++){ np = makeProblems({ ...this.level, count:1 })[0]; if(!this.cur || (np.u ? np.key!==this.cur.key : (np.a!==this.cur.a || np.b!==this.cur.b))) break; }
    this.probs[this.idx] = np; await wait(300); if(t !== this.run) return; this.next();
  },
  /* Test cheat (only with #test): Ctrl+C or the ⏭ button jumps to the last problem of the level. */
  cheatLast(){
    if(!TEST || !overlay.hidden || this.busy || document.querySelector('.stage.arcade')) return;
    if(this.level.boss){
      const left = Boss.parts.filter(x=>!x.classList.contains('burnt'));
      left.slice(0,-1).forEach(x=>{ x.classList.remove('fixed'); x.classList.add('burnt'); });
      this.hud(); Robot.say('TEST', 'Last boss part', 1200); return;
    }
    if(this.idx >= this.probs.length-1) return;
    this.idx = this.probs.length-1; this.hud(); Robot.say('TEST', 'Last problem', 1200); this.replace();
  },
  async skip(){
    Sound.freeze(); Sound.whoosh(.15,.6);
    Robot.say('Brrr… smash!', 'New problem, no penalty', 1600);
    return this.replace();
  },
  armTimer(){ const t = this.run, s = this.serial; Timer.start(()=>{ if(t===this.run && s===this.serial && !this.busy) this.miss(null); }); },
  setAnswers(choices){
    const colors = ['b-red','b-yellow','b-blue','b-green','b-orange'];
    $('#helpers').classList.toggle('idle', !choices);
    if(!choices){ answersEl.classList.add('wait'); answersEl.querySelectorAll('.ans').forEach(b=>b.disabled=true); if(answersEl.children.length) return; choices=['?','?','?','?','?']; }
    else answersEl.classList.remove('wait');
    answersEl.innerHTML = choices.map((v,i)=>{ const tv = T(String(v)), u = unitLabel(tv);
      const cls = u ? 'units' + (u.n>=5 ? ' xlong' : u.n>=4 ? ' long' : '') : tv.length>=9?'xlong':(tv.length>=6 || (tv.length>=5 && /:/.test(tv)) || (tv.length>=4 && /\s/.test(tv)))?'long':'';
      return `<button class="brick ans ${colors[i]} ${cls}" data-v="${v}" ${v==='?'?'disabled':''} aria-label="Answer ${v}">${u ? u.html : v}</button>`; }).join('');
  },
  async answer(btn){
    if(this.busy || btn.disabled) return;

    if(v === ansKey(p)){
      Timer.stop(true); this.busy = true; Raid.retreat(); Session.right(); btn.classList.add('right'); answersEl.querySelectorAll('.ans').forEach(b=>b.disabled=true);
      Sound.correct(); Robot.happy(); this.cheerCopilot(); this.idx++;
      if(this.level.boss){
        Boss.solved(ansKey(p)); const pw = Math.random() < (this.bonus?.power||0); if(pw) Robot.say('POWER HIT!', 'Your crew\'s strength burns 2 parts', 1400); await Boss.takeHit(pw?2:1); if(!live()) return; this.hud();
        if(Boss.allDown()){ await wait(300); await Boss.explode(); return live() && this.complete(); }
        await wait(700); return live() && this.next();
      }
      Ships.solved(ansKey(p)); this.hud();
      await wait(250); await Ships.blast(); await wait(650); if(!live()) return; await Ships.leave(); if(!live()) return;
      if(this.idx >= this.probs.length) return this.complete();
      this.next();
    } else {
      btn.disabled = true; btn.classList.add('burnt');
      this.miss(btn);
    }
  },
  async miss(btn){
      const p = this.cur, t = this.run;
      Timer.stop(true); this.busy = true; Session.wrong();
      if(this.level.boss){ await Boss.shoot(); if(t !== this.run) return; Boss.repair(); this.hud(); } else await Ships.shoot();
      if(t !== this.run) return;
      if(this.shield){ this.shield = false; Robot.shield(false, true); Sound.repair(); Robot.say('Blocked!', 'The shell shield saved you', 1500); await wait(600); if(t !== this.run) return; this.busy = false; this.armTimer(); return; }
      Sound.zap(); this.lives--; this.hitsThisLevel++;
      const segs = $('#lifebar').querySelectorAll('.seg'); const s = segs[this.lives]; if(s){ s.classList.add('hit'); setTimeout(()=>s.classList.remove('hit'),500); }
      Robot.setPower(this.lives);
      if(this.lives <= 0) return this.burnout();
      Robot.zap(hintFor(p), btn ? null : 'Too slow!');
      await wait(450);
      if(t !== this.run) return;
      this.busy = false; this.armTimer();
  },
  hurt(title){
    if(this.shield){ this.shield = false; Robot.shield(false, true); Sound.repair(); Robot.say('Blocked!', 'The shell shield saved you', 1500); return true; }
    Sound.zap(); this.lives--; this.hitsThisLevel++;
    const segs = $('#lifebar').querySelectorAll('.seg'); const sg = segs[this.lives]; if(sg){ sg.classList.add('hit'); setTimeout(()=>sg.classList.remove('hit'),500); }
    Robot.setPower(this.lives);
    if(this.lives <= 0){ this.burnout(); return false; }
    Robot.zap(null, title); return true;
  },
  cheerCopilot(){ const el=$('#copilot'); if(el.hidden) return; el.classList.remove('cheer'); void el.offsetWidth; el.classList.add('cheer'); },
  async burnout(){
    Raid.clear(); Sound.burnout(); Robot.burnout(); answersEl.querySelectorAll('.ans').forEach(b=>b.disabled=true);
    const t = this.run; await wait(1900); if(t !== this.run) return;
    showOverlay(`<div class="panel"><h2 class="h2">Zeebot overheated!</h2>
      <p class="sub">Five zaps drained the power cells. A quick recharge and you can try Level ${this.li+1} again.</p>
      <div class="row"><button class="brick b-green big-btn" id="oRetry">RECHARGE & RETRY</button><button class="brick b-blue big-btn" id="oMap">MAP</button></div></div>`, 'clear');
    $('#oRetry').onclick = () => { Sound.init(); Sound.beeps(5); this.start(this.li); };
    $('#oMap').onclick = () => { Robot.reset(); showMap(this.mi); };
  },
  async complete(){

    await Robot.transformAndFly(); if(t !== this.run) return;
    Sound.fanfare();
    const stars = this.hitsThisLevel===0 ? 3 : this.hitsThisLevel<=2 ? 2 : 1;
    const bolts = LevelClock.finish(); Save.d.bolts = (Save.d.bolts||0) + bolts;
    const ms = Save.mission(this.mission.id);
    ms.stars[this.li] = Math.max(ms.stars[this.li]||0, stars);
    ms.unlocked = Math.max(ms.unlocked, Math.min(this.mission.levels.length, this.li+2));
    if(this.li === this.mission.levels.length-1) ms.done = true;
    const secsUsed = Math.round((Date.now()-(this.levelStart||Date.now()))/1000), bk = this.mission.id + ':' + this.li;
    Save.d.bests = Save.d.bests || {};
    if(!TEST && secsUsed > 0 && !(Save.d.bests[bk] <= secsUsed)) Save.d.bests[bk] = secsUsed;   // best time per level for the class list
    Save.write(); Online.bump();
    Session.level({ m:this.mission.name, li:this.li, name:this.level.name, stars, boss:!!this.level.boss, secs:Math.round((Date.now()-(this.levelStart||Date.now()))/1000) });
    const cardId = this.level.card, card = CREW.find(c=>c.id===cardId);
    const isNew = card && !Save.hasCrew(cardId) && !(Save.d.earned||[]).includes(cardId);
    const last = this.li === this.mission.levels.length-1;
    const msg = stars===3 ? 'Perfect flight, no zaps at all!' : stars===2 ? 'Great flying! Only a couple of zaps.' : 'You made it through the storm!';
    showOverlay(`<div class="panel"><h2 class="h2">Level ${this.li+1} complete!</h2>
      <div class="stars-row">${[1,2,3].map(i=>`<i class="${i<=stars?'on':''}">★</i>`).join('')}</div>
      <p class="sub">${msg}${last ? ` <b>You finished ${this.mission.name}: ${this.mission.title}!</b>` : ''}${last && this.mi === MISSIONS.length-1 ? ' <b>You finished ALL missions! You are a Star Math Champion!</b>' : ''}</p>
      ${boltsHTML(bolts)}
      <div id="giftZone">${isNew ? `<button class="gift" id="gift" aria-label="Open your gift"><div class="box"></div><div class="rib"></div><div class="lid"></div><div class="bow"></div></button><p class="muted">A gift card arrived! Tap to open.</p>` : ''}</div>
      <div class="row" id="doneBtns" ${isNew?'hidden':''}>${!last?`<button class="brick b-green big-btn" id="oNext">NEXT LEVEL ▸</button>`:''}${last && UNLOCK_AFTER[this.mission.id]?`<button class="brick b-green big-btn" id="oUnlock">SEE WHAT'S UNLOCKED ▸</button>`:''}<button class="brick b-blue big-btn" id="oMap">MAP</button></div></div>`);
    countBolts(bolts);
    const ub = $('#oUnlock'); if(ub) ub.onclick = () => showUnlock(this.mi);
    if(isNew){
      $('#gift').onclick = async () => {
        const g = $('#gift'); if(g.classList.contains('open')) return; g.classList.add('open'); Sound.pop();
        const got = Save.addCrew(cardId); Session.card(cardId); Online.bump(); if(!Save.d.copilot){ Save.d.copilot = cardId; Save.write(); renderCopilot(); }
        await wait(450);
        $('#giftZone').innerHTML = `<p class="mission-tag">NEW CREW MEMBER!</p><div class="reveal" style="display:flex;justify-content:center">${cardHTML(card,{big:true})}</div>`;
        if(Array.isArray(got)) $('#giftZone').insertAdjacentHTML('beforeend', got.map(st=>`<p class="mission-tag" style="color:#5dff8a">SET COMPLETE: ${st.name}! +${st.bonus} min bonus</p>`).join(''));

      };
    }
    const nb = $('#oNext'); if(nb){ const mi = this.mi, li = this.li, M = this.mission; nb.onclick = () => { Sound.init();
      if(Arcade.isBonusAfter(M, li)) Arcade.start(mi, li, () => launchLevel(li+1, mi, true)); else launchLevel(li+1, mi, true); }; }
    if(last && UNLOCK_AFTER[this.mission.id]) Save.unlockFleet(UNLOCK_AFTER[this.mission.id]);
    $('#oMap').onclick = () => { showMap(this.mi); };
  },
};

const INTRO_LINES = [
  { scene:'hello', text:'Beep boop! I am Zeebot!' },
  { scene:'ships', text:'Solve the problems, and my Duck Wing blasts the ships!' },
  { scene:'cards', text:'Collect cards and build your crew!' },

const Voice = {
  // bright, clear voices first (names differ per device); then any English voice
  BRIGHT: ['google us english','samantha','aria','jenny','ana','zira','karen','moira','tessa','google uk english female','natural','online'],
  pickVoice(){ try{
    const all = speechSynthesis.getVoices(), L = LANGS.find(x=>x.id===LANG) || LANGS[1]; let vs = [];
    for(const pre of L.voice){ vs = all.filter(v => v.lang && v.lang.toLowerCase().replace('_','-').startsWith(pre)); if(vs.length) break; }
    if(!vs.length) return null;
    const score = v => { const n = v.name.toLowerCase(); let sc = 0; this.BRIGHT.forEach((b,i) => { if(n.includes(b)) sc = Math.max(sc, 100 - i); });
      if(/en-us/i.test(v.lang.replace('_','-'))) sc += 5; if(/google|natural|online|premium|enhanced/i.test(n)) sc += 3; if(/male/.test(n) && !/female/.test(n)) sc -= 30; return sc; };
    return vs.slice().sort((a,b) => score(b) - score(a))[0];
  }catch(e){} return null; },
  chirpIn(){ [880,1320,1760].forEach((f,i)=>Sound.tone(f,i*.07,.07,'square',.05)); },
  chirpOut(){ Sound.tone(1200,0,.12,'triangle',.07,2400); Sound.tone(1800,.1,.08,'square',.04); },
  chatter(){ // quiet robot blips under the voice for a light robotic feel
    const id = setInterval(()=>{ Sound.tone(1400+Math.random()*1600,0,.03,'square',.018); }, 140);
    return () => clearInterval(id); },
  speak(text, opts={}){
    text = T(text);
    return new Promise(res => {
      const minMs = 1200 + text.length*55;
      const v = Save.d.sound ? this.pickVoice() : null;
      if(!v){ Sound.beeps(Math.min(8, 3 + Math.round(text.length/10))); setTimeout(res, minMs); return; }
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.pitch = opts.pitch ?? 1.35; u.rate = opts.rate ?? 1.0; u.volume = 1;
        let done = false, stopCh = null; const fin = () => { if(!done){ done = true; stopCh && stopCh(); this.chirpOut(); res(); } };
        u.onstart = () => { stopCh = this.chatter(); };
        u.onend = fin; u.onerror = fin; setTimeout(fin, minMs + 4000);
        this.chirpIn(); setTimeout(()=>speechSynthesis.speak(u), 260);
      }catch(e){ setTimeout(res, minMs); }
    });
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} },
};

   ===================================================================== */

  left:0, on:false, el: $('#lclock'),
  setup(level, n){ const per = level.time || TIME_LIMIT; this.left = Math.round(per * (level.boss ? LEVEL_CLOCK.bossProblems : n) * LEVEL_CLOCK.share); this.on = true; this.el.classList.remove('off','out'); this.paint(); },
  tick(dt){ if(!this.on || this.left <= 0) return; this.left = Math.max(0, this.left - dt); this.paint(); },
  paint(){ const x = Math.ceil(this.left), t = `⏱ ${Math.floor(x/60)}:${String(x%60).padStart(2,'0')} 🔩`; if(this.el.textContent !== t) this.el.textContent = t; this.el.classList.toggle('out', x <= 0); },
  finish(){ this.on = false; const b = Math.ceil(this.left); this.left = 0; this.hide(); return b; },

  const step = now => { if(!el.isConnected) return; const k = Math.min(1, (now - t0) / dur), v = Math.round(n * k);

  return `<g class="pc"><g transform="translate(${mx} ${my}) rotate(${a})">
    <rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h*.32}" fill="${col}" stroke="#141a3a" stroke-width="${h*.12}"/>
    <rect x="${-w/2+h*.25}" y="${-h/2+h*.14}" width="${w-h*.5}" height="${h*.16}" rx="${h*.08}" fill="#fff" opacity=".45"/>
    ${slots}
    <circle cx="${-L/2}" cy="0" r="${h*.15}" fill="#dfe6f0" stroke="#141a3a" stroke-width="${h*.06}"/><circle cx="${L/2}" cy="0" r="${h*.15}" fill="#dfe6f0" stroke="#141a3a" stroke-width="${h*.06}"/>
    ${extra}</g></g>`;
}
function studioWord(word, ox, oy, sc, th, ci){
  let out = '', x = ox;
  for(const ch of word){ const strokes = STUDIO_FONT[ch] || [];
    for(const [a,b,c,d] of strokes){ out += studioPiece(x+a*sc, oy+b*sc, x+c*sc, oy+d*sc, th, STUDIO_COLORS[ci++ % STUDIO_COLORS.length]); }
    x += (4 + (sc < 1 ? 2.3 : 2)) * sc; }

}
