const RAID_CHANCE = .45;
const Raid = {
  el:null, timer:null, id:null,
  maybe(){
    const L = Game.level, en = (L.enemies||[]).filter(e=>RAIDS[e]);
    if(!Game.mission.raids || !en.length || (Game.idx===0 && !L.boss) || Math.random() > RAID_CHANCE) return;
    const s = Game.serial, t = Game.run;
    setTimeout(()=>{ if(s===Game.serial && t===Game.run && !Game.busy && !this.el) this.launch(pick(en), s, t); }, rnd(900,2600));
  },
  launch(id, s, t){
    const f = fleetById(id), cfg = RAIDS[id], W = stage.clientWidth, H = stage.clientHeight, fromLeft = Math.random()<.5;
    const el = document.createElement('button'); el.className = 'raider ' + (fromLeft?'left':'right') + (cfg.act==='boom'?' boomer':'');
    el.setAttribute('aria-label', `Stop ${f.name}`); el.innerHTML = SWEAT + fleetSVG(id) + '<span class="tap">TAP!</span>';
    stage.appendChild(el); this.el = el; this.id = id;
    const w = el.offsetWidth, x = W/2 - w/2 + (fromLeft?-1:1)*W*.14, y = H*.34;
    this.pos = { x, y, w };
    el.animate([{transform:`translate(${fromLeft?-w-10:W+10}px,${y-H*.12}px)`},{transform:`translate(${x}px,${y}px)`}],{duration:1000,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
    Sound.tone(660,0,.12,'square',.05); Sound.tone(520,.14,.12,'square',.05); Sound.flyby(.9,1,.4);
    el.addEventListener('pointerdown', e => { e.preventDefault(); this.defeat(); });
    el.addEventListener('click', e => e.preventDefault());
    setTimeout(()=>{ if(this.el===el){ el.classList.add('warn'); if(cfg.act==='boom') setTimeout(()=>this.el===el && el.classList.add('fast'), cfg.wait*.6); } }, 1000);
    this.timer = setTimeout(()=>this.act(s, t), 1000 + cfg.wait);
  },
  center(){ return this.el ? stagePoint(this.el.getBoundingClientRect()) : { x:0, y:0 }; },
  defeat(){
    if(!this.el) return; clearTimeout(this.timer);
    const pt = this.center(), f = fleetById(this.id), el = this.el; this.el = null;
    Sound.boom(); Sound.correct(); stageSparks(pt, 20, '#5dff8a');
    el.getAnimations().forEach(a=>a.cancel());
    el.style.transform = `translate(${this.pos.x}px,${this.pos.y}px)`;
    el.animate([{opacity:1,transform:`translate(${this.pos.x}px,${this.pos.y}px) scale(1)`},{opacity:0,transform:`translate(${this.pos.x}px,${this.pos.y+80}px) scale(.3) rotate(300deg)`}],{duration:600,fill:'forwards'}).onfinish=()=>el.remove();
    Robot.say('Got it!', `${f.name} stopped`, 1400);
  },
  retreat(){
    if(!this.el) return; clearTimeout(this.timer); const el = this.el; this.el = null;
    el.classList.remove('warn','fast'); el.querySelector('.tap')?.remove();
    el.getAnimations().forEach(a=>a.cancel());
    el.animate([{transform:`translate(${this.pos.x}px,${this.pos.y}px)`},{transform:`translate(${this.pos.x}px,${-this.pos.w*1.5}px)`}],{duration:700,easing:'ease-in',fill:'forwards'}).onfinish=()=>el.remove();
  },
  clear(){ clearTimeout(this.timer); if(this.el){ this.el.remove(); this.el = null; } },
  floatText(txt, pt){
    const d = document.createElement('div'); d.className='floattxt'; d.textContent = txt; d.style.left = pt.x+'px'; d.style.top = pt.y+'px'; stage.appendChild(d);
    d.animate([{transform:'translate(-50%,0) scale(.6)',opacity:1},{transform:'translate(-50%,-60px) scale(1.2)',opacity:0}],{duration:1300,easing:'ease-out'}).onfinish=()=>d.remove();
  },
  act(s, t){
    if(!this.el) return;
    if(t !== Game.run || s !== Game.serial){ this.clear(); return; }
    if(Game.busy){ this.timer = setTimeout(()=>this.act(s,t), 300); return; }
    const cfg = RAIDS[this.id], p = Game.cur;
    let act = cfg.act, np = null;
    if(p && p.u && (act === 'sign' || act === 'digits')) act = 'shuffle';
    if(act === 'sign'){
      if(p.op==='add' && p.a!==p.b) np = opProblem('sub', Math.max(p.a,p.b), Math.min(p.a,p.b), p);
      else if(p.op==='sub') np = opProblem('add', p.a, p.b, p);
      else if(p.op==='mul') np = opProblem('div', p.a, p.b, p);
      else if(p.op==='div') np = opProblem('mul', p.a, p.b, p);
      if(!np) act = 'time';
    }
    if(act === 'digits'){
      const sw = n => { const t = String(n); if(t.length < 2) return null;
        const pairs = []; for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++) if(t[i]!==t[j] && !(i===0 && t[j]==='0')) pairs.push([i,j]);
        if(!pairs.length) return null; const [i,j] = pick(pairs), c = t.split(''); [c[i],c[j]] = [c[j],c[i]]; return +c.join(''); };
      const opts = [];
      const A = sw(p.a), B = sw(p.b);
      const mk = (a,b) => opProblem(p.op, a, b, p);
      if(A!==null){ const q = mk(A,p.b); if(q) opts.push(q); }
      if(B!==null && !p.big){ const q = mk(p.a,B); if(q) opts.push(q); }
      np = opts.length ? pick(opts) : null; if(!np) act = 'time';
    }
    const pt = this.center();
    if(act === 'time'){
      Timer.left = Math.max(1, Timer.left - 4); Timer.paint();
      Sound.tone(900,0,.05,'square',.07); Sound.tone(700,.08,.05,'square',.07); Sound.tone(900,.16,.05,'square',.07);
      this.floatText('−4s', stagePoint($('#timer').getBoundingClientRect(), .5, 1.1));
      Robot.say('Hey!', act===cfg.act ? cfg.msg : 'It stole 4 seconds!', 1800); this.retreat();
    } else if(act === 'sign' || act === 'digits'){
      if(act==='sign'){ const ink = document.createElement('div'); ink.className='ink'; const tgt = Game.level.boss ? Boss.q : Ships.els[2]; if(tgt){ const q = stagePoint(tgt.getBoundingClientRect()); ink.style.left = (q.x-40)+'px'; ink.style.top = (q.y-40)+'px'; } stage.appendChild(ink);
        ink.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(1.2)',opacity:.9,offset:.3},{transform:'scale(1.4)',opacity:0}],{duration:1400}).onfinish=()=>ink.remove(); Sound.noise(0,.4,.15,600,200); }
      else { Sound.tone(200,0,.08,'sawtooth',.1); Sound.tone(160,.1,.08,'sawtooth',.1); }
      Game.applyProblem(np);
      Robot.say('Uh-oh!', cfg.msg, 2000); this.retreat();
    } else if(act === 'shuffle'){
      const bs = [...answersEl.querySelectorAll('.ans')]; let order = bs.slice();
      for(let k=0; k<10 && order.every((b,i)=>b===bs[i]); k++) order = shuffle(bs.slice());
      bs.forEach((b,i) => b.animate([{transform:'none'},{transform:`translateY(-40%) rotate(${i%2?12:-12}deg) scale(.8)`},{transform:'none'}],{duration:520,easing:'ease-in-out'}));
      setTimeout(()=>answersEl.append(...order), 260);
      Sound.tone(300,0,.1,'square',.06,900); Sound.tone(900,.12,.1,'square',.06,300);
      Robot.say('Uh-oh!', cfg.msg, 2000); this.retreat();
    } else if(act === 'boom'){
      const el = this.el; this.el = null; el.remove();
      Sound.boom(); stageSparks(pt, 26); $('#flash').classList.remove('go'); void stage.offsetWidth; $('#flash').classList.add('go');
      Game.cur = null; Timer.stop(true);
      if(Game.hurt('Boom!')) { Robot.say('Boom!', cfg.msg + ' New problem.', 2000); Game.replace(); }
    }
  },
};

/* =====================================================================
   TIMER — each problem must be answered in time, or it counts as a miss
   ===================================================================== */
const TIME_LIMIT = 8;
const Timer = {
  id:null, limit:TIME_LIMIT, left:TIME_LIMIT, lastSec:null, onOut:null,
  paint(){
    const el=$('#timer'), frac=Math.min(1,Math.max(0,this.left/this.limit)), sec=Math.ceil(this.left);
    $('#timerRing').style.strokeDashoffset = (264*(1-frac)).toFixed(1);
    $('#timerNum').textContent = sec;
    el.classList.toggle('mid', sec<=5 && sec>3); el.classList.toggle('low', sec<=3);
  },
  start(onOut){
    this.stop(); this.left = this.limit; this.lastSec = this.limit; this.onOut = onOut; this.rate = 1; $('#timer').classList.remove('slow');
    $('#timer').classList.remove('off'); this.paint();
    let prev = performance.now();
    this.id = setInterval(()=>{
      const now = performance.now(); this.left -= (now-prev)/1000*(this.rate||1); prev = now;
      const sec = Math.ceil(this.left);
      if(sec !== this.lastSec){ this.lastSec = sec; if(sec<=3 && sec>0) Sound.tone(sec===1?1100:880,0,.06,'square',.05); }
      this.paint();
      if(this.left <= 0){ this.stop(true); this.onOut && this.onOut(); }
    }, 100);
  },
  stop(keepShown){ clearInterval(this.id); this.id=null; if(!keepShown) $('#timer').classList.add('off'); },
  reset(){ this.stop(); this.left = this.limit; this.paint(); },
};

/* =====================================================================
   GAME FLOW
   ===================================================================== */
const Game = {
  run:0, mi:0, li:0,
  get mission(){ return MISSIONS[this.mi]; }, probs:[], idx:0, lives:5, busy:true, hitsThisLevel:0,
  get level(){ return this.mission.levels[this.li]; },
  hud(){
    const L = this.level;
    $('#hudTitle').textContent = `Level ${this.li+1} · ${L.name}`;
    const n = L.boss ? Boss.parts.length : this.probs.length, done = L.boss ? Boss.burntCount() : this.idx;
    $('#pips').innerHTML = Array.from({length:n},(_,i)=>`<span class="pip ${i<done?'on':''}"></span>`).join('');
  },
  async start(li, { landing=false, mi }={}){
    const t = ++this.run;
    if(mi !== undefined) this.mi = mi; Save.d.lastMission = this.mi; Save.write();
    overlay.hidden = true; this.li = li; this.probs = makeProblems(this.level); this.idx = 0; this.hitsThisLevel = 0; this.levelStart = Date.now();
    this.bonus = Squad.bonus(); this.lives = 5 + this.bonus.bars; this.maxLives = this.lives;
    Robot.reset(); Robot.setPower(this.lives, this.lives); robotAnim.style.opacity='1'; Ships.clear(); Timer.reset(); const boss = !!this.level.boss; stage.classList.toggle('bosslvl', boss); applyTheme(this.mission.theme); Boss.reset(boss, this.level.bossKind||'scraptor', this.level.enemies||[]);
    Timer.limit = (this.level.time || TIME_LIMIT) + this.bonus.secs; Timer.reset(); Helpers.setup(!!this.mission.helpers); this.shield = false; Robot.shield(false); this.hud(); this.setAnswers(null);
    this.busy = true;
    if(landing) await Robot.land();
    if(t !== this.run) return;
    if(boss){ await Boss.enter(); if(t !== this.run) return; Robot.say('Boss fight!', 'Right answers call the Duck Wing', 1800); await wait(900); }
    else Robot.say(`Level ${li+1}!`, this.level.say || ({mul:'Multiply ×', div:'Divide ÷', mix:'Mixed × and ÷', add:'Add +', sub:'Subtract −', mix2:'Mixed + and −'})[this.level.op], 1500);
    const prev = li>0 ? (this.mission.levels[li-1].enemies||[]) : [];
    const fresh = (this.level.enemies||[]).filter(e=>!prev.includes(e));
    for(const id of (this.level.boss ? [] : fresh)){ await introCard(fleetById(id)); if(t !== this.run) return; }
    await wait(700);
    if(t !== this.run) return;
    this.next();
  },
  serial:0,
  async next(){
    const t = this.run, p = this.probs[this.idx]; this.cur = p; this.busy = true; this.serial++; Raid.clear();
    this.setAnswers(null);
    if(this.level.boss) await Boss.ask(p); else await Ships.show(p);
    if(this.cur !== p || t !== this.run) return;
    this.setAnswers(makeChoices(p)); this.busy = false;
    this.armTimer(); Raid.maybe();
  },
  applyProblem(p){
    this.cur = p; this.probs[this.idx] = p;
    if(this.level.boss){ Boss.q.textContent = qText(p); Boss.q.animate([{filter:'brightness(2.5)'},{filter:'none'}],{duration:600}); }
    else {
      const [a,b,op] = Ships.els;
      if(a) a.querySelector('.crate').textContent = p.a; if(b) b.querySelector('.crate').textContent = p.b; if(op) op.textContent = sym(p.op);
      [a,b,op].forEach(e => e && e.animate([{filter:'brightness(2.5)'},{filter:'none'}],{duration:600}));
    }
    if(!this.busy) this.setAnswers(makeChoices(p));
  },
  async replace(){
    const t = this.run; Timer.stop(true); this.busy = true; Raid.clear();
    if(this.level.boss){ Boss.q.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.4)',opacity:0,filter:'brightness(3)'}],{duration:450}); }
    else { Ships.els.slice(0,2).forEach(sh=>{ sh && stageSparks(stagePoint(sh.getBoundingClientRect()), 12, '#bff6ff'); }); await wait(250); if(t!==this.run) return; await Ships.leave(); }
    if(t !== this.run) return;
    let np; for(let i=0;i<20;i++){ np = makeProblems({ ...this.level, count:1 })[0]; if(!this.cur || (np.u ? np.key!==this.cur.key : (np.a!==this.cur.a || np.b!==this.cur.b))) break; }
    this.probs[this.idx] = np; await wait(300); if(t !== this.run) return; this.next();
  },
  async skip(){
    Sound.freeze(); Sound.whoosh(.15,.6);
    Robot.say('Brrr… smash!', 'New problem, no penalty', 1600);
    return this.replace();
  },
  armTimer(){ const t = this.run, s = this.serial; Timer.start(()=>{ if(t===this.run && s===this.serial && !this.busy) this.miss(null); }); },
  setAnswers(choices){
    const colors = ['b-red','b-yellow','b-blue','b-green','b-orange'];
    if(!choices){ answersEl.classList.add('wait'); answersEl.querySelectorAll('.ans').forEach(b=>b.disabled=true); if(answersEl.children.length) return; choices=['?','?','?','?','?']; }
    else answersEl.classList.remove('wait');
    answersEl.innerHTML = choices.map((v,i)=>`<button class="brick ans ${colors[i]} ${String(v).length>=9?'xlong':(String(v).length>=6 || (String(v).length>=4 && /\s/.test(v)))?'long':''}" data-v="${v}" ${v==='?'?'disabled':''} aria-label="Answer ${v}">${v}</button>`).join('');
  },
  async answer(btn){
    if(this.busy || btn.disabled) return;
    const v = btn.dataset.v, p = this.cur, t = this.run, live = () => t === this.run;
    if(v === ansKey(p)){
      Timer.stop(true); this.busy = true; Raid.retreat(); Session.right(); btn.classList.add('right'); answersEl.querySelectorAll('.ans').forEach(b=>b.disabled=true);
      Sound.correct(); Robot.happy(); this.cheerCopilot(); this.idx++;
      if(this.level.boss){
        Boss.solved(ansKey(p)); const pw = Math.random() < (this.bonus?.power||0); if(pw) Robot.say('POWER HIT!', 'Your crew\'s strength burns 2 parts', 1400); await Boss.takeHit(pw?2:1); if(!live()) return; this.hud();
        if(Boss.allDown()){ await wait(300); await Boss.explode(); return live() && this.complete(); }
        await wait(700); return live() && this.next();
      }
      Ships.solved(ansKey(p)); this.hud();
      await wait(250); await Ships.blast(); await wait(650); if(!live()) return; await Ships.leave(); if(!live()) return;
      if(this.idx >= this.probs.length) return this.complete();
      this.next();
    } else {
      btn.disabled = true; btn.classList.add('burnt');
      this.miss(btn);
    }
  },
  async miss(btn){
      const p = this.cur, t = this.run;
      Timer.stop(true); this.busy = true; Session.wrong();
      if(this.level.boss){ await Boss.shoot(); if(t !== this.run) return; Boss.repair(); this.hud(); } else await Ships.shoot();
      if(t !== this.run) return;
      if(this.shield){ this.shield = false; Robot.shield(false, true); Sound.repair(); Robot.say('Blocked!', 'The shell shield saved you', 1500); await wait(600); if(t !== this.run) return; this.busy = false; this.armTimer(); return; }
      Sound.zap(); this.lives--; this.hitsThisLevel++;
      const segs = $('#lifebar').querySelectorAll('.seg'); const s = segs[this.lives]; if(s){ s.classList.add('hit'); setTimeout(()=>s.classList.remove('hit'),500); }
      Robot.setPower(this.lives);
      if(this.lives <= 0) return this.burnout();
      Robot.zap(hintFor(p), btn ? null : 'Too slow!');
      await wait(450);
      if(t !== this.run) return;
      this.busy = false; this.armTimer();
  },
  hurt(title){
    if(this.shield){ this.shield = false; Robot.shield(false, true); Sound.repair(); Robot.say('Blocked!', 'The shell shield saved you', 1500); return true; }
    Sound.zap(); this.lives--; this.hitsThisLevel++;
    const segs = $('#lifebar').querySelectorAll('.seg'); const sg = segs[this.lives]; if(sg){ sg.classList.add('hit'); setTimeout(()=>sg.classList.remove('hit'),500); }
    Robot.setPower(this.lives);
    if(this.lives <= 0){ this.burnout(); return false; }
    Robot.zap(null, title); return true;
  },
  cheerCopilot(){ const el=$('#copilot'); if(el.hidden) return; el.classList.remove('cheer'); void el.offsetWidth; el.classList.add('cheer'); },
  async burnout(){
    Raid.clear(); Sound.burnout(); Robot.burnout(); answersEl.querySelectorAll('.ans').forEach(b=>b.disabled=true);
    const t = this.run; await wait(1900); if(t !== this.run) return;
    showOverlay(`<div class="panel"><h2 class="h2">Zeebot overheated!</h2>
      <p class="sub">Five zaps drained the power cells. A quick recharge and you can try Level ${this.li+1} again.</p>
      <div class="row"><button class="brick b-green big-btn" id="oRetry">RECHARGE & RETRY</button><button class="brick b-blue big-btn" id="oMap">MAP</button></div></div>`, 'clear');
    $('#oRetry').onclick = () => { Sound.init(); Sound.beeps(5); this.start(this.li); };
    $('#oMap').onclick = () => { Robot.reset(); showMap(this.mi); };
  },
  async complete(){
    Timer.reset(); Raid.clear(); this.setAnswers(null); const t = this.run;
    await Robot.transformAndFly(); if(t !== this.run) return;
    Sound.fanfare();
    const stars = this.hitsThisLevel===0 ? 3 : this.hitsThisLevel<=2 ? 2 : 1;
    const ms = Save.mission(this.mission.id);
    ms.stars[this.li] = Math.max(ms.stars[this.li]||0, stars);
    ms.unlocked = Math.max(ms.unlocked, Math.min(this.mission.levels.length, this.li+2));
    if(this.li === this.mission.levels.length-1) ms.done = true;
    Save.write();
    Session.level({ m:this.mission.name, li:this.li, name:this.level.name, stars, boss:!!this.level.boss, secs:Math.round((Date.now()-(this.levelStart||Date.now()))/1000) });
    const cardId = this.level.card, card = CREW.find(c=>c.id===cardId);
    const isNew = card && !Save.hasCrew(cardId);
    const last = this.li === this.mission.levels.length-1;
    const msg = stars===3 ? 'Perfect flight, no zaps at all!' : stars===2 ? 'Great flying! Only a couple of zaps.' : 'You made it through the storm!';
    showOverlay(`<div class="panel"><h2 class="h2">Level ${this.li+1} complete!</h2>
      <div class="stars-row">${[1,2,3].map(i=>`<i class="${i<=stars?'on':''}">★</i>`).join('')}</div>
      <p class="sub">${msg}${last ? ` <b>You finished ${this.mission.name}: ${this.mission.title}!</b>` : ''}${last && this.mi === MISSIONS.length-1 ? ' <b>You finished ALL missions! You are a Star Math Champion!</b>' : ''}</p>
      <div id="giftZone">${isNew ? `<button class="gift" id="gift" aria-label="Open your gift"><div class="box"></div><div class="rib"></div><div class="lid"></div><div class="bow"></div></button><p class="muted">A gift card arrived! Tap to open.</p>` : ''}</div>
      <div class="row" id="doneBtns" ${isNew?'hidden':''}>${!last?`<button class="brick b-green big-btn" id="oNext">NEXT LEVEL ▸</button>`:''}${last && UNLOCK_AFTER[this.mission.id]?`<button class="brick b-green big-btn" id="oUnlock">SEE WHAT'S UNLOCKED ▸</button>`:''}<button class="brick b-blue big-btn" id="oMap">MAP</button></div></div>`);
    const ub = $('#oUnlock'); if(ub) ub.onclick = () => showUnlock(this.mi);
    if(isNew){
      $('#gift').onclick = async () => {
        const g = $('#gift'); if(g.classList.contains('open')) return; g.classList.add('open'); Sound.pop();
        const got = Save.addCrew(cardId); Session.card(cardId); if(!Save.d.copilot){ Save.d.copilot = cardId; Save.write(); renderCopilot(); }
        await wait(450);
        $('#giftZone').innerHTML = `<p class="mission-tag">NEW CREW MEMBER!</p><div class="reveal" style="display:flex;justify-content:center">${cardHTML(card,{big:true})}</div>`;
        if(Array.isArray(got)) $('#giftZone').insertAdjacentHTML('beforeend', got.map(st=>`<p class="mission-tag" style="color:#5dff8a">SET COMPLETE: ${st.name}! +${st.bonus} min bonus</p>`).join(''));
        Sound.fanfare(); tiltable($('#giftZone .card'));
        $('#doneBtns').hidden = false;
      };
    }
    const nb = $('#oNext'); if(nb){ const mi = this.mi, li = this.li, M = this.mission; nb.onclick = () => { Sound.init();
      if(Arcade.isBonusAfter(M, li)) Arcade.start(mi, li, () => launchLevel(li+1, mi, true)); else launchLevel(li+1, mi, true); }; }
    if(last && UNLOCK_AFTER[this.mission.id]) Save.unlockFleet(UNLOCK_AFTER[this.mission.id]);
    $('#oMap').onclick = () => { showMap(this.mi); };
  },
};
async function introCard(f){
  if(!f) return; const d=document.createElement('div'); d.className='intro-card'+(f.group==='helper'?' good':'');
  d.innerHTML=`<div class="ia">${fleetSVG(f.id)}</div><div><div class="it">${f.group==='helper'?'NEW HELPER':'NEW ENEMY'}</div><h3>${f.name}</h3><p>${f.line}${RAIDS[f.id]?' <b style="color:#ffe95a">Tap it fast to stop it!</b>':''}</p></div>`;
  stage.appendChild(d); Sound.tone(220,0,.25,'sawtooth',.06,440); Sound.tone(330,.25,.3,'sawtooth',.06,220);
  await wait(2800); d.animate([{opacity:1},{opacity:0,transform:'translateX(-50%) translateY(-20px)'}],{duration:300}).onfinish=()=>d.remove(); await wait(250);
}

function resetStage(){
  if(typeof Arcade!=='undefined' && Arcade.layer) Arcade.stop();
  if(typeof Intro!=='undefined' && Intro.layer){ Intro.token++; Voice.stop(); Intro.unmount(); }
  Game.run++; Sound.musicStop(); Raid.clear();
  Ships.clear(); Timer.reset(); stage.classList.remove('bosslvl'); Boss.reset(false); Helpers.setup(false); Robot.reset(); Robot.setPower(5,5); robotAnim.style.opacity='1'; Game.busy = true; Game.cur = null;
  $('#hudTitle').textContent = "Zeebot's Star Math"; $('#pips').innerHTML=''; Game.setAnswers(null);

const INTRO_LINES = [
  { scene:'hello', text:'Beep boop! I am Zeebot!' },

  { scene:'cards', text:'Collect cards and build your crew!' },

const Voice = {
  // bright, clear voices first (names differ per device); then any English voice
  BRIGHT: ['google us english','samantha','aria','jenny','ana','zira','karen','moira','tessa','google uk english female','natural','online'],
  pickVoice(){ try{
    const all = speechSynthesis.getVoices(), L = LANGS.find(x=>x.id===LANG) || LANGS[1]; let vs = [];
    for(const pre of L.voice){ vs = all.filter(v => v.lang && v.lang.toLowerCase().replace('_','-').startsWith(pre)); if(vs.length) break; }
    if(!vs.length) return null;
    const score = v => { const n = v.name.toLowerCase(); let sc = 0; this.BRIGHT.forEach((b,i) => { if(n.includes(b)) sc = Math.max(sc, 100 - i); });
      if(/en-us/i.test(v.lang.replace('_','-'))) sc += 5; if(/google|natural|online|premium|enhanced/i.test(n)) sc += 3; if(/male/.test(n) && !/female/.test(n)) sc -= 30; return sc; };
    return vs.slice().sort((a,b) => score(b) - score(a))[0];
  }catch(e){} return null; },
  chirpIn(){ [880,1320,1760].forEach((f,i)=>Sound.tone(f,i*.07,.07,'square',.05)); },
  chirpOut(){ Sound.tone(1200,0,.12,'triangle',.07,2400); Sound.tone(1800,.1,.08,'square',.04); },
  chatter(){ // quiet robot blips under the voice for a light robotic feel
    const id = setInterval(()=>{ Sound.tone(1400+Math.random()*1600,0,.03,'square',.018); }, 140);
    return () => clearInterval(id); },
  speak(text, opts={}){
    text = T(text);
    return new Promise(res => {
      const minMs = 1200 + text.length*55;
      const v = Save.d.sound ? this.pickVoice() : null;
      if(!v){ Sound.beeps(Math.min(8, 3 + Math.round(text.length/10))); setTimeout(res, minMs); return; }
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.pitch = opts.pitch ?? 1.9; u.rate = opts.rate ?? 1.12; u.volume = 1;
        let done = false, stopCh = null; const fin = () => { if(!done){ done = true; stopCh && stopCh(); this.chirpOut(); res(); } };
        u.onstart = () => { stopCh = this.chatter(); };
        u.onend = fin; u.onerror = fin; setTimeout(fin, minMs + 4000);
        this.chirpIn(); setTimeout(()=>speechSynthesis.speak(u), 260);
      }catch(e){ setTimeout(res, minMs); }
    });
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} },
};

/* =====================================================================

const ARCADE = {

const Arcade = {
  token:0,

    const W = () => stage.clientWidth, H = () => stage.clientHeight;
    // surprise warp

    warp.animate([{opacity:0,transform:'scale(.2)'},{opacity:1,transform:'scale(1.4)',offset:.5},{opacity:0,transform:'scale(2)'}],{duration:900}).onfinish = () => warp.remove();

function studioWord(word, ox, oy, sc, th, ci){
