<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e2c">
<meta name="description" content="Zeebot's Star Math: a space math game for kids. Multiply, divide and beat the boss.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeebot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}</style>
<title>Zeebot's Star Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one full-screen space stage (ships up top, robot hero center-bottom), HUD strip above, five toy-brick answers below. Menus are overlays on top of the live stage. */
:root{
  --space:#0a0e2c; --space-2:#1b1f63; --nebula:#5a2a8c;
  --red:#e8412c; --yellow:#ffc51a; --blue:#1f6fe0; --green:#2bb24c; --orange:#ff8a1f; --teal:#1fb5c9; --purple:#8e44d6;
  --ink:#141a3a; --text:#f4f7ff; --muted:#aab4e8; --panel:#1c2260; --panel-edge:#30399a;
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--space);color:var(--text);font-family:var(--body);font-weight:800;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);position:relative}

/* ---------- toy brick ---------- */
.brick{--c:var(--red);--t:#fff;position:relative;background:var(--c);color:var(--t);border-radius:10px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.35);
  font-family:var(--display);transition:transform .12s, filter .12s}
.brick::before,.brick::after{content:"";position:absolute;top:-7px;width:22%;max-width:34px;height:9px;border-radius:5px 5px 2px 2px;
  background:var(--c);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.15)}
.brick::before{left:16%}.brick::after{right:16%}
button.brick:hover{filter:brightness(1.08)}
button.brick:active{transform:translateY(3px)}
.b-red{--c:var(--red)}.b-yellow{--c:var(--yellow);--t:var(--ink)}.b-blue{--c:var(--blue)}.b-green{--c:var(--green)}.b-orange{--c:var(--orange);--t:var(--ink)}.b-teal{--c:var(--teal);--t:var(--ink)}.b-purple{--c:var(--purple)}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;position:relative;z-index:5;
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud .lvl{flex:1;min-width:0;text-align:center}
.hud .lvl b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(14px,2.4vw,20px);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;justify-content:center;gap:5px;margin-top:5px}
.pip{width:clamp(10px,2vw,18px);height:9px;border-radius:3px;background:#2a3078}
.pip.on{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.hud-btn{padding:8px 12px;font-size:13px;min-width:44px;min-height:40px}
.hud-btn::before,.hud-btn::after{top:-5px;height:6px}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;container-type:size;min-height:0}
#stars{position:absolute;inset:0;width:100%;height:100%;display:block}
.planet{position:absolute;right:-6cqmin;bottom:8cqh;width:26cqmin;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#ffb36b,#e8412c 55%,#6a1450);opacity:.55}
.planet::after{content:"";position:absolute;left:-30%;right:-30%;top:44%;height:14%;border-radius:50%;border:3px solid rgba(255,197,26,.55);transform:rotate(-14deg)}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.flash.go{animation:flash .45s}
@keyframes flash{0%,40%{opacity:.5;background:#bff}20%,60%{opacity:0}50%{opacity:.35;background:#fff}100%{opacity:0}}

/* ships */
.ship{position:absolute;top:5cqh;width:var(--sz);--sz:min(17cqw,23cqh);transform:translate(-50%,0);will-change:transform}
.ship.big{--sz:min(21cqw,27cqh)}
.ship-bob{animation:bob 2.4s ease-in-out infinite}
.ship:nth-child(odd) .ship-bob{animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-5%)}}
.ship-art svg{width:100%;height:auto;display:block;overflow:visible}
.ship-art.flip svg{transform:scaleX(-1)}
.tether{width:3px;height:3cqh;margin:-4% auto 0;background:repeating-linear-gradient(#cfd8ff 0 4px,transparent 4px 7px)}
.crate{margin:0 auto;width:78%;aspect-ratio:1.25;display:grid;place-items:center;font-size:min(8.5cqw,11cqh);line-height:1}
.crate::before,.crate::after{top:-6px;height:7px}
.op{position:absolute;top:13cqh;width:min(9cqw,13cqh);aspect-ratio:1;transform:translate(-50%,0);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#9fb0ff 40%,#3a46b8);box-shadow:0 0 0 4px #141a3a,0 0 22px #7f8cff;
  display:grid;place-items:center;font-family:var(--display);font-size:min(6.5cqw,9cqh);color:var(--ink)}
.op::after{content:"";position:absolute;left:50%;top:100%;width:40%;height:12%;transform:translateX(-50%);background:var(--yellow);border-radius:0 0 50% 50%;box-shadow:0 0 10px var(--yellow)}
.eq{position:absolute;top:10cqh;transform:translate(-50%,0);padding:1.2cqh 2.2cqw;border-radius:14px;border:3px dashed #7fe9ff;
  background:rgba(31,181,201,.14);color:#bff6ff;font-family:var(--display);font-size:min(7.5cqw,10cqh);white-space:nowrap;
  text-shadow:0 0 12px #3fe3ff;box-shadow:0 0 24px rgba(63,227,255,.25)}
.eq.solved{border-style:solid;border-color:var(--green);color:#d8ffd9;background:rgba(43,178,76,.25);text-shadow:0 0 12px #2bb24c}
.timer{position:absolute;top:3cqh;right:2.5cqw;width:min(12cqw,15cqh);aspect-ratio:1;z-index:4;transition:opacity .3s,transform .3s}
.timer.off{opacity:.25}
.timer svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.timer .tb{fill:rgba(10,14,44,.7);stroke:#2a3078;stroke-width:9}
.timer .tr{fill:none;stroke:var(--green);stroke-width:9;stroke-linecap:round;stroke-dasharray:264;transition:stroke .3s}
.timer.mid .tr{stroke:var(--yellow)}.timer.low .tr{stroke:var(--red)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:min(5.5cqw,7cqh);color:#fff}
.timer.low b{color:#ff8a7a;animation:tpulse .5s infinite alternate}
@keyframes tpulse{to{transform:scale(1.15)}}
.ship-bob{position:relative}
.ship .spart{transform-box:fill-box;transform-origin:center}
.ship .spart.burnt{filter:brightness(.35) saturate(.3)}
.ship .spart.fall{animation:partfall 1.1s ease-in forwards}
@keyframes partfall{to{transform:translate(var(--fx,10px),140px) rotate(var(--fr,220deg));opacity:0}}
.ship.hit .ship-art{animation:bshake .4s}
.ship.damaged .ship-bob{animation:limp .5s ease-in-out infinite}
@keyframes limp{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(4%)}}
.hitfire{position:absolute;width:26%;aspect-ratio:.7;margin:0;transform:translate(-50%,-80%);border-radius:50% 50% 40% 40%;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 78%,#fff6a0 0 14%,#ffc51a 30%,#ff5a1f 52%,rgba(232,65,44,0) 70%);animation:flame .11s infinite alternate}
@keyframes flame{to{transform:translate(-50%,-80%) scale(1.12,.82)}}
.hero{position:absolute;left:0;top:0;width:min(34cqw,29cqh);z-index:6;pointer-events:none}
.hero-art svg{width:100%;height:auto;display:block;overflow:visible}
.hero-art.flip svg{transform:scaleX(-1)}
.hero.hover .hero-art{animation:bob 1s ease-in-out infinite}
.hero .duck-led{animation:tip .8s steps(1) infinite}
.hero .duck-flame{animation:flick .1s infinite alternate;transform-box:fill-box;transform-origin:100% 50%}
.hero .quack{position:absolute;left:50%;top:-30%;transform:translateX(-50%) scale(.5);font-family:var(--display);font-size:min(3.4cqw,4.2cqh);color:var(--ink);
  background:var(--yellow);padding:.15em .5em;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.35);opacity:0;transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
.hero .quack.show{opacity:1;transform:translateX(-50%) scale(1)}
.bolt.duck{width:3.4cqmin;height:3.4cqmin;background:#fff6a0;box-shadow:0 0 0 3px #ff7ae0,0 0 16px 6px #ffc51a}
.boss{position:absolute;left:50%;top:2cqh;width:min(68cqw,64cqh);transform:translateX(-50%);z-index:2}
.boss-in{animation:bob 3s ease-in-out infinite}
.boss svg{width:100%;height:auto;display:block;overflow:visible}
.boss .bfire{display:none}
.boss .bpart.burnt .bfire{display:inline}
.boss .bpart.burnt .bs{filter:brightness(.28) saturate(.2)}
.boss .bpart.fixed .bs{animation:fixglow .7s}
@keyframes fixglow{30%{filter:brightness(2) drop-shadow(0 0 8px #5dff8a)}}
.boss .bfire ellipse{animation:flick .1s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.boss .beye{animation:eyepulse 1s infinite alternate}
@keyframes eyepulse{from{fill:#ff1f1f}to{fill:#ff9a8a}}
.boss.shake .boss-in{animation:bshake .45s}
@keyframes bshake{20%{transform:translate(-3%,1%) rotate(-3deg)}40%{transform:translate(3%,-1%) rotate(3deg)}60%{transform:translate(-2%,0) rotate(-1deg)}80%{transform:translate(1%,0)}}
.boss.enter{animation:bossenter 1.3s cubic-bezier(.2,.8,.3,1)}
@keyframes bossenter{from{transform:translate(-50%,-120%) scale(.6)}}
.boss.dead{animation:bossdie 1.3s forwards}
@keyframes bossdie{0%,60%{transform:translateX(-50%)}10%{transform:translate(-52%,1%)}20%{transform:translate(-48%,-1%)}30%{transform:translate(-52%,0)}40%{transform:translate(-48%,1%)}100%{transform:translate(-50%,-10%) scale(1.4);opacity:0;filter:brightness(4)}}
.bossq{position:absolute;left:50%;top:37cqh;transform:translateX(-50%);padding:1cqh 2.4cqw;border-radius:14px;border:3px dashed #ff8a8a;
  background:rgba(232,65,44,.16);color:#ffe0dc;font-family:var(--display);font-size:min(7cqw,8cqh);white-space:nowrap;text-shadow:0 0 12px #ff4a3a;z-index:3}
.bossq.solved{border-style:solid;border-color:var(--green);color:#d8ffd9;background:rgba(43,178,76,.25);text-shadow:0 0 12px #2bb24c}
.bosslvl .planet{display:none}
.bosslvl .robot-wrap{height:40cqh}
.bolt.good{background:#fff;box-shadow:0 0 10px 4px #3fe3ff,0 0 30px 10px #1f6fe0}
.fsvg .o{stroke:#141a3a;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.fsvg .fl{animation:fflick .12s infinite alternate;transform-box:fill-box;transform-origin:100% 50%}
@keyframes fflick{from{transform:scaleX(.8)}to{transform:scaleX(1.1)}}
.ship.wreck .ship-art svg{filter:brightness(.35) saturate(.3)}
.debris{position:absolute;width:2.4cqmin;height:1.6cqmin;background:#3a4058;border:2px solid #141a3a;border-radius:2px;pointer-events:none;z-index:4}
/* ---- underwater theme (Mission 2) ---- */
.sea-decor{position:absolute;inset:0;pointer-events:none;display:none;overflow:hidden}
.sea .sea-decor{display:block}
.sea .planet{display:none}
.fish{position:absolute;left:0;width:min(7cqw,9cqh);animation:swim linear infinite}
.fish svg{width:100%;height:auto;display:block}
.fish.rev svg{transform:scaleX(-1)}
.fish.rev{animation-name:swimrev}
@keyframes swim{from{transform:translateX(-12cqw)}to{transform:translateX(112cqw)}}
@keyframes swimrev{from{transform:translateX(112cqw)}to{transform:translateX(-12cqw)}}
.fish .fb{animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{to{transform:translateY(8%)}}
.starfish{position:absolute;bottom:.5cqh;width:min(6cqw,7cqh);animation:sfpulse 4s ease-in-out infinite}
@keyframes sfpulse{50%{transform:rotate(14deg) scale(1.08)}}
.weed{position:absolute;bottom:-1cqh;width:min(5cqw,8cqh);transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.dome{display:none;position:absolute;left:-16%;right:-16%;top:-9%;bottom:-3%;border-radius:50% 50% 14% 14%/62% 62% 10% 10%;pointer-events:none;
  border:3px solid rgba(170,240,255,.75);background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.4),rgba(255,255,255,0) 22%),radial-gradient(circle at 50% 45%,rgba(120,220,255,.06),rgba(120,220,255,.2));
  box-shadow:inset 0 0 28px rgba(127,233,255,.4),0 0 22px rgba(127,233,255,.3)}
.dome::after{content:"";position:absolute;left:3%;right:3%;bottom:-4%;height:9%;border-radius:8px;background:linear-gradient(#b8c6dd,#5d6b84);border:3px solid #141a3a}
.sea .dome{display:block}
/* helpers (Mission 2 power-ups) */
.helpers{position:absolute;left:max(2cqw,8px);bottom:3cqh;display:flex;flex-direction:column-reverse;gap:1.4cqh;z-index:7}
.hbtn{position:relative;width:min(11cqw,12cqh);aspect-ratio:1;border-radius:50%;padding:6%;background:radial-gradient(circle at 40% 30%,#3fd7a0,#1d7a55);border:3px solid #fff;
  box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 16px rgba(93,255,138,.5);animation:hpulse 1.6s ease-in-out infinite}
.hbtn svg{width:100%;height:100%;display:block;overflow:visible}
.hbtn b{position:absolute;left:50%;bottom:-.6em;transform:translateX(-50%);font-family:var(--display);font-weight:400;font-size:min(2cqw,2.4cqh);background:#fff;color:var(--ink);border-radius:6px;padding:0 .4em;white-space:nowrap}
.hbtn::after{content:"";position:absolute;inset:-16%;border-radius:50%;border:3px dashed #ffe95a;animation:hspin 5s linear infinite;pointer-events:none;box-shadow:0 0 14px rgba(255,233,90,.6)}
.hbtn::before{content:"";position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,233,90,.55),rgba(93,255,138,.25) 45%,rgba(93,255,138,0) 70%);animation:haura 1.4s ease-in-out infinite;pointer-events:none;z-index:-1}
.hbtn.used{filter:grayscale(1) brightness(.45);animation:none;cursor:default;box-shadow:none}
.hbtn.used::after,.hbtn.used::before{display:none}
@keyframes hpulse{0%,100%{transform:scale(1);box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 14px 4px rgba(93,255,138,.6)}50%{transform:scale(1.09);box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px 12px rgba(255,233,90,.85)}}
@keyframes hspin{to{transform:rotate(360deg)}}
@keyframes haura{50%{transform:scale(1.18);opacity:.6}}
.raider{position:absolute;left:0;top:0;width:min(22cqw,26cqh);z-index:8;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation}
.raider svg{width:100%;height:auto;display:block;overflow:visible}
.raider.left svg{transform:scaleX(1)}.raider.right svg{transform:scaleX(-1)}
.raider.warn svg{animation:raidwarn .4s ease-in-out infinite alternate}
.raider.warn.fast svg{animation-duration:.15s}
@keyframes raidwarn{from{filter:drop-shadow(0 0 4px #ff3b3b)}to{filter:drop-shadow(0 0 16px #ff3b3b) brightness(1.25)}}
.raider .tap{position:absolute;left:50%;top:-22%;transform:translateX(-50%);font-family:var(--display);font-size:min(3.2cqw,3.8cqh);background:var(--red);color:#fff;padding:.1em .55em;border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.35);animation:tapb .45s ease-in-out infinite alternate;white-space:nowrap}
@keyframes tapb{to{transform:translateX(-50%) translateY(-5px) scale(1.1)}}
.floattxt{position:absolute;font-family:var(--display);font-size:min(5cqw,6cqh);color:#ff6a4a;text-shadow:0 3px 0 #141a3a;pointer-events:none;z-index:9}
.ink{position:absolute;width:min(16cqw,18cqh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#1a1030 0 45%,rgba(26,16,48,.7) 55%,rgba(26,16,48,0) 70%);pointer-events:none;z-index:6}
.hfly{position:absolute;width:min(16cqw,18cqh);pointer-events:none;z-index:8}
.hfly svg{width:100%;height:auto;display:block;overflow:visible}
.ans.hinted{animation:hint .6s ease-in-out infinite alternate;box-shadow:0 0 0 4px #fff,0 0 34px #ffe95a}
@keyframes hint{to{transform:translateY(-6px) scale(1.06)}}
.ans.dim{opacity:.25;pointer-events:none}
.intro-card{position:absolute;left:50%;top:6cqh;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:14px;max-width:min(560px,92%);
  background:rgba(20,26,58,.92);border:3px solid var(--red);border-radius:16px;padding:10px 16px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:panelIn .4s cubic-bezier(.3,1.4,.5,1)}
.intro-card.good{border-color:var(--green)}
.intro-card .ia{width:min(110px,22cqw);flex:none}.intro-card .ia svg{width:100%;height:auto;display:block}
.intro-card .it{font-family:var(--display);font-size:13px;color:var(--orange);letter-spacing:.06em}
.intro-card h3{margin:2px 0;font-family:var(--display);font-weight:400;font-size:20px}
.intro-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.35}
.minions .mn{position:absolute;width:min(14cqw,16cqh);z-index:2;animation:bob 2.2s ease-in-out infinite}
.minions .mn svg{width:100%;height:auto;display:block;overflow:visible}
.minions .mn:nth-child(even){animation-delay:-1.1s}
.minions .mn.flip svg{transform:scaleX(-1)}
/* mission tabs + fleet cards */
.mtabs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mtab{padding:10px 16px;font-size:14px}
.mtab.cur{box-shadow:0 0 0 3px #fff,inset 0 -6px 0 rgba(0,0,0,.25)}
.mtab.locked{--c:#2a3070!important;--t:#7880c0!important}
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;width:100%}
.fcard{border-radius:16px;padding:10px;text-align:left;background:linear-gradient(160deg,#2a2f6a,#1a1f50);box-shadow:0 0 0 3px var(--gc,#3a4290),0 8px 20px rgba(0,0,0,.4);animation:fcIn .55s cubic-bezier(.3,1.5,.5,1) backwards}
.fcard.enemy{--gc:var(--red)}.fcard.helper{--gc:var(--green)}
.fcard .fa{border-radius:10px;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.22),rgba(0,0,0,.2));aspect-ratio:4/3;display:grid;place-items:center}
.fcard .fa svg{width:92%;height:auto}
.fcard .ft{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gc);margin-top:6px}
.fcard h4{margin:2px 0 4px;font-family:var(--display);font-weight:400;font-size:15px}
.fcard p{margin:0;font-size:12px;line-height:1.35;color:#d6dcff}
.fcard .pw{margin-top:6px;font-size:11px;background:rgba(93,255,138,.15);color:#c8ffd6;border-radius:8px;padding:4px 6px}
.fcards.small{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.fcards.small .fcard.locked p,.fcards.small .fcard.locked .ft{display:none}
.fcards.small .fcard.locked h4{font-size:12px;text-align:center}
.fcards.small .fcard.locked .fa b{font-size:34px}
.fcard.locked{--gc:#3a4290;color:#7880c0;background:repeating-linear-gradient(45deg,#232a68 0 10px,#1e245c 10px 20px)}
.fcard.locked .fa{background:none}.fcard.locked .fa b{font-family:var(--display);font-size:48px;color:#3a4290}
@keyframes fcIn{from{opacity:0;transform:translateY(30px) scale(.6) rotate(-6deg)}}
.unlocked-title{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(40px,9vw,84px);color:#5dff8a;text-shadow:0 5px 0 #1d7a33,0 0 30px rgba(93,255,138,.6);animation:ulk 1s cubic-bezier(.3,1.6,.5,1)}
@keyframes ulk{from{transform:scale(.2) rotate(-12deg);opacity:0}}
.grp-h{font-family:var(--display);font-weight:400;font-size:18px;margin:6px 0 0;align-self:flex-start}
.bolt{position:absolute;width:3cqmin;height:3cqmin;border-radius:50%;background:#fff;box-shadow:0 0 10px 4px #ff3b3b,0 0 30px 10px #ff8a1f;pointer-events:none;z-index:4}

/* robot */
.robot-wrap{position:absolute;left:50%;bottom:10cqh;height:47cqh;aspect-ratio:200/270;transform:translateX(-50%);z-index:3}
.robot-anim{width:100%;height:100%;transform-origin:50% 100%}
#robot{width:100%;height:100%;display:block;overflow:visible;cursor:pointer;transition:filter .4s}
.robot-anim.jump{animation:jump .65s cubic-bezier(.3,.7,.4,1)}
@keyframes jump{0%{transform:none}15%{transform:scale(1.08,.9)}45%{transform:translateY(-18%) scale(.95,1.06)}75%{transform:scale(1.07,.93)}100%{transform:none}}
.robot-anim.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-5%) rotate(-4deg)}30%{transform:translateX(5%) rotate(4deg)}45%{transform:translateX(-4%) rotate(-3deg)}60%{transform:translateX(3%) rotate(2deg)}80%{transform:translateX(-1%)}}
.robot-anim.fly{animation:fly 1.4s cubic-bezier(.55,0,.85,.35) forwards}
@keyframes fly{0%{transform:none}25%{transform:translateY(6%) rotate(-6deg)}100%{transform:translate(70cqw,-140cqh) rotate(38deg) scale(.7)}}
.robot-anim.land{animation:land 1.1s cubic-bezier(.2,.8,.3,1)}
@keyframes land{0%{transform:translate(-40cqw,-140cqh) rotate(-30deg) scale(.7)}70%{transform:translateY(4%) scale(1.04,.95)}100%{transform:none}}

#robot .rb-eye{transform-box:fill-box;transform-origin:center;transition:transform .07s}
#robot.blink .rb-eye{transform:scaleY(.08)}
#robot .rb-arm-l{transform-origin:52px 132px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#robot .rb-arm-r{transform-origin:148px 132px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#robot[data-mood=happy] .rb-arm-l{transform:rotate(118deg)}
#robot[data-mood=happy] .rb-arm-r{transform:rotate(-118deg)}
#robot[data-mood=hurt] .rb-arm-l{animation:flail .12s 5 alternate}
#robot[data-mood=hurt] .rb-arm-r{animation:flail .12s 5 alternate-reverse}
@keyframes flail{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
#robot[data-mood=burnt] .rb-arm-l{transform:rotate(-12deg)}
#robot[data-mood=burnt] .rb-arm-r{transform:rotate(12deg)}
#robot .mouth,#robot .cheek,#robot .xeyes{display:none}
#robot[data-mood=idle] .m-idle,#robot[data-mood=happy] .m-happy,#robot[data-mood=happy] .cheek,#robot[data-mood=hurt] .m-hurt,#robot[data-mood=burnt] .m-hurt,#robot[data-mood=burnt] .xeyes{display:inline}
#robot[data-mood=burnt] .pupil{display:none}
#robot .ant-tip{animation:tip 1.1s steps(1) infinite}
#robot .ant-tip.r{animation-delay:-.55s}
@keyframes tip{0%{fill:#ff3b3b}50%{fill:#ffe95a}}
#robot .rb-zap{opacity:0;pointer-events:none}
#robot.zapping{filter:drop-shadow(0 0 10px #6ff) brightness(1.35)}
#robot.zapping .rb-zap{animation:zapflick .55s steps(1)}
@keyframes zapflick{0%,30%,60%{opacity:1}15%,45%,80%,100%{opacity:0}}
#robot.burnt{filter:grayscale(.75) brightness(.5) sepia(.3)}
#robot .rb-legs{transform-origin:100px 204px;transition:transform .35s}
#robot.shipmode .rb-legs{transform:scaleY(0)}
#robot .rb-wings{transform-origin:100px 165px;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.5,.5,1) .15s}
#robot.shipmode .rb-wings{transform:scale(1)}
#robot .rb-flame{transform-origin:100px 206px;transform:scaleY(0);transition:transform .3s .35s}
#robot.shipmode .rb-flame{transform:scaleY(1)}
#robot .rb-flame ellipse{animation:flick .09s infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes flick{to{transform:scaleY(.82)}}
#robot.shipmode .rb-arm-l{transform:rotate(-28deg)}
#robot.shipmode .rb-arm-r{transform:rotate(28deg)}
#robot .rb-soot{transition:opacity .4s}

.bubble{position:absolute;left:72%;top:-4%;background:#fff;color:var(--ink);font-family:var(--display);font-size:min(3.6cqw,4.6cqh);
  padding:.5em .8em;border-radius:16px 16px 16px 4px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.3);
  opacity:0;transform:scale(.6) translateY(10px);transform-origin:0 100%;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:6}
.bubble.show{opacity:1;transform:none}
.bubble small{display:block;font-family:var(--body);font-weight:900;font-size:.62em;color:#4a52a0;margin-top:2px}
.puff{position:absolute;width:18%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#9aa0b8 0,#5a6078 55%,transparent 70%);pointer-events:none}
.spark{position:absolute;width:2.2cqmin;height:2.2cqmin;border-radius:50%;background:#fff6a0;box-shadow:0 0 8px 3px #ffcc33;pointer-events:none}

.copilot{position:absolute;left:calc(50% - 31cqh);bottom:32cqh;width:15cqh;z-index:2;animation:bob 2s ease-in-out infinite;pointer-events:none}
.copilot svg{width:100%;height:auto;display:block}
.copilot.cheer{animation:cheer .7s}
@keyframes cheer{50%{transform:translateY(-30%) rotate(360deg)}}

.lifebar{position:absolute;left:50%;bottom:2.5cqh;transform:translateX(-50%);display:flex;align-items:center;gap:min(1.2cqw,8px);z-index:3}
.lifebar .seg.extra:not(.off){background:#5ff2ff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 12px rgba(95,242,255,.8)}
.lifebar .lbl{font-family:var(--display);font-size:min(2.6cqw,3.4cqh);color:var(--muted);margin-right:4px}
.seg{width:min(7cqw,9cqh);height:min(3cqw,4.2cqh);border-radius:5px;background:var(--green);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 10px rgba(43,178,76,.6);transition:background .3s,box-shadow .3s}
.lifebar.mid .seg{background:var(--yellow);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 10px rgba(255,197,26,.6)}
.lifebar.low .seg{background:var(--red);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 12px rgba(232,65,44,.8)}
.seg.off{background:#2a2f5a!important;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)!important}
.seg.hit{animation:seghit .5s}
@keyframes seghit{30%{transform:scale(1.4);background:#fff}}

/* answers */
.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,1.6vw,18px);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-width:900px;width:100%;margin:0 auto;position:relative;z-index:5}
.ans{font-size:clamp(22px,5vw,44px);padding:clamp(10px,2vh,20px) 0;min-height:56px;font-variant-numeric:tabular-nums}
.ans:disabled{cursor:default}
.answers.wait .ans{opacity:.35;transform:translateY(6px)}
.ans.burnt{--c:#3a2a2a!important;--t:#8a6a5a!important;filter:none;text-decoration:line-through}
.ans.right{animation:pop .5s;box-shadow:0 0 0 4px #fff,0 0 30px var(--c)}
@keyframes pop{40%{transform:scale(1.18)}}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 30%,rgba(27,31,99,.86),rgba(10,14,44,.95))}
.overlay.clear{background:rgba(10,14,44,.55)}
.panel{margin:auto;width:min(760px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;animation:panelIn .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(24px) scale(.95)}}
.logo{font-family:var(--display);font-weight:400;line-height:.95;margin:0;font-size:clamp(40px,9vw,92px);text-wrap:balance;
  color:var(--yellow);text-shadow:0 5px 0 var(--red),0 10px 0 #7a1630,0 14px 30px rgba(0,0,0,.6)}
.logo span{display:block;color:#fff;font-size:.45em;text-shadow:0 3px 0 var(--blue),0 6px 0 #10307a;letter-spacing:.04em}
.sub{color:var(--muted);font-size:clamp(15px,2.2vw,19px);max-width:52ch;margin:0;line-height:1.45}
.h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,4.6vw,40px);margin:0;color:#fff;text-shadow:0 4px 0 var(--blue);text-wrap:balance}
.big-btn{font-size:clamp(18px,3vw,26px);padding:16px 34px}
.row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}

/* map */
.mission-tag{font-family:var(--display);color:var(--orange);font-size:14px;letter-spacing:.12em}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 12px;width:100%}
@media (max-width:560px){.levels{grid-template-columns:repeat(3,1fr)}}
.lv{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 10px;min-height:118px}
.lv .n{font-size:30px;line-height:1}
.lv .nm{font-family:var(--body);font-weight:900;font-size:12px;line-height:1.15;opacity:.9}
.lv .opl{font-family:var(--body);font-weight:900;font-size:11px;background:rgba(0,0,0,.22);border-radius:6px;padding:2px 6px}
.lv .st{font-size:14px;letter-spacing:1px;min-height:18px}
.lv.locked{--c:#2a3070!important;--t:#7880c0!important;cursor:not-allowed}
.lv.locked .n{font-size:22px}
.coming{width:100%;border:3px dashed #3a4290;border-radius:14px;padding:12px;color:#7880c0;font-size:14px}

/* cards */
.card{--r1:#3a7bff;--r2:#1a3a9a;width:220px;max-width:100%;border-radius:18px;padding:10px;position:relative;
  background:linear-gradient(160deg,var(--r1),var(--r2));box-shadow:0 0 0 4px #fff,0 10px 30px rgba(0,0,0,.5);color:#fff;text-align:left;
  transform-style:preserve-3d;transition:transform .15s}
.card.rare{--r1:#b45cff;--r2:#4a1a8c}
.card.legendary{--r1:#ffd34a;--r2:#e8412c;box-shadow:0 0 0 4px #fff6c0,0 0 40px rgba(255,197,26,.7),0 10px 30px rgba(0,0,0,.5)}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.card .cn{font-family:var(--display);font-size:17px;line-height:1.05}
.card .rar{font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.25);padding:2px 6px;border-radius:6px;white-space:nowrap}
.card .art{margin:8px 0;border-radius:12px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.35),rgba(0,0,0,.25));aspect-ratio:1.2;display:grid;place-items:center;overflow:hidden}
.card .art svg{width:78%;height:auto}
.card .role{font-size:12px;opacity:.9;margin-bottom:6px}
.stat{display:grid;grid-template-columns:62px 1fr 20px;align-items:center;gap:6px;font-size:11px;margin:3px 0;font-variant-numeric:tabular-nums}
.stat .bar{height:8px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:4px}
.stat.s1 i{background:#ff6a4a}.stat.s2 i{background:#5dff8a}.stat.s3 i{background:#5ad8ff}
.card .sp{margin-top:7px;font-size:11px;background:rgba(0,0,0,.22);border-radius:8px;padding:5px 7px;line-height:1.3}
.card.locked{--r1:#2a3070;--r2:#1a1f50;box-shadow:0 0 0 3px #3a4290;color:#7880c0}
.card.locked .art{background:repeating-linear-gradient(45deg,#232a68 0 10px,#1e245c 10px 20px)}
.card.locked .art b{font-family:var(--display);font-size:54px;color:#3a4290}
.card .copi{position:absolute;top:-10px;right:-8px;background:var(--yellow);color:var(--ink);font-size:10px;font-family:var(--display);padding:3px 7px;border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;width:100%;justify-items:center}
.cards .card{width:100%;cursor:pointer}
.cards .card .cn{font-size:14px}
.cards .card .stat{grid-template-columns:52px 1fr 18px;font-size:10px}
.big-card{width:min(300px,82vw);touch-action:none}
.big-card .cn{font-size:22px}
.big-card .role{font-size:14px}.big-card .stat{font-size:13px;grid-template-columns:72px 1fr 22px}.big-card .stat .bar{height:11px}.big-card .sp{font-size:13px}

/* gift */
.gift{width:170px;height:170px;position:relative;cursor:pointer;animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:none}70%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-3deg)}}
.gift .box{position:absolute;left:10%;right:10%;bottom:0;height:62%;border-radius:12px;background:var(--blue);box-shadow:inset 0 -8px 0 rgba(0,0,0,.25)}
.gift .lid{position:absolute;left:4%;right:4%;top:18%;height:22%;border-radius:10px;background:var(--blue);filter:brightness(1.15);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.gift .rib{position:absolute;left:44%;width:12%;top:18%;bottom:0;background:var(--yellow)}
.gift .bow{position:absolute;left:50%;top:4%;width:44%;height:20%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 25% 60%,var(--yellow) 0 38%,transparent 40%),radial-gradient(ellipse at 75% 60%,var(--yellow) 0 38%,transparent 40%)}
.gift.open{animation:none}
.gift.open .lid,.gift.open .bow{transform:translateY(-90px) rotate(-25deg);opacity:0;transition:transform .5s,opacity .5s}
.reveal{animation:reveal .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes reveal{from{transform:translateY(60px) scale(.2) rotateY(540deg);opacity:0}}
.stars-row{font-size:clamp(40px,8vw,64px);letter-spacing:8px;line-height:1}
.stars-row i{font-style:normal;display:inline-block;color:#3a4290;animation:starIn .5s cubic-bezier(.3,1.6,.5,1) backwards}
.stars-row i.on{color:var(--yellow);text-shadow:0 0 18px var(--yellow)}
.stars-row i:nth-child(2){animation-delay:.2s}.stars-row i:nth-child(3){animation-delay:.4s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.muted{color:var(--muted);font-size:14px}
.cards.pick{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.pickwrap{position:relative;width:100%;cursor:pointer;border-radius:20px;transition:transform .15s}
.pickwrap .card{width:100%;pointer-events:none}
.pickwrap:not(.picked){opacity:.6;filter:saturate(.6)}
.pickwrap.picked{outline:5px solid var(--yellow);outline-offset:3px;transform:translateY(-4px)}
.pnum{position:absolute;top:-12px;left:-10px;z-index:3;width:34px;height:34px;border-radius:50%;background:var(--yellow);color:var(--ink);font-family:var(--display);display:grid;place-items:center;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{font-family:var(--display);background:#141a3a;border:3px solid #5ff2ff;color:#fff;border-radius:999px;padding:6px 14px;font-size:clamp(14px,2.2vw,18px)}
.intro-layer{position:absolute;inset:0;z-index:12;pointer-events:none;overflow:hidden}
.i-skip{position:absolute;top:2.5cqh;right:2.5cqw;z-index:30;pointer-events:auto;font-size:clamp(16px,2.6vw,22px);padding:10px 20px}
.i-duck{position:absolute;left:0;top:0;width:min(26cqw,24cqh);z-index:13}
.i-duck svg{width:100%;height:auto;display:block;overflow:visible}
.i-duck.flip svg{transform:scaleX(-1)}
.i-duck .hero-art{animation:bob 1s ease-in-out infinite}
.i-card{position:absolute;left:0;top:0;width:150px;transform-origin:50% 50%;will-change:transform}
.i-card .card{width:100%;pointer-events:none}
.i-ship{position:absolute;width:min(20cqw,22cqh);z-index:12}

.i-ship .crate{position:absolute;left:50%;top:92%;transform:translateX(-50%);font-family:var(--display);font-size:min(6cqw,7cqh);background:var(--yellow);color:var(--ink);padding:0 .35em;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.i-big{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:min(3cqw,22px);align-items:center;justify-content:center;z-index:12;flex-wrap:nowrap}
.i-stars{top:16cqh;font-size:min(14cqw,16cqh);color:var(--yellow);text-shadow:0 0 24px var(--yellow),0 5px 0 #b3243a}
.i-stars span{display:inline-block;animation:starIn .5s cubic-bezier(.3,1.6,.5,1) backwards}
.i-min{top:44cqh;font-family:var(--display);font-size:min(7cqw,8cqh);color:#fff}
.i-min b{color:var(--yellow);font-weight:400;text-shadow:0 0 18px rgba(255,233,90,.7)}
.i-games{top:14cqh;flex-wrap:wrap;width:94%}
.i-game{font-family:var(--display);font-size:min(5.5cqw,7cqh);padding:.45em .8em;border-radius:16px;color:#fff;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(255,233,90,.5);animation:panelIn .6s cubic-bezier(.3,1.6,.5,1) backwards;white-space:nowrap;text-align:center}
.i-game small{display:block;font-size:.55em;color:var(--yellow)}
.i-cap{position:absolute;left:50%;bottom:3cqh;transform:translateX(-50%);z-index:20;max-width:92%;width:max-content;text-align:center;font-family:var(--display);font-size:clamp(18px,4.4cqw,34px);line-height:1.2;color:var(--ink);background:#fff;border-radius:18px;padding:.45em .9em;box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 0 4px var(--yellow);box-sizing:border-box}
.i-cap.pop{animation:panelIn .4s cubic-bezier(.3,1.6,.5,1)}
.i-gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:25;background:rgba(10,14,44,.55);pointer-events:auto}
.i-play{width:min(34cqw,30cqh);aspect-ratio:1;border-radius:50%;border:6px solid #fff;background:radial-gradient(circle at 40% 30%,#ffe95a,#ff8a1f);color:var(--ink);font-size:min(14cqw,12cqh);cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.35),0 0 40px rgba(255,233,90,.7);animation:hpulse 1.4s ease-in-out infinite;display:grid;place-items:center;padding-left:4%}
.namebox{display:flex;flex-direction:column;align-items:center;gap:8px}
.namebox label{font-family:var(--display);color:var(--yellow);font-size:clamp(16px,2.6vw,22px)}
.namein{font-family:var(--display);font-size:clamp(22px,4vw,32px);text-align:center;width:min(360px,80vw);padding:10px 14px;border-radius:14px;border:4px solid #fff;background:#141a3a;color:#fff;outline:none;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.namein:focus{border-color:var(--yellow)}
.namein.shake{animation:nshake .35s}
@keyframes nshake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.score{width:min(520px,100%);background:rgba(20,26,58,.85);border:3px solid #fff;border-radius:18px;padding:14px 18px;text-align:left;box-sizing:border-box}
.score .ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.18);color:#fff;font-size:clamp(14px,2.2vw,18px)}
.score .ln:last-child{border-bottom:0}
.score .ln b{font-family:var(--display);font-weight:400;color:var(--yellow);white-space:nowrap}
.ticket{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 18px;border-radius:24px;border:4px dashed var(--yellow);background:radial-gradient(circle at 50% 0,rgba(255,233,90,.18),rgba(20,26,58,.6) 70%);width:min(560px,100%);box-sizing:border-box;animation:panelIn .6s cubic-bezier(.3,1.6,.5,1)}
.earned{font-family:var(--display);font-size:clamp(46px,10vw,84px);color:var(--yellow);text-shadow:0 0 24px rgba(255,233,90,.6),0 5px 0 #b3243a;line-height:1}
.earned small{display:block;font-size:.3em;color:#fff;text-shadow:none;margin-top:6px}
.gpick{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.gpick .brick{opacity:.55}.gpick .brick.sel{opacity:1;outline:4px solid #fff;outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .ship-bob,.copilot,.gift{animation:none}
}

<body>
<div id="app">
  <header class="hud">
    <button class="brick b-blue hud-btn" id="btnMap" aria-label="Mission map">MAP</button>
    <div class="lvl"><b id="hudTitle">Zeebot's Star Math</b><div class="pips" id="pips"></div></div>
    <button class="brick b-purple hud-btn" id="btnCards" aria-label="Crew cards">CREW</button>
    <button class="brick b-teal hud-btn" id="btnSound" aria-label="Sound on or off">♪</button>

  get(){ const s = Save.d.session || (Save.d.session = { start:Date.now(), levels:[], right:0, wrong:0, secs:0, cards:[] }); s.cards = s.cards || []; return s; },
  card(id){ this.get().cards.push(id); Save.write(); },

  wrong(){ this.get().wrong++; Save.write(); },
  level(entry){ const s = this.get(); s.levels.push(entry); s.secs += entry.secs; Save.write(); },
  calc(){
    const s = this.get(), total = s.right + s.wrong, acc = total ? s.right/total : 0;
    let raw = 0; for(const L of s.levels) raw += REWARD.perLevel + REWARD.perStar*L.stars + (L.boss ? REWARD.bossBonus : 0);
    const accBonus = s.levels.length && acc >= REWARD.accuracyMin ? REWARD.accuracyBonus : 0; raw += accBonus;
    const used = Save.d.claims[todayKey()] || 0, left = Math.max(0, REWARD.dailyCap - used);
    const sets = Sets.pending(), setBonus = sets.reduce((a,st)=>a+st.bonus,0);
    return { s, total, acc, raw, accBonus, sets, setBonus, minutes:Math.min(raw, left) + setBonus, capped: raw > left, used, left,

const shuffle = arr => { for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };

   ===================================================================== */
function genAddSub(op, tier){
  const ones = n => n % 10;
  for(let tries=0; tries<200; tries++){
    let a, b;
    if(op === 'add'){
      if(tier===1){ a=rnd(1,15); b=rnd(1,20-a); }
      else if(tier===2){ if(Math.random()<.5){ a=rnd(1,9)*10; b=rnd(1,9); } else { a=rnd(1,8)*10; b=rnd(1,10-a/10)*10; } }
      else if(tier===3){ a=rnd(11,88); b=rnd(10,99-a); if(ones(a)+ones(b)>=10) continue; }
      else if(tier===4){ a=rnd(12,88); b=rnd(5,100-a); if(ones(a)+ones(b)<10) continue; }
      else { a=rnd(2,95); b=rnd(2,100-a); }
      if(a<1||b<1||a+b>100) continue;
      return { op, a, b, ans:a+b };
    } else {
      if(tier===1){ a=rnd(3,20); b=rnd(1,a-1); }
      else if(tier===2){ if(Math.random()<.5){ a=rnd(2,10)*10; b=rnd(1,a/10-1)*10; } else { a=rnd(21,99); b=Math.floor(Math.random()*Math.floor(a/10))*10 || 10; if(b>=a) continue; } }
      else if(tier===3){ a=rnd(21,99); b=rnd(11,a-1); if(ones(a)<ones(b)) continue; }
      else if(tier===4){ a=rnd(21,99); b=rnd(6,a-2); if(ones(a)>=ones(b)) continue; }
      else { a=rnd(10,100); b=rnd(2,a-1); }
      if(b<1||a-b<1) continue;
      return { op, a, b, ans:a-b };
    }
  }
  return op==='add' ? { op, a:2, b:3, ans:5 } : { op, a:9, b:4, ans:5 };
}
function makeProblems(level){
  if(['add','sub','mix2'].includes(level.op)){
    const out=[], seen=new Set();
    for(let i=0; out.length<level.count && i<level.count*30; i++){
      const p = genAddSub(level.op==='mix2' ? pick(['add','sub']) : level.op, level.tier||5);
      const k = p.op+p.a+','+p.b; if(seen.has(k) && i<level.count*20) continue; seen.add(k); out.push(p);
    }
    return out;
  }
  const ops = level.op === 'mix' ? ['mul','div'] : [level.op];
  const pool = [];
  for(const t of level.tables) for(let k=1;k<=10;k++) for(const op of ops){
    if(op === 'mul') pool.push({ op, a:t, b:k, ans:t*k });
    else pool.push({ op, a:t*k, b:t, ans:k });
  }
  shuffle(pool);
  return pool.slice(0, level.count).map(p => (p.op==='mul' && Math.random()<.5) ? { ...p, a:p.b, b:p.a } : p);
}
function makeChoices(p){
  const near = [], far = [];
  if(p.op === 'mul'){
    near.push((p.a+1)*p.b, (p.a-1)*p.b, p.a*(p.b+1), p.a*(p.b-1));
    far.push(p.ans+1, p.ans-1, p.ans+10, p.ans-10, p.a+p.b, p.ans+2);
  } else if(p.op === 'add' || p.op === 'sub'){
    const swap = p.ans>=10 && p.ans%10!==Math.floor(p.ans/10) ? (p.ans%10)*10+Math.floor(p.ans/10) : 0;
    near.push(p.ans+1, p.ans-1, p.ans+10, p.ans-10, p.op==='add' ? p.ans-10 : p.ans+10);
    far.push(p.ans+2, p.ans-2, swap, p.ans+11, p.ans-9);
  } else {
    near.push(p.ans+1, p.ans-1, p.ans+2, p.ans-2);
    far.push(p.b, p.ans+3, p.ans+5, p.a-p.b, p.ans*2, p.ans+10);
  }
  const set = new Set();
  const cap = (p.op==='add'||p.op==='sub') ? 100 : 120;
  for(const v of [...shuffle(near), ...shuffle(far)]){ if(v>0 && v!==p.ans && v<=cap && set.size<4) set.add(v); }
  let k=3; while(set.size<4){ const v = p.ans+k <= cap ? p.ans+k : p.ans-k; k++; if(v>0 && v!==p.ans) set.add(v); }
  return shuffle([p.ans, ...set]);
}
function hintFor(p){
  if(p.op==='mul') return `${p.a} groups of ${p.b}`;
  if(p.op==='div') return `? × ${p.b} = ${p.a}`;
  if(p.op==='add') return (p.a>=10 && p.b>=10) ? `tens ${Math.floor(p.a/10)*10}+${Math.floor(p.b/10)*10}, ones ${p.a%10}+${p.b%10}` : `count on from ${Math.max(p.a,p.b)}`;
  return `? + ${p.b} = ${p.a}`;
}
const sym = op => ({ mul:'×', div:'÷', add:'+', sub:'−' })[op];

  eyes:[ { ref:$('#eyeL'), p:$('#pupilL'), cx:79, cy:74 }, { ref:$('#eyeR'), p:$('#pupilR'), cx:121, cy:74 } ],
  hits:0,
  mood(m){ robotSvg.dataset.mood = m; },
  updateEyes(){
    for(const e of this.eyes){
      const r = e.ref.getBoundingClientRect(); if(!r.width) continue;
      const dx = this.ptr.x-(r.left+r.width/2), dy = this.ptr.y-(r.top+r.height/2), d = Math.hypot(dx,dy)||1;
      const k = Math.min(1, d/140) * 6.5 / d;
      e.p.setAttribute('transform', `translate(${(e.cx+dx*k).toFixed(2)} ${(e.cy+dy*k).toFixed(2)})`);
    }
  },
  blinkLoop(){
    const once = () => { robotSvg.classList.add('blink'); setTimeout(()=>robotSvg.classList.remove('blink'), 130); };
    once(); if(Math.random()<.25) setTimeout(once, 260);
    setTimeout(()=>this.blinkLoop(), 1800 + Math.random()*3200);
  },
  play(cls, ms){ robotAnim.classList.remove(cls); void robotAnim.offsetWidth; robotAnim.classList.add(cls); return wait(ms).then(()=>robotAnim.classList.remove(cls)); },
  say(text, sub, ms=1300){
    bubble.innerHTML = text + (sub ? `<small>${sub}</small>` : '');
    bubble.classList.add('show'); clearTimeout(this._bt);
    this._bt = setTimeout(()=>bubble.classList.remove('show'), ms);
  },
  happy(){
    this.mood('happy'); this.play('jump', 650); this.say(pick(PRAISE));
    clearTimeout(this._mt); this._mt = setTimeout(()=>{ if(robotSvg.dataset.mood==='happy') this.mood('idle'); }, 1100);
  },
  zap(hint, title){
    this.hits++; this.mood('hurt'); robotSvg.classList.add('zapping'); this.play('shake', 500);
    $('#flash').classList.remove('go'); void stage.offsetWidth; $('#flash').classList.add('go');
    $('#soot').setAttribute('opacity', Math.min(1, this.hits*.2).toFixed(2));
    this.puff(2); this.sparks(8);
    this.say(title || pick(OUCH), hint ? 'Hint: ' + hint : '', 2200);
    setTimeout(()=>robotSvg.classList.remove('zapping'), 560);
    clearTimeout(this._mt); this._mt = setTimeout(()=>{ if(robotSvg.dataset.mood==='hurt') this.mood('idle'); }, 900);
  },
  burnout(){
    this.mood('burnt'); robotSvg.classList.add('burnt','zapping'); this.play('shake', 500);
    setTimeout(()=>robotSvg.classList.remove('zapping'), 600);
    this.say('Overheated…', '', 2000);
    for(let i=0;i<5;i++) setTimeout(()=>this.puff(2), i*250); this.sparks(18);
  },
  reset(){
    this.hits = 0; this.mood('idle'); robotSvg.classList.remove('burnt','zapping','shipmode');
    $('#soot').setAttribute('opacity','0');
  },
  puff(n){
    for(let i=0;i<n;i++){
      const p = document.createElement('div'); p.className='puff';
      p.style.left = (20+Math.random()*55)+'%'; p.style.top = (10+Math.random()*40)+'%';
      robotWrap.appendChild(p);
      p.animate([{transform:'scale(.4)',opacity:.9},{transform:`translate(${rnd(-30,30)}px,-120px) scale(1.8)`,opacity:0}],{duration:1400+Math.random()*600,easing:'ease-out'}).onfinish=()=>p.remove();
    }
  },
  sparks(n){
    for(let i=0;i<n;i++){
      const s = document.createElement('div'); s.className='spark';
      s.style.left = (30+Math.random()*40)+'%'; s.style.top = (20+Math.random()*50)+'%';
      robotWrap.appendChild(s); const a = Math.random()*Math.PI*2, d = 40+Math.random()*90;
      s.animate([{transform:'scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:500+Math.random()*400,easing:'ease-out'}).onfinish=()=>s.remove();
    }
  },
  async transformAndFly(){
    this.mood('happy'); Sound.beeps(6); this.say('Transform!', '', 1200);
    await wait(500); robotSvg.classList.add('shipmode'); Sound.transform();
    await wait(900); this.play('fly', 1400); await wait(1400);
    robotAnim.style.opacity = '0';
  },
  async land(){
    robotSvg.classList.add('shipmode'); robotAnim.style.opacity = '1';
    Sound.whoosh(0,.9); await this.play('land', 1100);
    robotSvg.classList.remove('shipmode'); this.mood('happy'); Sound.beeps(4);
    await wait(500); this.mood('idle');
  },
  setPower(lives, max){
    const bar = $('#lifebar');
    if(max){ bar.querySelectorAll('.seg').forEach(x=>x.remove()); for(let i=0;i<max;i++){ const sg=document.createElement('div'); sg.className='seg'+(i>=5?' extra':''); bar.appendChild(sg); } }
    bar.querySelectorAll('.seg').forEach((s,i)=>s.classList.toggle('off', i>=lives));
    bar.classList.toggle('mid', lives<=3 && lives>1); bar.classList.toggle('low', lives<=1);
    const col = lives>3 ? ['#2bb24c','#0d5a22'] : lives>1 ? ['#ffc51a','#8a5a00'] : ['#e8412c','#5a0d0d'];
    $('#coreMid').setAttribute('stop-color', col[0]); $('#coreEdge').setAttribute('stop-color', col[1]);
  },
};
for(let i=0;i<5;i++){ const s=document.createElement('div'); s.className='seg'; $('#lifebar').appendChild(s); }
const track = e => { Robot.ptr.x = e.clientX; Robot.ptr.y = e.clientY; };
addEventListener('pointermove', track, {passive:true});
addEventListener('pointerdown', track, {passive:true});
robotSvg.addEventListener('click', () => { Sound.init(); Sound.beeps(rnd(4,7)); if(!Game.busy && robotSvg.dataset.mood==='idle'){ Robot.mood('happy'); Robot.play('jump',650); setTimeout(()=>robotSvg.dataset.mood==='happy'&&Robot.mood('idle'),800); } });
Robot.blinkLoop();

/* =====================================================================
   SHIPS (original designs, drawn facing right)
   ===================================================================== */
const SHIP_ART = {
  dart:(c1,c2)=>`<svg viewBox="0 0 120 80"><path d="M14 40 L4 32 L4 48 Z" fill="#ffe95a"/><g class="spart"><path d="M40 34 L58 6 L76 30 Z" fill="${c2}" stroke="#141a3a" stroke-width="3" stroke-linejoin="round"/></g><g class="spart"><path d="M40 46 L58 74 L76 50 Z" fill="${c2}" stroke="#141a3a" stroke-width="3" stroke-linejoin="round"/></g><path d="M12 32 L80 28 L116 40 L80 52 L12 48 Z" fill="${c1}" stroke="#141a3a" stroke-width="3" stroke-linejoin="round"/><g class="spart"><ellipse cx="80" cy="40" rx="13" ry="7" fill="#7fe9ff" stroke="#141a3a" stroke-width="2.5"/></g><rect x="24" y="36" width="30" height="8" rx="3" fill="#fff" opacity=".5"/></svg>`,
  saucer:(c1,c2)=>`<svg viewBox="0 0 120 80"><g class="spart"><path d="M38 38 Q60 6 82 38 Z" fill="#7fe9ff" stroke="#141a3a" stroke-width="3"/></g><ellipse cx="60" cy="44" rx="56" ry="14" fill="${c1}" stroke="#141a3a" stroke-width="3"/><ellipse cx="60" cy="40" rx="40" ry="6" fill="#fff" opacity=".35"/><g class="spart"><circle cx="26" cy="46" r="4" fill="${c2}"/><circle cx="48" cy="50" r="4" fill="${c2}"/></g><g class="spart"><circle cx="72" cy="50" r="4" fill="${c2}"/><circle cx="94" cy="46" r="4" fill="${c2}"/></g><path d="M44 58 L60 72 L76 58" fill="#ffe95a" opacity=".6"/></svg>`,
  hauler:(c1,c2)=>`<svg viewBox="0 0 120 80"><path d="M8 32 L0 26 L0 54 L8 48 Z" fill="#ffe95a"/><rect x="8" y="22" width="80" height="36" rx="6" fill="${c1}" stroke="#141a3a" stroke-width="3"/><g class="spart"><rect x="18" y="14" width="14" height="9" rx="3" fill="${c1}" stroke="#141a3a" stroke-width="3"/><rect x="42" y="14" width="14" height="9" rx="3" fill="${c1}" stroke="#141a3a" stroke-width="3"/></g><g class="spart"><rect x="66" y="14" width="14" height="9" rx="3" fill="${c1}" stroke="#141a3a" stroke-width="3"/></g><g class="spart"><path d="M88 24 L114 34 L114 46 L88 56 Z" fill="${c2}" stroke="#141a3a" stroke-width="3" stroke-linejoin="round"/><rect x="96" y="35" width="12" height="10" rx="3" fill="#7fe9ff" stroke="#141a3a" stroke-width="2"/></g><rect x="16" y="32" width="64" height="5" rx="2" fill="#fff" opacity=".4"/><rect x="16" y="44" width="64" height="5" rx="2" fill="#000" opacity=".2"/></svg>`,
  twin:(c1,c2)=>`<svg viewBox="0 0 120 80"><path d="M20 22 L2 18 L2 26 Z M20 58 L2 54 L2 62 Z" fill="#ffe95a"/><rect x="50" y="20" width="14" height="40" rx="4" fill="${c2}" stroke="#141a3a" stroke-width="3"/><g class="spart"><rect x="14" y="12" width="72" height="20" rx="10" fill="${c1}" stroke="#141a3a" stroke-width="3"/></g><g class="spart"><rect x="14" y="48" width="72" height="20" rx="10" fill="${c1}" stroke="#141a3a" stroke-width="3"/></g><circle cx="57" cy="40" r="11" fill="#7fe9ff" stroke="#141a3a" stroke-width="3"/><g class="spart"><path d="M86 22 L108 22 M86 58 L108 58" stroke="#141a3a" stroke-width="4" stroke-linecap="round"/></g></svg>`,
};
const SHIP_COLORS = [['#e8412c','#ffc51a'],['#1f6fe0','#ff8a1f'],['#2bb24c','#ffc51a'],['#8e44d6','#1fb5c9'],['#ff8a1f','#5d6b84'],['#5d6b84','#e8412c']];
const CRATE_COLORS = ['b-red','b-yellow','b-blue','b-green','b-orange','b-teal','b-purple'];

const Ships = {
  els:[],
  W(){ return stage.clientWidth; }, H(){ return stage.clientHeight; },
  make(x, n, kind, from, big){
    const [c1,c2] = pick(SHIP_COLORS);
    const el = document.createElement('div'); el.className = 'ship' + (big?' big':''); el.style.left = (x*100)+'%';
    const art = kind.startsWith('fleet:') ? fleetSVG(kind.slice(6)) : SHIP_ART[kind](c1,c2);
    el.innerHTML = `<div class="ship-bob"><div class="ship-art ${from==='right'?'flip':''}">${art}</div><div class="tether"></div><div class="crate brick ${pick(CRATE_COLORS)}">${n}</div></div>`;
    shipsEl.appendChild(el); el._x = x; el._from = from; return el;
  },
  fly(el, fromDx, fromDy, toDx, toDy, dur, easing){
    return el.animate([{transform:`translate(calc(-50% + ${fromDx}px), ${fromDy}px)`},{transform:`translate(calc(-50% + ${toDx}px), ${toDy}px)`}],{duration:dur,easing,fill:'forwards'}).finished.catch(()=>{});
  },
  async show(p){
    this.clear();
    const W = this.W(), H = this.H();
    const en = Game.level.enemies;
    const kinds = en ? [ 'fleet:'+pick(en), 'fleet:'+pick(en) ] : shuffle(Object.keys(SHIP_ART).filter(k=>k!=='hauler'));
    const a = this.make(.14, p.a, en ? kinds[0] : (p.op==='div' && p.a>=20 ? 'hauler' : kinds[0]), 'left', p.op==='div');
    const b = this.make(.48, p.b, kinds[1], 'right');
    const op = document.createElement('div'); op.className='op'; op.style.left='31%'; op.textContent = sym(p.op); shipsEl.appendChild(op);
    const eq = document.createElement('div'); eq.className='eq'; eq.style.left='69%'; eq.textContent='= ?'; shipsEl.appendChild(eq);
    this.els = [a,b,op,eq]; this.eq = eq; this.b = b;
    a.style.visibility = b.style.visibility = 'hidden'; op.style.opacity = eq.style.opacity = 0;
    Sound.whoosh(0,.8);
    a.style.visibility='visible';
    const pa = this.fly(a, -(.14*W + 260), -H*.15, 0, 0, 1000, 'cubic-bezier(.15,.8,.25,1)');
    await wait(280); b.style.visibility='visible'; Sound.whoosh(0,.7);
    const pb = this.fly(b, (.52*W + 260), -H*.1, 0, 0, 1000, 'cubic-bezier(.15,.8,.25,1)');
    await wait(500);
    op.style.opacity=1; op.animate([{transform:`translate(-50%,${-H*.3}px) rotate(-180deg)`},{transform:'translate(-50%,0)'}],{duration:600,easing:'cubic-bezier(.3,1.5,.5,1)'});
    Sound.tone(500,0,.15,'sine',.1,900);
    await Promise.all([pa,pb]);
    eq.style.opacity=1; eq.animate([{opacity:0,transform:'translate(-50%,0) scale(.3)'},{opacity:1,transform:'translate(-50%,0) scale(1)'}],{duration:350,easing:'cubic-bezier(.3,1.5,.5,1)'});
    await wait(250);
  },
  async blast(){
    const hits = [];
    for(const ship of this.els.slice(0,2).filter(Boolean)){
      const parts = [...ship.querySelectorAll('.spart')];
      if(!parts.length){ const art = ship.querySelector('.ship-art'); hits.push({ el:art, onHit:()=>this.wreck(ship, art) }); continue; }
      const part = pick(parts); hits.push({ el:part, onHit:()=>this.damage(ship, part, parts) });
    }
    await Hero.attack(hits);
  },
  wreck(ship, art){
    const pt = stagePoint(art.getBoundingClientRect(), .55, .45), bob = ship.querySelector('.ship-bob');
    const fire = document.createElement('div'); fire.className = 'hitfire'; fire.style.left = '55%'; fire.style.top = '35%'; bob.appendChild(fire);
    ship.classList.add('hit','damaged','wreck'); Sound.boom(); stageSparks(pt, 14);
    for(let i=0;i<4;i++){ const d=document.createElement('div'); d.className='debris'; d.style.left=pt.x+'px'; d.style.top=pt.y+'px'; stage.appendChild(d);
      d.animate([{transform:'none',opacity:1},{transform:`translate(${rnd(-60,60)}px,${rnd(90,180)}px) rotate(${rnd(-400,400)}deg)`,opacity:0}],{duration:1100+Math.random()*400,easing:'ease-in'}).onfinish=()=>d.remove(); }
    setTimeout(()=>ship.classList.remove('hit'), 420);
  },
  damage(ship, part, parts){
    const target = stagePoint(part.getBoundingClientRect());
    const bob = ship.querySelector('.ship-bob'), br = bob.getBoundingClientRect(), pr = part.getBoundingClientRect();
    const fire = document.createElement('div'); fire.className = 'hitfire';
    fire.style.left = ((pr.left+pr.width/2-br.left)/br.width*100)+'%'; fire.style.top = ((pr.top+pr.height/2-br.top)/br.height*100)+'%';
    bob.appendChild(fire);
    part.style.setProperty('--fx', rnd(-40,40)+'px'); part.style.setProperty('--fr', rnd(-300,300)+'deg');
    part.classList.add('fall'); parts.filter(p=>p!==part).forEach(p=>p.classList.add('burnt'));
    ship.classList.add('hit','damaged'); Sound.boom(); stageSparks(target, 12);
    setTimeout(()=>ship.classList.remove('hit'), 420);
  },
  solved(ans){ if(this.eq){ this.eq.textContent = '= ' + ans; this.eq.classList.add('solved'); } },
  async leave(){
    const W = this.W(), H = this.H(); const [a,b,op,eq] = this.els; if(!a) return;
    Sound.whoosh(0,.6);
    op.animate([{opacity:1},{opacity:0,transform:'translate(-50%,-40px) scale(.4)'}],{duration:300,fill:'forwards'});
    eq.animate([{opacity:1},{opacity:0}],{duration:400,delay:200,fill:'forwards'});
    this.fly(a, 0,0, -(.14*W+300), -H*.35, 700, 'cubic-bezier(.6,0,.9,.5)');
    await this.fly(b, 0,0, (.52*W+300), -H*.35, 700, 'cubic-bezier(.6,0,.9,.5)');
    this.clear();
  },
  shoot(){
    if(!this.b) return Promise.resolve();
    const sr = stage.getBoundingClientRect(), br = this.b.querySelector('.crate').getBoundingClientRect(), rr = robotWrap.getBoundingClientRect();
    const bolt = document.createElement('div'); bolt.className='bolt'; stage.appendChild(bolt);
    const x0 = br.left+br.width/2-sr.left, y0 = br.bottom-sr.top, x1 = rr.left+rr.width/2-sr.left, y1 = rr.top+rr.height*.35-sr.top;
    Sound.tone(1400,0,.2,'square',.06,200);
    return bolt.animate([{transform:`translate(${x0}px,${y0}px)`},{transform:`translate(${x1}px,${y1}px)`}],{duration:220,easing:'ease-in'}).finished.then(()=>bolt.remove()).catch(()=>bolt.remove());
  },
  clear(){ shipsEl.innerHTML=''; this.els=[]; this.eq=null; this.b=null; },
};

/* =====================================================================
   BOSS — each right answer burns one part, each miss repairs one
   ===================================================================== */
function stagePoint(rect, fx=.5, fy=.5){ const sr = stage.getBoundingClientRect(); return { x: rect.left+rect.width*fx-sr.left, y: rect.top+rect.height*fy-sr.top }; }
function fireBolt(a, b, cls='', dur=240){
  const bolt = document.createElement('div'); bolt.className = 'bolt ' + cls; stage.appendChild(bolt);
  return bolt.animate([{transform:`translate(${a.x}px,${a.y}px)`},{transform:`translate(${b.x}px,${b.y}px)`}],{duration:dur,easing:'ease-in'}).finished.catch(()=>{}).then(()=>bolt.remove());
}
function stageSparks(pt, n, color){
  for(let i=0;i<n;i++){
    const s = document.createElement('div'); s.className='spark'; s.style.left = pt.x+'px'; s.style.top = pt.y+'px'; s.style.zIndex = 5;
    if(color) s.style.boxShadow = `0 0 8px 3px ${color}`;
    stage.appendChild(s); const a = Math.random()*Math.PI*2, d = 30+Math.random()*80;
    s.animate([{transform:'scale(1.2)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:500+Math.random()*500,easing:'ease-out'}).onfinish=()=>s.remove();
  }
}
const Hero = {
  el: $('#hero'), dir: 1, run: Promise.resolve(),
  async attack(hits){
    await this.run;
    const W = stage.clientWidth, H = stage.clientHeight, d = this.dir; this.dir = -d;
    this.el.hidden = false; const w = this.el.offsetWidth;
    this.el.querySelector('.hero-art').classList.toggle('flip', d < 0);
    const y = H * (stage.classList.contains('bosslvl') ? .42 : .34);
    const x0 = d > 0 ? -w-10 : W+10, x1 = d > 0 ? W+10 : -w-10;
    const xm = W/2 - w/2;
    const IN = .65, PRE = .15, SHOT = .2, GAP = .28, POST = .08, OUT = .6;
    Sound.flyby(IN, IN+PRE+hits.length*(SHOT+GAP)+POST, OUT); Sound.quack();
    const inA = this.el.animate([{transform:`translate(${x0}px,${y-H*.06}px) rotate(${d*6}deg)`},{transform:`translate(${xm}px,${y}px) rotate(0deg)`}],{duration:IN*1000,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
    await inA.finished.catch(()=>{});
    this.el.classList.add('hover');
    await wait(PRE*1000);
    const sorted = hits.map(h => ({ ...h, x: stagePoint(h.el.getBoundingClientRect()).x })).sort((a,b) => d*(a.x-b.x));
    for(const h of sorted){
      const q = $('#quack'); q.textContent = pick(['PEW!','QUACK!','PEW PEW!']); q.classList.add('show'); setTimeout(()=>q.classList.remove('show'), 400);
      Sound.pew();
      await fireBolt(stagePoint(this.el.getBoundingClientRect(), .55, .4), stagePoint(h.el.getBoundingClientRect()), 'duck', SHOT*1000);
      h.onHit();
      await wait(GAP*1000);
    }
    await wait(POST*1000);
    this.el.classList.remove('hover');
    const outA = this.el.animate([{transform:`translate(${xm}px,${y}px) rotate(0deg)`},{transform:`translate(${x1}px,${y-H*.08}px) rotate(${-d*8}deg)`}],{duration:OUT*1000,easing:'cubic-bezier(.6,0,.9,.6)',fill:'forwards'});
    inA.cancel();
    this.run = outA.finished.catch(()=>{}).then(()=>{ this.el.hidden = true; });
  },
};

const Boss = {
  el: $('#boss'), q: $('#bossQ'), parts: [],
  kind:'scraptor',
  reset(on, kind='scraptor', minions=[]){
    this.el.hidden = !on; this.q.hidden = !on; this.el.className = 'boss'; this.q.textContent = ''; this.q.classList.remove('solved');
    this.kind = kind; this.svg = null;
    this.el.querySelectorAll('svg[data-kind]').forEach(sv => { const show = sv.dataset.kind === kind; sv.toggleAttribute('hidden', !show); if(show) this.svg = sv; });
    this.parts = [...this.svg.querySelectorAll('.bpart')]; this.parts.forEach(p=>p.classList.remove('burnt','fixed'));
    const mEl = $('#minions'); mEl.innerHTML = '';
    if(on){
      const spots = [['left:1%;top:4cqh',0],['left:2%;top:22cqh',0],['right:1%;top:21cqh',1],['right:3%;top:37cqh',1]];
      minions.slice(0,4).forEach((id,i)=>{ const d=document.createElement('div'); d.className='mn'+(spots[i][1]?' flip':''); d.style.cssText=spots[i][0]; d.innerHTML=fleetSVG(id); mEl.appendChild(d); });
    }
  },
  burntCount(){ return this.parts.filter(p=>p.classList.contains('burnt')).length; },
  allDown(){ return this.burntCount() === this.parts.length; },
  async enter(){ this.el.classList.add('enter'); Sound.rumble(); await wait(1300); this.el.classList.remove('enter'); },
  async ask(p){
    this.q.classList.remove('solved'); this.q.textContent = `${p.a} ${sym(p.op)} ${p.b} = ?`;
    this.q.animate([{transform:'translateX(-50%) scale(.4)',opacity:0},{transform:'translateX(-50%) scale(1)',opacity:1}],{duration:350,easing:'cubic-bezier(.3,1.5,.5,1)'});
    await wait(380);
  },
  solved(ans){ this.q.textContent = this.q.textContent.replace('?', ans); this.q.classList.add('solved'); },
  async takeHit(n=1){
    const intact = this.parts.filter(p=>!p.classList.contains('burnt')); if(!intact.length) return;
    const targets = intact.sort(()=>Math.random()-.5).slice(0, n);
    await Hero.attack(targets.map(part => ({ el:part, onHit:()=>{
      part.classList.add('burnt'); Sound.boom(); stageSparks(stagePoint(part.getBoundingClientRect()), 14);
      this.el.classList.remove('shake'); void this.el.offsetWidth; this.el.classList.add('shake');
      setTimeout(()=>this.el.classList.remove('shake'), 460);
    }})));
  },
  shoot(){
    Sound.tone(300,0,.25,'sawtooth',.08,900);
    const mins = [...document.querySelectorAll('#minions .mn')];
    const [ex,ey] = (this.svg.dataset.eye||'.5,.47').split(',').map(Number);
    const from = (mins.length && Math.random()<.5) ? stagePoint(pick(mins).getBoundingClientRect(), .5, .5) : stagePoint(this.el.getBoundingClientRect(), ex, ey);
    return fireBolt(from, stagePoint(robotWrap.getBoundingClientRect(), .5, .35), '', 260);
  },
  repair(){
    const burnt = this.parts.filter(p=>p.classList.contains('burnt')); if(!burnt.length) return;
    const part = pick(burnt); part.classList.remove('burnt'); part.classList.add('fixed');
    setTimeout(()=>part.classList.remove('fixed'), 700);
    setTimeout(()=>Sound.repair(), 300); stageSparks(stagePoint(part.getBoundingClientRect()), 10, '#5dff8a');
  },
  async explode(){
    const r = this.el.getBoundingClientRect();
    this.el.classList.add('dead');

/* Enemy raids (Mission 2): an enemy flies in during a problem. Tap it before it acts, or it makes mischief. */
const RAIDS = {
  crab:  { act:'time',   wait:2600, msg:'Pinchy Crab pinched 4 seconds!' },
  squid: { act:'sign',   wait:2600, msg:'Squid Jammer inked the sign!' },
  shark: { act:'digits', wait:2600, msg:'Shark Byte bit the digits!' },
  spike: { act:'boom',   wait:3800, msg:'Spikey Mine exploded!' },
};
const RAID_CHANCE = .45;
const Raid = {
  el:null, timer:null, id:null,
  maybe(){
    const L = Game.level, en = (L.enemies||[]).filter(e=>RAIDS[e]);
    if(!Game.mission.raids || !en.length || (Game.idx===0 && !L.boss) || Math.random() > RAID_CHANCE) return;
    const s = Game.serial, t = Game.run;
    setTimeout(()=>{ if(s===Game.serial && t===Game.run && !Game.busy && !this.el) this.launch(pick(en), s, t); }, rnd(900,2600));
  },
  launch(id, s, t){
    const f = fleetById(id), cfg = RAIDS[id], W = stage.clientWidth, H = stage.clientHeight, fromLeft = Math.random()<.5;
    const el = document.createElement('button'); el.className = 'raider ' + (fromLeft?'left':'right') + (cfg.act==='boom'?' boomer':'');
    el.setAttribute('aria-label', `Stop ${f.name}`); el.innerHTML = fleetSVG(id) + '<span class="tap">TAP!</span>';
    stage.appendChild(el); this.el = el; this.id = id;
    const w = el.offsetWidth, x = W/2 - w/2 + (fromLeft?-1:1)*W*.14, y = H*.34;
    this.pos = { x, y, w };
    el.animate([{transform:`translate(${fromLeft?-w-10:W+10}px,${y-H*.12}px)`},{transform:`translate(${x}px,${y}px)`}],{duration:1000,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
    Sound.tone(660,0,.12,'square',.05); Sound.tone(520,.14,.12,'square',.05); Sound.flyby(.9,1,.4);
    el.addEventListener('pointerdown', e => { e.preventDefault(); this.defeat(); });
    el.addEventListener('click', e => e.preventDefault());
    setTimeout(()=>{ if(this.el===el){ el.classList.add('warn'); if(cfg.act==='boom') setTimeout(()=>this.el===el && el.classList.add('fast'), cfg.wait*.6); } }, 1000);
    this.timer = setTimeout(()=>this.act(s, t), 1000 + cfg.wait);
  },
  center(){ return this.el ? stagePoint(this.el.getBoundingClientRect()) : { x:0, y:0 }; },
  defeat(){
    if(!this.el) return; clearTimeout(this.timer);
    const pt = this.center(), f = fleetById(this.id), el = this.el; this.el = null;
    Sound.boom(); Sound.correct(); stageSparks(pt, 20, '#5dff8a');
    el.getAnimations().forEach(a=>a.cancel());
    el.style.transform = `translate(${this.pos.x}px,${this.pos.y}px)`;
    el.animate([{opacity:1,transform:`translate(${this.pos.x}px,${this.pos.y}px) scale(1)`},{opacity:0,transform:`translate(${this.pos.x}px,${this.pos.y+80}px) scale(.3) rotate(300deg)`}],{duration:600,fill:'forwards'}).onfinish=()=>el.remove();
    Robot.say('Got it!', `${f.name} stopped`, 1400);
  },
  retreat(){
    if(!this.el) return; clearTimeout(this.timer); const el = this.el; this.el = null;
    el.classList.remove('warn','fast'); el.querySelector('.tap')?.remove();
    el.getAnimations().forEach(a=>a.cancel());
    el.animate([{transform:`translate(${this.pos.x}px,${this.pos.y}px)`},{transform:`translate(${this.pos.x}px,${-this.pos.w*1.5}px)`}],{duration:700,easing:'ease-in',fill:'forwards'}).onfinish=()=>el.remove();
  },
  clear(){ clearTimeout(this.timer); if(this.el){ this.el.remove(); this.el = null; } },
  floatText(txt, pt){
    const d = document.createElement('div'); d.className='floattxt'; d.textContent = txt; d.style.left = pt.x+'px'; d.style.top = pt.y+'px'; stage.appendChild(d);
    d.animate([{transform:'translate(-50%,0) scale(.6)',opacity:1},{transform:'translate(-50%,-60px) scale(1.2)',opacity:0}],{duration:1300,easing:'ease-out'}).onfinish=()=>d.remove();
  },
  act(s, t){
    if(!this.el) return;
    if(t !== Game.run || s !== Game.serial){ this.clear(); return; }
    if(Game.busy){ this.timer = setTimeout(()=>this.act(s,t), 300); return; }
    const cfg = RAIDS[this.id], p = Game.cur;
    let act = cfg.act, np = null;
    if(act === 'sign'){
      if(p.op==='add' && p.a!==p.b) np = { op:'sub', a:Math.max(p.a,p.b), b:Math.min(p.a,p.b), ans:Math.abs(p.a-p.b) };
      else if(p.op==='sub' && p.a+p.b<=100) np = { op:'add', a:p.a, b:p.b, ans:p.a+p.b };
      if(!np) act = 'time';
    }
    if(act === 'digits'){
      const sw = n => (n>=10 && n<100 && n%10!==Math.floor(n/10)) ? (n%10)*10+Math.floor(n/10) : null;
      const opts = [];
      const A = sw(p.a), B = sw(p.b);
      const mk = (a,b) => p.op==='add' ? (a+b<=100 ? { op:'add', a, b, ans:a+b } : null) : (a-b>=1 ? { op:'sub', a, b, ans:a-b } : null);
      if(A!==null){ const q = mk(A,p.b); if(q) opts.push(q); }
      if(B!==null){ const q = mk(p.a,B); if(q) opts.push(q); }
      np = opts.length ? pick(opts) : null; if(!np) act = 'time';
    }
    const pt = this.center();
    if(act === 'time'){
      Timer.left = Math.max(1, Timer.left - 4); Timer.paint();
      Sound.tone(900,0,.05,'square',.07); Sound.tone(700,.08,.05,'square',.07); Sound.tone(900,.16,.05,'square',.07);
      this.floatText('−4s', stagePoint($('#timer').getBoundingClientRect(), .5, 1.1));
      Robot.say('Hey!', RAIDS.crab.msg, 1800); this.retreat();
    } else if(act === 'sign' || act === 'digits'){
      if(act==='sign'){ const ink = document.createElement('div'); ink.className='ink'; const tgt = Game.level.boss ? Boss.q : Ships.els[2]; if(tgt){ const q = stagePoint(tgt.getBoundingClientRect()); ink.style.left = (q.x-40)+'px'; ink.style.top = (q.y-40)+'px'; } stage.appendChild(ink);
        ink.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(1.2)',opacity:.9,offset:.3},{transform:'scale(1.4)',opacity:0}],{duration:1400}).onfinish=()=>ink.remove(); Sound.noise(0,.4,.15,600,200); }
      else { Sound.tone(200,0,.08,'sawtooth',.1); Sound.tone(160,.1,.08,'sawtooth',.1); }
      Game.applyProblem(np);
      Robot.say('Uh-oh!', cfg.msg, 2000); this.retreat();
    } else if(act === 'boom'){
      const el = this.el; this.el = null; el.remove();
      Sound.boom(); stageSparks(pt, 26); $('#flash').classList.remove('go'); void stage.offsetWidth; $('#flash').classList.add('go');
      Game.cur = null; Timer.stop(true);
      if(Game.hurt('Boom!')) { Robot.say('Boom!', cfg.msg + ' New problem.', 2000); Game.replace(); }
    }
  },
};

const Helpers = {
  used:new Set(),

    if(this.used.has(id) || Game.busy || !Game.cur || !overlay.hidden) return;
    this.used.add(id); btn.classList.add('used'); Sound.init();
    const f = document.createElement('div'); f.className='hfly'; f.innerHTML = fleetSVG(id); stage.appendChild(f);

    f.animate([{transform:`translate(${br.x-40}px,${br.y-40}px) scale(.4)`,opacity:.6},{transform:`translate(${W*.42}px,${H*.32}px) scale(1.2)`,opacity:1,offset:.45},{transform:`translate(${W*.42}px,${H*.3}px) scale(1.2)`,opacity:1,offset:.75},{transform:`translate(${W+60}px,${H*.05}px) scale(.6)`,opacity:0}],{duration:1500,easing:'ease-in-out'}).onfinish=()=>f.remove();

    if(id === 'owl'){
      Sound.correct(); const right = btns.find(b=>+b.dataset.v===p.ans); if(right) right.classList.add('hinted');
      Robot.say('Hoo-hoo!', `Owl Scope sees ${p.ans}`, 1800);
    } else if(id === 'firefly'){

        const tens = Math.random()<.5, d = tens ? Math.floor(p.ans/10)%10 : p.ans%10, s = String(p.ans);
        const shown = tens ? s.slice(0,-1).replace(/\d$/, String(d)) + '?' : s.slice(0,-1).replace(/\d/g,'?') + d;
        if(eq) eq.textContent = eq.textContent.replace(/= .*$/, '= ' + shown);
        btns.forEach(b => { const v=+b.dataset.v; const vd = tens ? Math.floor(v/10)%10 : v%10; if(v!==p.ans && (vd!==d || String(v).length!==s.length)) b.classList.add('dim'); });
        Robot.say('Glow!', `One digit is ${d}`, 1800);
      } else {
        btns.filter(b=>+b.dataset.v!==p.ans).slice(0,2).forEach(b=>b.classList.add('dim'));
        Robot.say('Glow!', 'Two wrong answers gone', 1800);
      }
    } else if(id === 'penguin'){
      Game.skip();
    }
  },
};
