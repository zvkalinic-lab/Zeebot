<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e2c">
<meta name="description" content="Zeebot's Star Math: a space math game for kids. Multiply, divide and beat the boss.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zeebot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}</style>
<title>Zeebot's Star Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one full-screen space stage (ships up top, robot hero center-bottom), HUD strip above, five toy-brick answers below. Menus are overlays on top of the live stage. */
:root{
  --space:#0a0e2c; --space-2:#1b1f63; --nebula:#5a2a8c;
  --red:#e8412c; --yellow:#ffc51a; --blue:#1f6fe0; --green:#2bb24c; --orange:#ff8a1f; --teal:#1fb5c9; --purple:#8e44d6;
  --ink:#141a3a; --text:#f4f7ff; --muted:#aab4e8; --panel:#1c2260; --panel-edge:#30399a;
  --display:"Bungee","Arial Black",Impact,system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--space);color:var(--text);font-family:var(--body);font-weight:800;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;position:relative}

/* ---------- toy brick ---------- */
.brick{--c:var(--red);--t:#fff;position:relative;background:var(--c);color:var(--t);border-radius:10px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.35);
  font-family:var(--display);transition:transform .12s, filter .12s}
.brick::before,.brick::after{content:"";position:absolute;top:-7px;width:22%;max-width:34px;height:9px;border-radius:5px 5px 2px 2px;
  background:var(--c);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.15)}
.brick::before{left:16%}.brick::after{right:16%}
button.brick:hover{filter:brightness(1.08)}
button.brick:active{transform:translateY(3px)}
.b-red{--c:var(--red)}.b-yellow{--c:var(--yellow);--t:var(--ink)}.b-blue{--c:var(--blue)}.b-green{--c:var(--green)}.b-orange{--c:var(--orange);--t:var(--ink)}.b-teal{--c:var(--teal);--t:var(--ink)}.b-purple{--c:var(--purple)}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px)) 8px;position:relative;z-index:5;
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud .lvl{flex:1;min-width:0;text-align:center}
.hud .lvl b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(14px,2.4vw,20px);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;justify-content:center;gap:5px;margin-top:5px}
.pip{width:clamp(10px,2vw,18px);height:9px;border-radius:3px;background:#2a3078}
.pip.on{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.hud-btn{padding:8px 12px;font-size:13px;min-width:44px;min-height:40px}
.hud-btn::before,.hud-btn::after{top:-5px;height:6px}

/* ---------- stage ---------- */
.stage{position:relative;overflow:hidden;container-type:size;min-height:0}
#stars{position:absolute;inset:0;width:100%;height:100%;display:block}
.planet{position:absolute;right:-6cqmin;bottom:8cqh;width:26cqmin;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#ffb36b,#e8412c 55%,#6a1450);opacity:.55}
.planet::after{content:"";position:absolute;left:-30%;right:-30%;top:44%;height:14%;border-radius:50%;border:3px solid rgba(255,197,26,.55);transform:rotate(-14deg)}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.flash.go{animation:flash .45s}
@keyframes flash{0%,40%{opacity:.5;background:#bff}20%,60%{opacity:0}50%{opacity:.35;background:#fff}100%{opacity:0}}

/* ships */
.ship{position:absolute;top:5cqh;width:var(--sz);--sz:min(17cqw,23cqh);transform:translate(-50%,0);will-change:transform}
.ship.big{--sz:min(21cqw,27cqh)}
.ship-bob{animation:bob 2.4s ease-in-out infinite}
.ship:nth-child(odd) .ship-bob{animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-5%)}}
.ship-art svg{width:100%;height:auto;display:block;overflow:visible}
.ship-art.flip svg{transform:scaleX(-1)}
.tether{width:3px;height:3cqh;margin:-4% auto 0;background:repeating-linear-gradient(#cfd8ff 0 4px,transparent 4px 7px)}
.crate{margin:0 auto;width:78%;aspect-ratio:1.25;display:grid;place-items:center;font-size:min(8.5cqw,11cqh);line-height:1}
.crate::before,.crate::after{top:-6px;height:7px}
.op{position:absolute;top:13cqh;width:min(9cqw,13cqh);aspect-ratio:1;transform:translate(-50%,0);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#9fb0ff 40%,#3a46b8);box-shadow:0 0 0 4px #141a3a,0 0 22px #7f8cff;
  display:grid;place-items:center;font-family:var(--display);font-size:min(6.5cqw,9cqh);color:var(--ink)}
.op::after{content:"";position:absolute;left:50%;top:100%;width:40%;height:12%;transform:translateX(-50%);background:var(--yellow);border-radius:0 0 50% 50%;box-shadow:0 0 10px var(--yellow)}
.eq{position:absolute;top:10cqh;transform:translate(-50%,0);padding:1.2cqh 2.2cqw;border-radius:14px;border:3px dashed #7fe9ff;
  background:rgba(31,181,201,.14);color:#bff6ff;font-family:var(--display);font-size:min(7.5cqw,10cqh);white-space:nowrap;
  text-shadow:0 0 12px #3fe3ff;box-shadow:0 0 24px rgba(63,227,255,.25)}
.eq.solved{border-style:solid;border-color:var(--green);color:#d8ffd9;background:rgba(43,178,76,.25);text-shadow:0 0 12px #2bb24c}
.timer{position:absolute;top:3cqh;right:2.5cqw;width:min(12cqw,15cqh);aspect-ratio:1;z-index:4;transition:opacity .3s,transform .3s}
.timer.off{opacity:.25}
.timer svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.timer .tb{fill:rgba(10,14,44,.7);stroke:#2a3078;stroke-width:9}
.timer .tr{fill:none;stroke:var(--green);stroke-width:9;stroke-linecap:round;stroke-dasharray:264;transition:stroke .3s}
.timer.mid .tr{stroke:var(--yellow)}.timer.low .tr{stroke:var(--red)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:min(5.5cqw,7cqh);color:#fff}
.timer.low b{color:#ff8a7a;animation:tpulse .5s infinite alternate}
@keyframes tpulse{to{transform:scale(1.15)}}
.ship-bob{position:relative}
.ship .spart{transform-box:fill-box;transform-origin:center}
.ship .spart.burnt{filter:brightness(.35) saturate(.3)}
.ship .spart.fall{animation:partfall 1.1s ease-in forwards}
@keyframes partfall{to{transform:translate(var(--fx,10px),140px) rotate(var(--fr,220deg));opacity:0}}
.ship.hit .ship-art{animation:bshake .4s}
.ship.damaged .ship-bob{animation:limp .5s ease-in-out infinite}
@keyframes limp{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(4%)}}
.hitfire{position:absolute;width:26%;aspect-ratio:.7;margin:0;transform:translate(-50%,-80%);border-radius:50% 50% 40% 40%;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 78%,#fff6a0 0 14%,#ffc51a 30%,#ff5a1f 52%,rgba(232,65,44,0) 70%);animation:flame .11s infinite alternate}
@keyframes flame{to{transform:translate(-50%,-80%) scale(1.12,.82)}}
.hero{position:absolute;left:0;top:0;width:min(34cqw,29cqh);z-index:6;pointer-events:none}
.hero-art svg{width:100%;height:auto;display:block;overflow:visible}
.hero-art.flip svg{transform:scaleX(-1)}
.hero.hover .hero-art{animation:bob 1s ease-in-out infinite}
.hero .duck-led{animation:tip .8s steps(1) infinite}
.hero .duck-flame{animation:flick .1s infinite alternate;transform-box:fill-box;transform-origin:100% 50%}
.hero .quack{position:absolute;left:50%;top:-30%;transform:translateX(-50%) scale(.5);font-family:var(--display);font-size:min(3.4cqw,4.2cqh);color:var(--ink);
  background:var(--yellow);padding:.15em .5em;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.35);opacity:0;transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
.hero .quack.show{opacity:1;transform:translateX(-50%) scale(1)}
.bolt.duck{width:3.4cqmin;height:3.4cqmin;background:#fff6a0;box-shadow:0 0 0 3px #ff7ae0,0 0 16px 6px #ffc51a}
.boss{position:absolute;left:50%;top:2cqh;width:min(68cqw,64cqh);transform:translateX(-50%);z-index:2}
.boss-in{animation:bob 3s ease-in-out infinite}
.boss svg{width:100%;height:auto;display:block;overflow:visible}
.boss .bfire{display:none}
.boss .bpart.burnt .bfire{display:inline}
.boss .bpart.burnt .bs{filter:brightness(.28) saturate(.2)}
.boss .bpart.fixed .bs{animation:fixglow .7s}
@keyframes fixglow{30%{filter:brightness(2) drop-shadow(0 0 8px #5dff8a)}}
.boss .bfire ellipse{animation:flick .1s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.boss .beye{animation:eyepulse 1s infinite alternate}
@keyframes eyepulse{from{fill:#ff1f1f}to{fill:#ff9a8a}}
.boss.shake .boss-in{animation:bshake .45s}
@keyframes bshake{20%{transform:translate(-3%,1%) rotate(-3deg)}40%{transform:translate(3%,-1%) rotate(3deg)}60%{transform:translate(-2%,0) rotate(-1deg)}80%{transform:translate(1%,0)}}
.boss.enter{animation:bossenter 1.3s cubic-bezier(.2,.8,.3,1)}
@keyframes bossenter{from{transform:translate(-50%,-120%) scale(.6)}}
.boss.dead{animation:bossdie 1.3s forwards}
@keyframes bossdie{0%,60%{transform:translateX(-50%)}10%{transform:translate(-52%,1%)}20%{transform:translate(-48%,-1%)}30%{transform:translate(-52%,0)}40%{transform:translate(-48%,1%)}100%{transform:translate(-50%,-10%) scale(1.4);opacity:0;filter:brightness(4)}}
.bossq{position:absolute;left:50%;top:37cqh;transform:translateX(-50%);padding:1cqh 2.4cqw;border-radius:14px;border:3px dashed #ff8a8a;
  background:rgba(232,65,44,.16);color:#ffe0dc;font-family:var(--display);font-size:min(7cqw,8cqh);white-space:nowrap;text-shadow:0 0 12px #ff4a3a;z-index:3}
.bossq.solved{border-style:solid;border-color:var(--green);color:#d8ffd9;background:rgba(43,178,76,.25);text-shadow:0 0 12px #2bb24c}
.bosslvl .planet{display:none}
.bosslvl .robot-wrap{height:40cqh}
.bolt.good{background:#fff;box-shadow:0 0 10px 4px #3fe3ff,0 0 30px 10px #1f6fe0}
.bolt{position:absolute;width:3cqmin;height:3cqmin;border-radius:50%;background:#fff;box-shadow:0 0 10px 4px #ff3b3b,0 0 30px 10px #ff8a1f;pointer-events:none;z-index:4}

/* robot */
.robot-wrap{position:absolute;left:50%;bottom:10cqh;height:47cqh;aspect-ratio:200/270;transform:translateX(-50%);z-index:3}
.robot-anim{width:100%;height:100%;transform-origin:50% 100%}
#robot{width:100%;height:100%;display:block;overflow:visible;cursor:pointer;transition:filter .4s}
.robot-anim.jump{animation:jump .65s cubic-bezier(.3,.7,.4,1)}
@keyframes jump{0%{transform:none}15%{transform:scale(1.08,.9)}45%{transform:translateY(-18%) scale(.95,1.06)}75%{transform:scale(1.07,.93)}100%{transform:none}}
.robot-anim.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-5%) rotate(-4deg)}30%{transform:translateX(5%) rotate(4deg)}45%{transform:translateX(-4%) rotate(-3deg)}60%{transform:translateX(3%) rotate(2deg)}80%{transform:translateX(-1%)}}
.robot-anim.fly{animation:fly 1.4s cubic-bezier(.55,0,.85,.35) forwards}
@keyframes fly{0%{transform:none}25%{transform:translateY(6%) rotate(-6deg)}100%{transform:translate(70cqw,-140cqh) rotate(38deg) scale(.7)}}
.robot-anim.land{animation:land 1.1s cubic-bezier(.2,.8,.3,1)}
@keyframes land{0%{transform:translate(-40cqw,-140cqh) rotate(-30deg) scale(.7)}70%{transform:translateY(4%) scale(1.04,.95)}100%{transform:none}}

#robot .rb-eye{transform-box:fill-box;transform-origin:center;transition:transform .07s}
#robot.blink .rb-eye{transform:scaleY(.08)}
#robot .rb-arm-l{transform-origin:52px 132px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#robot .rb-arm-r{transform-origin:148px 132px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#robot[data-mood=happy] .rb-arm-l{transform:rotate(118deg)}
#robot[data-mood=happy] .rb-arm-r{transform:rotate(-118deg)}
#robot[data-mood=hurt] .rb-arm-l{animation:flail .12s 5 alternate}
#robot[data-mood=hurt] .rb-arm-r{animation:flail .12s 5 alternate-reverse}
@keyframes flail{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
#robot[data-mood=burnt] .rb-arm-l{transform:rotate(-12deg)}
#robot[data-mood=burnt] .rb-arm-r{transform:rotate(12deg)}
#robot .mouth,#robot .cheek,#robot .xeyes{display:none}
#robot[data-mood=idle] .m-idle,#robot[data-mood=happy] .m-happy,#robot[data-mood=happy] .cheek,#robot[data-mood=hurt] .m-hurt,#robot[data-mood=burnt] .m-hurt,#robot[data-mood=burnt] .xeyes{display:inline}
#robot[data-mood=burnt] .pupil{display:none}
#robot .ant-tip{animation:tip 1.1s steps(1) infinite}
#robot .ant-tip.r{animation-delay:-.55s}
@keyframes tip{0%{fill:#ff3b3b}50%{fill:#ffe95a}}
#robot .rb-zap{opacity:0;pointer-events:none}
#robot.zapping{filter:drop-shadow(0 0 10px #6ff) brightness(1.35)}
#robot.zapping .rb-zap{animation:zapflick .55s steps(1)}
@keyframes zapflick{0%,30%,60%{opacity:1}15%,45%,80%,100%{opacity:0}}
#robot.burnt{filter:grayscale(.75) brightness(.5) sepia(.3)}
#robot .rb-legs{transform-origin:100px 204px;transition:transform .35s}
#robot.shipmode .rb-legs{transform:scaleY(0)}
#robot .rb-wings{transform-origin:100px 165px;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.5,.5,1) .15s}
#robot.shipmode .rb-wings{transform:scale(1)}
#robot .rb-flame{transform-origin:100px 206px;transform:scaleY(0);transition:transform .3s .35s}
#robot.shipmode .rb-flame{transform:scaleY(1)}
#robot .rb-flame ellipse{animation:flick .09s infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes flick{to{transform:scaleY(.82)}}
#robot.shipmode .rb-arm-l{transform:rotate(-28deg)}
#robot.shipmode .rb-arm-r{transform:rotate(28deg)}
#robot .rb-soot{transition:opacity .4s}

.bubble{position:absolute;left:72%;top:-4%;background:#fff;color:var(--ink);font-family:var(--display);font-size:min(3.6cqw,4.6cqh);
  padding:.5em .8em;border-radius:16px 16px 16px 4px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.3);
  opacity:0;transform:scale(.6) translateY(10px);transform-origin:0 100%;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:6}
.bubble.show{opacity:1;transform:none}
.bubble small{display:block;font-family:var(--body);font-weight:900;font-size:.62em;color:#4a52a0;margin-top:2px}
.puff{position:absolute;width:18%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#9aa0b8 0,#5a6078 55%,transparent 70%);pointer-events:none}
.spark{position:absolute;width:2.2cqmin;height:2.2cqmin;border-radius:50%;background:#fff6a0;box-shadow:0 0 8px 3px #ffcc33;pointer-events:none}

.copilot{position:absolute;left:calc(50% - 31cqh);bottom:32cqh;width:15cqh;z-index:2;animation:bob 2s ease-in-out infinite;pointer-events:none}
.copilot svg{width:100%;height:auto;display:block}
.copilot.cheer{animation:cheer .7s}
@keyframes cheer{50%{transform:translateY(-30%) rotate(360deg)}}

.lifebar{position:absolute;left:50%;bottom:2.5cqh;transform:translateX(-50%);display:flex;align-items:center;gap:min(1.2cqw,8px);z-index:3}
.lifebar .lbl{font-family:var(--display);font-size:min(2.6cqw,3.4cqh);color:var(--muted);margin-right:4px}
.seg{width:min(7cqw,9cqh);height:min(3cqw,4.2cqh);border-radius:5px;background:var(--green);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 10px rgba(43,178,76,.6);transition:background .3s,box-shadow .3s}
.lifebar.mid .seg{background:var(--yellow);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 10px rgba(255,197,26,.6)}
.lifebar.low .seg{background:var(--red);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 12px rgba(232,65,44,.8)}
.seg.off{background:#2a2f5a!important;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)!important}
.seg.hit{animation:seghit .5s}
@keyframes seghit{30%{transform:scale(1.4);background:#fff}}

/* answers */
.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(8px,1.6vw,18px);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-width:900px;width:100%;margin:0 auto;position:relative;z-index:5}
.ans{font-size:clamp(22px,5vw,44px);padding:clamp(10px,2vh,20px) 0;min-height:56px;font-variant-numeric:tabular-nums}
.ans:disabled{cursor:default}
.answers.wait .ans{opacity:.35;transform:translateY(6px)}
.ans.burnt{--c:#3a2a2a!important;--t:#8a6a5a!important;filter:none;text-decoration:line-through}
.ans.right{animation:pop .5s;box-shadow:0 0 0 4px #fff,0 0 30px var(--c)}
@keyframes pop{40%{transform:scale(1.18)}}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;overflow:auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 30%,rgba(27,31,99,.86),rgba(10,14,44,.95))}
.overlay.clear{background:rgba(10,14,44,.55)}
.panel{margin:auto;width:min(760px,100%);display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;animation:panelIn .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(24px) scale(.95)}}
.logo{font-family:var(--display);font-weight:400;line-height:.95;margin:0;font-size:clamp(40px,9vw,92px);text-wrap:balance;
  color:var(--yellow);text-shadow:0 5px 0 var(--red),0 10px 0 #7a1630,0 14px 30px rgba(0,0,0,.6)}
.logo span{display:block;color:#fff;font-size:.45em;text-shadow:0 3px 0 var(--blue),0 6px 0 #10307a;letter-spacing:.04em}
.sub{color:var(--muted);font-size:clamp(15px,2.2vw,19px);max-width:52ch;margin:0;line-height:1.45}
.h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,4.6vw,40px);margin:0;color:#fff;text-shadow:0 4px 0 var(--blue);text-wrap:balance}
.big-btn{font-size:clamp(18px,3vw,26px);padding:16px 34px}
.row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}

/* map */
.mission-tag{font-family:var(--display);color:var(--orange);font-size:14px;letter-spacing:.12em}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:16px 12px;width:100%}
@media (max-width:560px){.levels{grid-template-columns:repeat(3,1fr)}}
.lv{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 10px;min-height:118px}
.lv .n{font-size:30px;line-height:1}
.lv .nm{font-family:var(--body);font-weight:900;font-size:12px;line-height:1.15;opacity:.9}
.lv .opl{font-family:var(--body);font-weight:900;font-size:11px;background:rgba(0,0,0,.22);border-radius:6px;padding:2px 6px}
.lv .st{font-size:14px;letter-spacing:1px;min-height:18px}
.lv.locked{--c:#2a3070!important;--t:#7880c0!important;cursor:not-allowed}
.lv.locked .n{font-size:22px}
.coming{width:100%;border:3px dashed #3a4290;border-radius:14px;padding:12px;color:#7880c0;font-size:14px}

/* cards */
.card{--r1:#3a7bff;--r2:#1a3a9a;width:220px;max-width:100%;border-radius:18px;padding:10px;position:relative;
  background:linear-gradient(160deg,var(--r1),var(--r2));box-shadow:0 0 0 4px #fff,0 10px 30px rgba(0,0,0,.5);color:#fff;text-align:left;
  transform-style:preserve-3d;transition:transform .15s}
.card.rare{--r1:#b45cff;--r2:#4a1a8c}
.card.legendary{--r1:#ffd34a;--r2:#e8412c;box-shadow:0 0 0 4px #fff6c0,0 0 40px rgba(255,197,26,.7),0 10px 30px rgba(0,0,0,.5)}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.card .cn{font-family:var(--display);font-size:17px;line-height:1.05}
.card .rar{font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.25);padding:2px 6px;border-radius:6px;white-space:nowrap}
.card .art{margin:8px 0;border-radius:12px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.35),rgba(0,0,0,.25));aspect-ratio:1.2;display:grid;place-items:center;overflow:hidden}
.card .art svg{width:78%;height:auto}
.card .role{font-size:12px;opacity:.9;margin-bottom:6px}
.stat{display:grid;grid-template-columns:62px 1fr 20px;align-items:center;gap:6px;font-size:11px;margin:3px 0;font-variant-numeric:tabular-nums}
.stat .bar{height:8px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:4px}
.stat.s1 i{background:#ff6a4a}.stat.s2 i{background:#5dff8a}.stat.s3 i{background:#5ad8ff}
.card .sp{margin-top:7px;font-size:11px;background:rgba(0,0,0,.22);border-radius:8px;padding:5px 7px;line-height:1.3}
.card.locked{--r1:#2a3070;--r2:#1a1f50;box-shadow:0 0 0 3px #3a4290;color:#7880c0}
.card.locked .art{background:repeating-linear-gradient(45deg,#232a68 0 10px,#1e245c 10px 20px)}
.card.locked .art b{font-family:var(--display);font-size:54px;color:#3a4290}
.card .copi{position:absolute;top:-10px;right:-8px;background:var(--yellow);color:var(--ink);font-size:10px;font-family:var(--display);padding:3px 7px;border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;width:100%;justify-items:center}
.cards .card{width:100%;cursor:pointer}
.cards .card .cn{font-size:14px}
.cards .card .stat{grid-template-columns:52px 1fr 18px;font-size:10px}
.big-card{width:min(300px,82vw);touch-action:none}
.big-card .cn{font-size:22px}
.big-card .role{font-size:14px}.big-card .stat{font-size:13px;grid-template-columns:72px 1fr 22px}.big-card .stat .bar{height:11px}.big-card .sp{font-size:13px}

/* gift */
.gift{width:170px;height:170px;position:relative;cursor:pointer;animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:none}70%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-3deg)}}
.gift .box{position:absolute;left:10%;right:10%;bottom:0;height:62%;border-radius:12px;background:var(--blue);box-shadow:inset 0 -8px 0 rgba(0,0,0,.25)}
.gift .lid{position:absolute;left:4%;right:4%;top:18%;height:22%;border-radius:10px;background:var(--blue);filter:brightness(1.15);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.gift .rib{position:absolute;left:44%;width:12%;top:18%;bottom:0;background:var(--yellow)}
.gift .bow{position:absolute;left:50%;top:4%;width:44%;height:20%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 25% 60%,var(--yellow) 0 38%,transparent 40%),radial-gradient(ellipse at 75% 60%,var(--yellow) 0 38%,transparent 40%)}
.gift.open{animation:none}
.gift.open .lid,.gift.open .bow{transform:translateY(-90px) rotate(-25deg);opacity:0;transition:transform .5s,opacity .5s}
.reveal{animation:reveal .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes reveal{from{transform:translateY(60px) scale(.2) rotateY(540deg);opacity:0}}
.stars-row{font-size:clamp(40px,8vw,64px);letter-spacing:8px;line-height:1}
.stars-row i{font-style:normal;display:inline-block;color:#3a4290;animation:starIn .5s cubic-bezier(.3,1.6,.5,1) backwards}
.stars-row i.on{color:var(--yellow);text-shadow:0 0 18px var(--yellow)}
.stars-row i:nth-child(2){animation-delay:.2s}.stars-row i:nth-child(3){animation-delay:.4s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.muted{color:var(--muted);font-size:14px}

@media (prefers-reduced-motion:reduce){
  .ship-bob,.copilot,.gift{animation:none}
}
</style>

const Sound = {
  ctx:null, master:null,
  init(){
    try{
      if(!this.ctx){ const AC = window.AudioContext||window.webkitAudioContext; this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = .7; this.master.connect(this.ctx.destination); }
      if(this.ctx.state === 'suspended') this.ctx.resume();
    }catch(e){ this.ctx = null; }
  },
  get ok(){ return this.ctx && Save.d.sound; },
  tone(f, at, dur, type='sine', vol=.2, to){
    if(!this.ok) return; const c=this.ctx, t=c.currentTime+at;
    const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(to, t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+.05);
  },
  noise(at, dur, vol=.2, f1=800, f2){
    if(!this.ok) return; const c=this.ctx, t=c.currentTime+at;
    const len = Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const s=c.createBufferSource(); s.buffer=buf; const fl=c.createBiquadFilter(); fl.type='bandpass'; fl.Q.value=1.2;
    fl.frequency.setValueAtTime(f1,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur);
  },
  beeps(n=5, at=0){ let t=at; for(let i=0;i<n;i++){ const f=700+Math.random()*1500, d=.045+Math.random()*.09; this.tone(f,t,d,'sine',.13, Math.random()<.5? f*(.55+Math.random()*1.1):undefined); t+=d+.025; } },
  correct(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,i*.075,.2,'triangle',.22)); this.tone(2093,.32,.35,'sine',.08); this.beeps(3,.5); },
  zap(){ this.tone(110,0,.4,'sawtooth',.16,55); this.tone(1800,0,.25,'square',.04,300); this.noise(0,.45,.28,3000,400); for(let i=0;i<5;i++) this.tone(2000+Math.random()*2000,i*.07,.02,'square',.06); },
  burnout(){ this.tone(440,0,1.4,'sawtooth',.16,40); this.noise(0,1.2,.3,1500,100); this.tone(880,.1,.3,'square',.05,200); },
  whoosh(at=0,dur=.6){ this.noise(at,dur,.22,300,3000); },
  transform(){ [392,523,659,784,988,1175].forEach((f,i)=>this.tone(f,i*.07,.12,'square',.07)); this.whoosh(.4,1.1); this.tone(150,.4,1.1,'sawtooth',.08,900); },
  fanfare(){ [[523,0],[659,.14],[784,.28],[1047,.46],[784,.66],[1047,.8]].forEach(([f,t])=>this.tone(f,t,.28,'triangle',.22)); this.tone(1568,.8,.6,'sine',.1); },
  quack(){ this.tone(520,0,.09,'square',.045,340); this.tone(470,.1,.12,'square',.045,300); },
  /* soft gliding engine hum for the Duck Wing: rises on arrival, hums while hovering, slides up as it leaves */
  flyby(inDur, outAt, outDur){
    if(!this.ok) return; const c=this.ctx, t=c.currentTime, end=t+outAt+outDur;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(500,t); lp.frequency.linearRampToValueAtTime(1100,t+inDur); lp.frequency.linearRampToValueAtTime(1600,end); lp.Q.value=4;
    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.06,t+inDur*.6); g.gain.setValueAtTime(.06,t+outAt); g.gain.exponentialRampToValueAtTime(.0001,end);
    lp.connect(g); g.connect(this.master);
    const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=5.5; lg.gain.value=4; lfo.connect(lg);

      o.frequency.setValueAtTime(270*base,t+outAt); o.frequency.exponentialRampToValueAtTime(520*base,end);
      lg.connect(o.frequency); o.connect(lp); o.start(t); o.stop(end+.05);
    });
    lfo.start(t); lfo.stop(end+.05);
    this.noise(0,inDur,.03,400,2200); this.noise(outAt,outDur,.03,1200,4000);
  },

const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));

const shuffle = arr => { for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };

function makeProblems(level){
  const ops = level.op === 'mix' ? ['mul','div'] : [level.op];
  const pool = [];
  for(const t of level.tables) for(let k=1;k<=10;k++) for(const op of ops){
    if(op === 'mul') pool.push({ op, a:t, b:k, ans:t*k });
    else pool.push({ op, a:t*k, b:t, ans:k });
  }
  shuffle(pool);
  return pool.slice(0, level.count).map(p => (p.op==='mul' && Math.random()<.5) ? { ...p, a:p.b, b:p.a } : p);
}
function makeChoices(p){
  const near = [], far = [];
  if(p.op === 'mul'){
    near.push((p.a+1)*p.b, (p.a-1)*p.b, p.a*(p.b+1), p.a*(p.b-1));
    far.push(p.ans+1, p.ans-1, p.ans+10, p.ans-10, p.a+p.b, p.ans+2);
  } else {
    near.push(p.ans+1, p.ans-1, p.ans+2, p.ans-2);
    far.push(p.b, p.ans+3, p.ans+5, p.a-p.b, p.ans*2, p.ans+10);
  }
  const set = new Set();
  for(const v of [...shuffle(near), ...shuffle(far)]){ if(v>0 && v!==p.ans && v<=120 && set.size<4) set.add(v); }
  let k=3; while(set.size<4){ const v=p.ans+k++; if(v!==p.ans) set.add(v); }
  return shuffle([p.ans, ...set]);
}
function hintFor(p){ return p.op==='mul' ? `${p.a} groups of ${p.b}` : `? × ${p.b} = ${p.a}`; }

      e.p.setAttribute('transform', `translate(${(e.cx+dx*k).toFixed(2)} ${(e.cy+dy*k).toFixed(2)})`);

  blinkLoop(){

    $('#coreMid').setAttribute('stop-color', col[0]); $('#coreEdge').setAttribute('stop-color', col[1]);
  },
};
for(let i=0;i<5;i++){ const s=document.createElement('div'); s.className='seg'; $('#lifebar').appendChild(s); }

const SHIP_COLORS = [['#e8412c','#ffc51a'],['#1f6fe0','#ff8a1f'],['#2bb24c','#ffc51a'],['#8e44d6','#1fb5c9'],['#ff8a1f','#5d6b84'],['#5d6b84','#e8412c']];
const CRATE_COLORS = ['b-red','b-yellow','b-blue','b-green','b-orange','b-teal','b-purple'];

const Ships = {
  els:[],
  W(){ return stage.clientWidth; }, H(){ return stage.clientHeight; },
  make(x, n, kind, from, big){
    const [c1,c2] = pick(SHIP_COLORS);
    const el = document.createElement('div'); el.className = 'ship' + (big?' big':''); el.style.left = (x*100)+'%';
    el.innerHTML = `<div class="ship-bob"><div class="ship-art ${from==='right'?'flip':''}">${SHIP_ART[kind](c1,c2)}</div><div class="tether"></div><div class="crate brick ${pick(CRATE_COLORS)}">${n}</div></div>`;
    shipsEl.appendChild(el); el._x = x; el._from = from; return el;
  },
  fly(el, fromDx, fromDy, toDx, toDy, dur, easing){
    return el.animate([{transform:`translate(calc(-50% + ${fromDx}px), ${fromDy}px)`},{transform:`translate(calc(-50% + ${toDx}px), ${toDy}px)`}],{duration:dur,easing,fill:'forwards'}).finished.catch(()=>{});
  },
  async show(p){
    this.clear();
    const W = this.W(), H = this.H();
    const kinds = shuffle(Object.keys(SHIP_ART).filter(k=>k!=='hauler'));
    const a = this.make(.14, p.a, p.op==='div' && p.a>=20 ? 'hauler' : kinds[0], 'left', p.op==='div');
    const b = this.make(.48, p.b, kinds[1], 'right');
    const op = document.createElement('div'); op.className='op'; op.style.left='31%'; op.textContent = sym(p.op); shipsEl.appendChild(op);
    const eq = document.createElement('div'); eq.className='eq'; eq.style.left='69%'; eq.textContent='= ?'; shipsEl.appendChild(eq);
    this.els = [a,b,op,eq]; this.eq = eq; this.b = b;
    a.style.visibility = b.style.visibility = 'hidden'; op.style.opacity = eq.style.opacity = 0;
    Sound.whoosh(0,.8);
    a.style.visibility='visible';
    const pa = this.fly(a, -(.14*W + 260), -H*.15, 0, 0, 1000, 'cubic-bezier(.15,.8,.25,1)');
    await wait(280); b.style.visibility='visible'; Sound.whoosh(0,.7);
    const pb = this.fly(b, (.52*W + 260), -H*.1, 0, 0, 1000, 'cubic-bezier(.15,.8,.25,1)');
    await wait(500);
    op.style.opacity=1; op.animate([{transform:`translate(-50%,${-H*.3}px) rotate(-180deg)`},{transform:'translate(-50%,0)'}],{duration:600,easing:'cubic-bezier(.3,1.5,.5,1)'});
    Sound.tone(500,0,.15,'sine',.1,900);
    await Promise.all([pa,pb]);
    eq.style.opacity=1; eq.animate([{opacity:0,transform:'translate(-50%,0) scale(.3)'},{opacity:1,transform:'translate(-50%,0) scale(1)'}],{duration:350,easing:'cubic-bezier(.3,1.5,.5,1)'});
    await wait(250);
  },
  async blast(){
    const hits = [];
    for(const ship of this.els.slice(0,2).filter(Boolean)){
      const parts = [...ship.querySelectorAll('.spart')]; if(!parts.length) continue;
      const part = pick(parts); hits.push({ el:part, onHit:()=>this.damage(ship, part, parts) });
    }
    await Hero.attack(hits);
  },
  damage(ship, part, parts){
    const target = stagePoint(part.getBoundingClientRect());
    const bob = ship.querySelector('.ship-bob'), br = bob.getBoundingClientRect(), pr = part.getBoundingClientRect();
    const fire = document.createElement('div'); fire.className = 'hitfire';
    fire.style.left = ((pr.left+pr.width/2-br.left)/br.width*100)+'%'; fire.style.top = ((pr.top+pr.height/2-br.top)/br.height*100)+'%';
    bob.appendChild(fire);
    part.style.setProperty('--fx', rnd(-40,40)+'px'); part.style.setProperty('--fr', rnd(-300,300)+'deg');
    part.classList.add('fall'); parts.filter(p=>p!==part).forEach(p=>p.classList.add('burnt'));
    ship.classList.add('hit','damaged'); Sound.boom(); stageSparks(target, 12);
    setTimeout(()=>ship.classList.remove('hit'), 420);
  },
  solved(ans){ if(this.eq){ this.eq.textContent = '= ' + ans; this.eq.classList.add('solved'); } },
  async leave(){
    const W = this.W(), H = this.H(); const [a,b,op,eq] = this.els; if(!a) return;
    Sound.whoosh(0,.6);
    op.animate([{opacity:1},{opacity:0,transform:'translate(-50%,-40px) scale(.4)'}],{duration:300,fill:'forwards'});
    eq.animate([{opacity:1},{opacity:0}],{duration:400,delay:200,fill:'forwards'});
    this.fly(a, 0,0, -(.14*W+300), -H*.35, 700, 'cubic-bezier(.6,0,.9,.5)');
    await this.fly(b, 0,0, (.52*W+300), -H*.35, 700, 'cubic-bezier(.6,0,.9,.5)');
    this.clear();
  },
  shoot(){
    if(!this.b) return Promise.resolve();
    const sr = stage.getBoundingClientRect(), br = this.b.querySelector('.crate').getBoundingClientRect(), rr = robotWrap.getBoundingClientRect();
    const bolt = document.createElement('div'); bolt.className='bolt'; stage.appendChild(bolt);
    const x0 = br.left+br.width/2-sr.left, y0 = br.bottom-sr.top, x1 = rr.left+rr.width/2-sr.left, y1 = rr.top+rr.height*.35-sr.top;
    Sound.tone(1400,0,.2,'square',.06,200);
    return bolt.animate([{transform:`translate(${x0}px,${y0}px)`},{transform:`translate(${x1}px,${y1}px)`}],{duration:220,easing:'ease-in'}).finished.then(()=>bolt.remove()).catch(()=>bolt.remove());
  },
  clear(){ shipsEl.innerHTML=''; this.els=[]; this.eq=null; this.b=null; },
};

/* =====================================================================
   BOSS — each right answer burns one part, each miss repairs one
   ===================================================================== */
function stagePoint(rect, fx=.5, fy=.5){ const sr = stage.getBoundingClientRect(); return { x: rect.left+rect.width*fx-sr.left, y: rect.top+rect.height*fy-sr.top }; }
function fireBolt(a, b, cls='', dur=240){
  const bolt = document.createElement('div'); bolt.className = 'bolt ' + cls; stage.appendChild(bolt);
  return bolt.animate([{transform:`translate(${a.x}px,${a.y}px)`},{transform:`translate(${b.x}px,${b.y}px)`}],{duration:dur,easing:'ease-in'}).finished.catch(()=>{}).then(()=>bolt.remove());
}
function stageSparks(pt, n, color){
  for(let i=0;i<n;i++){
    const s = document.createElement('div'); s.className='spark'; s.style.left = pt.x+'px'; s.style.top = pt.y+'px'; s.style.zIndex = 5;
    if(color) s.style.boxShadow = `0 0 8px 3px ${color}`;
    stage.appendChild(s); const a = Math.random()*Math.PI*2, d = 30+Math.random()*80;
    s.animate([{transform:'scale(1.2)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:500+Math.random()*500,easing:'ease-out'}).onfinish=()=>s.remove();
  }
}
const Hero = {
  el: $('#hero'), dir: 1, run: Promise.resolve(),
  async attack(hits){
    await this.run;
    const W = stage.clientWidth, H = stage.clientHeight, d = this.dir; this.dir = -d;
    this.el.hidden = false; const w = this.el.offsetWidth;
    this.el.querySelector('.hero-art').classList.toggle('flip', d < 0);
    const y = H * (stage.classList.contains('bosslvl') ? .42 : .34);
    const x0 = d > 0 ? -w-10 : W+10, x1 = d > 0 ? W+10 : -w-10;
    const xm = W/2 - w/2;
    const IN = .65, PRE = .15, SHOT = .2, GAP = .28, POST = .08, OUT = .6;
    Sound.flyby(IN, IN+PRE+hits.length*(SHOT+GAP)+POST, OUT); Sound.quack();
    const inA = this.el.animate([{transform:`translate(${x0}px,${y-H*.06}px) rotate(${d*6}deg)`},{transform:`translate(${xm}px,${y}px) rotate(0deg)`}],{duration:IN*1000,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
    await inA.finished.catch(()=>{});
    this.el.classList.add('hover');
    await wait(PRE*1000);
    const sorted = hits.map(h => ({ ...h, x: stagePoint(h.el.getBoundingClientRect()).x })).sort((a,b) => d*(a.x-b.x));
    for(const h of sorted){
      const q = $('#quack'); q.textContent = pick(['PEW!','QUACK!','PEW PEW!']); q.classList.add('show'); setTimeout(()=>q.classList.remove('show'), 400);
      Sound.pew();
      await fireBolt(stagePoint(this.el.getBoundingClientRect(), .55, .4), stagePoint(h.el.getBoundingClientRect()), 'duck', SHOT*1000);
      h.onHit();
      await wait(GAP*1000);
    }
    await wait(POST*1000);
    this.el.classList.remove('hover');
    const outA = this.el.animate([{transform:`translate(${xm}px,${y}px) rotate(0deg)`},{transform:`translate(${x1}px,${y-H*.08}px) rotate(${-d*8}deg)`}],{duration:OUT*1000,easing:'cubic-bezier(.6,0,.9,.6)',fill:'forwards'});
    inA.cancel();
    this.run = outA.finished.catch(()=>{}).then(()=>{ this.el.hidden = true; });
  },
};

const Boss = {
  el: $('#boss'), q: $('#bossQ'), parts: [],
  reset(on){
    this.el.hidden = !on; this.q.hidden = !on; this.el.className = 'boss'; this.q.textContent = ''; this.q.classList.remove('solved');
    this.parts = [...this.el.querySelectorAll('.bpart')]; this.parts.forEach(p=>p.classList.remove('burnt','fixed'));
  },
  burntCount(){ return this.parts.filter(p=>p.classList.contains('burnt')).length; },
  allDown(){ return this.burntCount() === this.parts.length; },
  async enter(){ this.el.classList.add('enter'); Sound.rumble(); await wait(1300); this.el.classList.remove('enter'); },
  async ask(p){
    this.q.classList.remove('solved'); this.q.textContent = `${p.a} ${sym(p.op)} ${p.b} = ?`;
    this.q.animate([{transform:'translateX(-50%) scale(.4)',opacity:0},{transform:'translateX(-50%) scale(1)',opacity:1}],{duration:350,easing:'cubic-bezier(.3,1.5,.5,1)'});
    await wait(380);
  },
  solved(ans){ this.q.textContent = this.q.textContent.replace('?', ans); this.q.classList.add('solved'); },
  async takeHit(){
    const intact = this.parts.filter(p=>!p.classList.contains('burnt')); if(!intact.length) return;
    const part = pick(intact);
    await Hero.attack([{ el:part, onHit:()=>{
      part.classList.add('burnt'); Sound.boom(); stageSparks(stagePoint(part.getBoundingClientRect()), 14);
      this.el.classList.remove('shake'); void this.el.offsetWidth; this.el.classList.add('shake');
      setTimeout(()=>this.el.classList.remove('shake'), 460);
    }}]);
  },
  shoot(){
    Sound.tone(300,0,.25,'sawtooth',.08,900);
    return fireBolt(stagePoint(this.el.getBoundingClientRect(), .5, .47), stagePoint(robotWrap.getBoundingClientRect(), .5, .35), '', 260);
  },
  repair(){
    const burnt = this.parts.filter(p=>p.classList.contains('burnt')); if(!burnt.length) return;
    const part = pick(burnt); part.classList.remove('burnt'); part.classList.add('fixed');
    setTimeout(()=>part.classList.remove('fixed'), 700);
    setTimeout(()=>Sound.repair(), 300); stageSparks(stagePoint(part.getBoundingClientRect()), 10, '#5dff8a');
  },
  async explode(){
    const r = this.el.getBoundingClientRect();
    this.el.classList.add('dead');
    for(let i=0;i<6;i++) setTimeout(()=>{ Sound.boom(); stageSparks(stagePoint(r, .15+Math.random()*.7, .2+Math.random()*.6), 16); }, i*200);
    setTimeout(()=>{ $('#flash').classList.remove('go'); void stage.offsetWidth; $('#flash').classList.add('go'); }, 1000);
    await wait(1400); this.el.hidden = true; this.q.hidden = true;
  },
};

/* =====================================================================
   TIMER — each problem must be answered in time, or it counts as a miss
   ===================================================================== */
const TIME_LIMIT = 8;
const Timer = {
  id:null, left:TIME_LIMIT, lastSec:null, onOut:null,
  paint(){
    const el=$('#timer'), frac=Math.max(0,this.left/TIME_LIMIT), sec=Math.ceil(this.left);
    $('#timerRing').style.strokeDashoffset = (264*(1-frac)).toFixed(1);
    $('#timerNum').textContent = sec;
    el.classList.toggle('mid', sec<=5 && sec>3); el.classList.toggle('low', sec<=3);
  },
  start(onOut){
    this.stop(); this.left = TIME_LIMIT; this.lastSec = TIME_LIMIT; this.onOut = onOut;
    $('#timer').classList.remove('off'); this.paint();
    let prev = performance.now();
    this.id = setInterval(()=>{
      const now = performance.now(); this.left -= (now-prev)/1000; prev = now;
      const sec = Math.ceil(this.left);
      if(sec !== this.lastSec){ this.lastSec = sec; if(sec<=3 && sec>0) Sound.tone(sec===1?1100:880,0,.06,'square',.05); }
      this.paint();
      if(this.left <= 0){ this.stop(true); this.onOut && this.onOut(); }
    }, 100);
  },
  stop(keepShown){ clearInterval(this.id); this.id=null; if(!keepShown) $('#timer').classList.add('off'); },
  reset(){ this.stop(); this.left = TIME_LIMIT; this.paint(); },
};

/* =====================================================================
   GAME FLOW
   ===================================================================== */
const Game = {
  run:0, mission: MISSIONS[0], li:0, probs:[], idx:0, lives:5, busy:true, hitsThisLevel:0,
  get level(){ return this.mission.levels[this.li]; },
  hud(){
    const L = this.level;
    $('#hudTitle').textContent = `Level ${this.li+1} · ${L.name}`;
    const n = L.boss ? Boss.parts.length : this.probs.length, done = L.boss ? Boss.burntCount() : this.idx;
    $('#pips').innerHTML = Array.from({length:n},(_,i)=>`<span class="pip ${i<done?'on':''}"></span>`).join('');
  },
  async start(li, { landing=false }={}){
    const t = ++this.run;
    overlay.hidden = true; this.li = li; this.probs = makeProblems(this.level); this.idx = 0; this.lives = 5; this.hitsThisLevel = 0;
    Robot.reset(); Robot.setPower(5); robotAnim.style.opacity='1'; Ships.clear(); Timer.reset(); const boss = !!this.level.boss; stage.classList.toggle('bosslvl', boss); Boss.reset(boss); this.hud(); this.setAnswers(null);
    this.busy = true;
    if(landing) await Robot.land();
    if(t !== this.run) return;
    if(boss){ await Boss.enter(); if(t !== this.run) return; Robot.say('Boss fight!', 'Right answers call the Duck Wing', 1800); await wait(900); }
    else Robot.say(`Level ${li+1}!`, this.level.op==='mul'?'Multiply ×':this.level.op==='div'?'Divide ÷':'Mixed × and ÷', 1500);
    await wait(700);
    if(t !== this.run) return;
    this.next();
  },
  async next(){
    const t = this.run, p = this.probs[this.idx]; this.cur = p; this.busy = true;
    this.setAnswers(null);
    if(this.level.boss) await Boss.ask(p); else await Ships.show(p);
    if(this.cur !== p || t !== this.run) return;
    this.setAnswers(makeChoices(p)); this.busy = false;
    this.armTimer();
  },
  armTimer(){ const p = this.cur; Timer.start(()=>{ if(this.cur===p && !this.busy) this.miss(null); }); },
  setAnswers(choices){
    const colors = ['b-red','b-yellow','b-blue','b-green','b-orange'];
    if(!choices){ answersEl.classList.add('wait'); answersEl.querySelectorAll('.ans').forEach(b=>b.disabled=true); if(answersEl.children.length) return; choices=['?','?','?','?','?']; }
    else answersEl.classList.remove('wait');
    answersEl.innerHTML = choices.map((v,i)=>`<button class="brick ans ${colors[i]}" data-v="${v}" ${typeof v!=='number'?'disabled':''} aria-label="Answer ${v}">${v}</button>`).join('');
  },
  async answer(btn){
    if(this.busy || btn.disabled) return;
    const v = +btn.dataset.v, p = this.cur, t = this.run, live = () => t === this.run;
    if(v === p.ans){
      Timer.stop(true); this.busy = true; btn.classList.add('right'); answersEl.querySelectorAll('.ans').forEach(b=>b.disabled=true);
      Sound.correct(); Robot.happy(); this.cheerCopilot(); this.idx++;
      if(this.level.boss){
        Boss.solved(p.ans); await Boss.takeHit(); if(!live()) return; this.hud();
        if(Boss.allDown()){ await wait(300); await Boss.explode(); return live() && this.complete(); }
        await wait(700); return live() && this.next();
      }
      Ships.solved(p.ans); this.hud();
      await wait(250); await Ships.blast(); await wait(650); if(!live()) return; await Ships.leave(); if(!live()) return;
      if(this.idx >= this.probs.length) return this.complete();
      this.next();
    } else {
      btn.disabled = true; btn.classList.add('burnt');
      this.miss(btn);
    }
  },
  async miss(btn){
      const p = this.cur, t = this.run;
      Timer.stop(true); this.busy = true;
      if(this.level.boss){ await Boss.shoot(); if(t !== this.run) return; Boss.repair(); this.hud(); } else await Ships.shoot();
      if(t !== this.run) return;
      Sound.zap(); this.lives--; this.hitsThisLevel++;
      const segs = $('#lifebar').querySelectorAll('.seg'); const s = segs[this.lives]; if(s){ s.classList.add('hit'); setTimeout(()=>s.classList.remove('hit'),500); }
      Robot.setPower(this.lives);
      if(this.lives <= 0) return this.burnout();
      Robot.zap(hintFor(p), btn ? null : 'Too slow!');
      await wait(450);
      if(this.cur !== p) return;
      this.busy = false; this.armTimer();
  },
  cheerCopilot(){ const el=$('#copilot'); if(el.hidden) return; el.classList.remove('cheer'); void el.offsetWidth; el.classList.add('cheer'); },
  async burnout(){
    Sound.burnout(); Robot.burnout(); answersEl.querySelectorAll('.ans').forEach(b=>b.disabled=true);
    const t = this.run; await wait(1900); if(t !== this.run) return;
    showOverlay(`<div class="panel"><h2 class="h2">Zeebot overheated!</h2>
      <p class="sub">Five zaps drained the power cells. A quick recharge and you can try Level ${this.li+1} again.</p>
      <div class="row"><button class="brick b-green big-btn" id="oRetry">RECHARGE & RETRY</button><button class="brick b-blue big-btn" id="oMap">MAP</button></div></div>`, 'clear');
    $('#oRetry').onclick = () => { Sound.init(); Sound.beeps(5); this.start(this.li); };
    $('#oMap').onclick = () => { Robot.reset(); showMap(); };
  },
  async complete(){
    Timer.reset(); this.setAnswers(null); const t = this.run;
    await Robot.transformAndFly(); if(t !== this.run) return;
    Sound.fanfare();
    const stars = this.hitsThisLevel===0 ? 3 : this.hitsThisLevel<=2 ? 2 : 1;
    const ms = Save.mission(this.mission.id);
    ms.stars[this.li] = Math.max(ms.stars[this.li]||0, stars);
    ms.unlocked = Math.max(ms.unlocked, Math.min(this.mission.levels.length, this.li+2));
    if(this.li === this.mission.levels.length-1) ms.done = true;
    Save.write();
    const cardId = this.level.card, card = CREW.find(c=>c.id===cardId);
    const isNew = card && !Save.hasCrew(cardId);
    const last = this.li === this.mission.levels.length-1;
    const msg = stars===3 ? 'Perfect flight, no zaps at all!' : stars===2 ? 'Great flying! Only a couple of zaps.' : 'You made it through the storm!';
    showOverlay(`<div class="panel"><h2 class="h2">Level ${this.li+1} complete!</h2>
      <div class="stars-row">${[1,2,3].map(i=>`<i class="${i<=stars?'on':''}">★</i>`).join('')}</div>
      <p class="sub">${msg}${last ? ` <b>You finished ${this.mission.name}: ${this.mission.title}!</b>` : ''}</p>
      <div id="giftZone">${isNew ? `<button class="gift" id="gift" aria-label="Open your gift"><div class="box"></div><div class="rib"></div><div class="lid"></div><div class="bow"></div></button><p class="muted">A gift card arrived! Tap to open.</p>` : ''}</div>
      <div class="row" id="doneBtns" ${isNew?'hidden':''}>${!last?`<button class="brick b-green big-btn" id="oNext">NEXT LEVEL ▸</button>`:''}<button class="brick b-blue big-btn" id="oMap">MAP</button></div></div>`);
    if(isNew){
      $('#gift').onclick = async () => {
        const g = $('#gift'); if(g.classList.contains('open')) return; g.classList.add('open'); Sound.pop();
        Save.addCrew(cardId); if(!Save.d.copilot){ Save.d.copilot = cardId; Save.write(); renderCopilot(); }
        await wait(450);
        $('#giftZone').innerHTML = `<p class="mission-tag">NEW CREW MEMBER!</p><div class="reveal" style="display:flex;justify-content:center">${cardHTML(card,{big:true})}</div>`;
        Sound.fanfare(); tiltable($('#giftZone .card'));
        $('#doneBtns').hidden = false;
      };
    }
    const nb = $('#oNext'); if(nb) nb.onclick = () => { Sound.init(); this.start(this.li+1, { landing:true }); };
    $('#oMap').onclick = () => { showMap(); };
  },
};
answersEl.addEventListener('click', e => { const b = e.target.closest('.ans'); if(b) Game.answer(b); });
addEventListener('keydown', e => { if(overlay.hidden && /^[1-5]$/.test(e.key)){ const b = answersEl.children[+e.key-1]; if(b) Game.answer(b); } });

/* =====================================================================
   SCREENS
   ===================================================================== */
function showOverlay(html, cls=''){ overlay.className = 'overlay ' + cls; overlay.innerHTML = html; overlay.hidden = false; overlay.scrollTop = 0; }
function showTitle(){
  showOverlay(`<div class="panel"><h1 class="logo">ZEEBOT'S<span>STAR MATH</span></h1>
    <p class="sub">Zeebot the robot needs a co-pilot! Ships are flying in with number crates. Pick the right answer within 8 seconds to power up, and dodge the zaps.</p>
    <button class="brick b-yellow big-btn" id="oStart">START ▸</button>
    <p class="muted">Works with a mouse or a touch screen. Keys 1–5 pick answers too.</p></div>`, 'clear');
  $('#oStart').onclick = () => { Sound.init(); Sound.beeps(6); showMap(); };
}
function showMap(){
  Game.run++;
  Ships.clear(); Timer.reset(); stage.classList.remove('bosslvl'); Boss.reset(false); Robot.reset(); Robot.setPower(5); robotAnim.style.opacity='1'; Game.busy = true; Game.cur = null;
  $('#hudTitle').textContent = "Zeebot's Star Math"; $('#pips').innerHTML=''; Game.setAnswers(null);
  const m = MISSIONS[0], ms = Save.mission(m.id);
  const opLabel = L => L.boss ? 'BOSS · × ÷' : (L.op==='mix' ? '× ÷ mix' : (L.op==='mul'?'× ':'÷ ') + (L.tables.length>5 ? 'all' : L.tables.join(', ')));
  showOverlay(`<div class="panel">
    <div><div class="mission-tag">${m.name.toUpperCase()}</div><h2 class="h2">${m.title}</h2></div>
    <p class="sub">${m.intro}</p>
    <div class="levels">${m.levels.map((L,i)=>{
      const open = i < Math.max(ms.unlocked, OPEN_LEVELS), st = ms.stars[i]||0, col = L.boss?'b-red':['b-yellow','b-blue','b-green','b-orange','b-teal'][i%5];
      return `<button class="brick lv ${col} ${open?'':'locked'}" data-li="${i}" ${open?'':'aria-disabled="true"'}>
        <span class="n">${open? i+1 : '🔒'}</span><span class="nm">${L.name}</span><span class="opl">${opLabel(L)}</span>
        <span class="st">${open ? '★'.repeat(st)+'☆'.repeat(3-st) : ''}</span></button>`; }).join('')}</div>
    <div class="row"><button class="brick b-purple big-btn" id="oCrew">CREW CARDS ${Save.d.crew.length}/${CREW.length}</button></div>
    <div class="coming">Mission 2 is coming soon. Your crew cards will fly with you.</div></div>`);
  overlay.querySelectorAll('.lv').forEach(b => b.onclick = () => { const i=+b.dataset.li; if(i < Math.max(ms.unlocked, OPEN_LEVELS)){ Sound.init(); Sound.click(); Game.start(i); } else { Sound.tone(200,0,.15,'square',.06); Robot.say('Locked!', 'Finish the level before it', 1400); } });
  $('#oCrew').onclick = showCrew;
}
function showCrew(){
  Sound.click();
  showOverlay(`<div class="panel"><div><div class="mission-tag">YOUR CREW</div><h2 class="h2">Crew cards ${Save.d.crew.length}/${CREW.length}</h2></div>
    <p class="sub">Win a card by clearing a level for the first time. Tap a card to see it up close and pick your co-pilot.</p>
    <div class="cards">${CREW.map(c=>cardHTML(c,{locked:!Save.hasCrew(c.id)})).join('')}</div>
    <button class="brick b-blue big-btn" id="oBack">◂ MAP</button></div>`);
  overlay.querySelectorAll('.cards .card[data-id]').forEach(el => el.onclick = () => showCard(el.dataset.id));
  $('#oBack').onclick = showMap;
}
function showCard(id){
  const c = CREW.find(x=>x.id===id); Sound.beeps(3);
  const isCo = Save.d.copilot === id;
  showOverlay(`<div class="panel">${cardHTML(c,{big:true})}
    <div class="row"><button class="brick ${isCo?'b-teal':'b-yellow'} big-btn" id="oCo">${isCo?'CO-PILOT ✓':'MAKE CO-PILOT'}</button><button class="brick b-blue big-btn" id="oBack">◂ CREW</button></div>
    <p class="muted">Your co-pilot hovers next to Zeebot and cheers for every right answer.</p></div>`);
  tiltable(overlay.querySelector('.big-card'));
  $('#oCo').onclick = () => { Save.d.copilot = isCo ? null : id; Save.write(); renderCopilot(); Sound.correct(); showCard(id); };
  $('#oBack').onclick = showCrew;
}
$('#btnMap').onclick = () => { Sound.init(); Sound.click(); showMap(); };
$('#btnCards').onclick = () => { Sound.init(); showCrew(); };
const sb = $('#btnSound'); const paintSound = () => { sb.textContent = Save.d.sound ? '♪' : '✕'; sb.setAttribute('aria-pressed', Save.d.sound); };
sb.onclick = () => { Save.d.sound = !Save.d.sound; Save.write(); paintSound(); Sound.init(); Sound.click(); }; paintSound();

/* =====================================================================
   STARFIELD + main loop
   ===================================================================== */
const cv = $('#stars'), cx = cv.getContext('2d'); let stars = [], dust = [], SW = 0, SH = 0;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeStars(){
  const dpr = Math.min(2, devicePixelRatio||1); SW = stage.clientWidth; SH = stage.clientHeight;
  cv.width = SW*dpr; cv.height = SH*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  dust = Array.from({length: Math.round(SW*SH/500)}, () => ({ x:Math.random()*SW, y:Math.random()*SH, a:Math.random()*.6+.2, t:Math.random()*6 }));
  stars = Array.from({length: Math.round(SW*SH/2600)}, () => ({ x:Math.random()*SW, y:Math.random()*SH, z:Math.random()*.9+.1, t:Math.random()*6 }));
}
function drawStars(dt){
  const g = cx.createLinearGradient(0,0,0,SH); g.addColorStop(0,'#0a0e2c'); g.addColorStop(1,'#1b1f63');
  cx.fillStyle = g; cx.fillRect(0,0,SW,SH);
  const n1 = cx.createRadialGradient(SW*.2,SH*.3,0,SW*.2,SH*.3,SW*.45); n1.addColorStop(0,'rgba(142,68,214,.28)'); n1.addColorStop(1,'rgba(142,68,214,0)');
  cx.fillStyle = n1; cx.fillRect(0,0,SW,SH);
  const n2 = cx.createRadialGradient(SW*.85,SH*.15,0,SW*.85,SH*.15,SW*.35); n2.addColorStop(0,'rgba(31,181,201,.2)'); n2.addColorStop(1,'rgba(31,181,201,0)');
  cx.fillStyle = n2; cx.fillRect(0,0,SW,SH);
  if(stage.classList.contains('bosslvl')) for(const d of dust){ d.t += dt*3; cx.fillStyle = `rgba(255,240,220,${(d.a*(.5+.5*Math.sin(d.t))).toFixed(2)})`; cx.fillRect(d.x, d.y, 1, 1); }
  for(const s of stars){
    if(!still){ s.x -= s.z*s.z*40*dt; if(s.x < -2){ s.x = SW+2; s.y = Math.random()*SH; } s.t += dt*2; }
    const a = .45 + .55*Math.abs(Math.sin(s.t));
    cx.fillStyle = `rgba(255,255,255,${(a*s.z).toFixed(2)})`; const r = s.z*1.8; cx.fillRect(s.x, s.y, r, r);
  }
}
let last = performance.now();
function loop(now){ const dt = Math.min(.05,(now-last)/1000); last = now; drawStars(dt); Robot.updateEyes(); requestAnimationFrame(loop); }
new ResizeObserver(sizeStars).observe(stage); sizeStars(); requestAnimationFrame(loop);

renderCopilot(); Game.setAnswers(null); showTitle();
window.__bleep = { Game, Save, MISSIONS, CREW };
if('serviceWorker' in navigator && location.protocol==='https:') addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
